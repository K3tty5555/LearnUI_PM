name: Verify and deploy to the Singapore mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    # Playwright 1.58 cannot install Chromium dependencies on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build static site
        run: python3 build.py
      - name: Prepare site paths (/UIUX)
        run: python3 scripts/prepare-pages.py site --base /UIUX
      - name: Verify generated links and assets
        run: python3 scripts/verify-site.py site --base /UIUX
      - name: Verify catalog performance budgets
        run: python3 scripts/verify-performance.py site
      - name: Install animation test browser
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: Verify live specimen behavior
        run: python3 scripts/test-live-demos.py site --base /UIUX
      - name: Verify catalog specimens are never cut off
        run: python3 scripts/test-catalog-states.py site --base /UIUX --shots catalog-shots
      - name: Keep screenshots of cut-off catalog cards
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-shots
          path: catalog-shots/
          if-no-files-found: ignore
      - name: Verify logo placement
        run: python3 scripts/test-logo-layout.py site --base /UIUX
      - name: Verify graphic design layout
        run: python3 scripts/test-graphics-layout.py site --base /UIUX
      - name: Verify text follows the window width
        run: python3 scripts/test-text-width.py site --base /UIUX
      - name: Verify mobile language control
        run: python3 scripts/test-mobile-language.py site --base /UIUX
      - name: Verify copy and add-to-reference feedback
        run: python3 scripts/test-feedback.py site --base /UIUX
      - name: Verify ⌘K search results
        run: python3 scripts/test-command-search.py site --base /UIUX
      - name: Verify motion runs, and stops under reduced motion
        run: python3 scripts/test-motion.py site --base /UIUX
      - name: Rsync site to the Singapore mirror
        # Deploy only when every check above passes. SSH key is a repository secret
        # (SG_MIRROR_KEY); the server address is a secret too (SG_MIRROR_HOST) so it never
        # appears in this public repo. The host key is pinned below instead of trusted blindly.
        if: github.ref == 'refs/heads/main'
        env:
          SG_MIRROR_KEY: ${{ secrets.SG_MIRROR_KEY }}
          SG_MIRROR_HOST: ${{ secrets.SG_MIRROR_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SG_MIRROR_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # ssh looks the host key up by the address in the config (not the alias), so key by IP.
          test -n "$SG_MIRROR_HOST" || { echo 'SG_MIRROR_HOST secret missing'; exit 1; }
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKA7XwttYDRIoMr0D5NB8N9wH5AYU8hb738bnYPm0d2s\nsg-server ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKA7XwttYDRIoMr0D5NB8N9wH5AYU8hb738bnYPm0d2s\n' "$SG_MIRROR_HOST" > ~/.ssh/known_hosts
          printf 'Host sg-server\n  HostName %s\n  User ubuntu\n  IdentityFile ~/.ssh/id_ed25519\n' "$SG_MIRROR_HOST" > ~/.ssh/config
          rsync -az --delete site/ ubuntu@sg-server:/var/www/UIUX/
