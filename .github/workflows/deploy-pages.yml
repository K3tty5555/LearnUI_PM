name: Deploy Learn UI PM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        env:
          SITE_URL: https://K3tty5555.github.io/LearnUI_PM
        run: python3 build.py
      - name: Prepare project-site paths
        run: python3 scripts/prepare-pages.py site --base /LearnUI_PM
      - name: Verify generated links and assets
        run: python3 scripts/verify-site.py site --base /LearnUI_PM
      - name: Verify catalog performance budgets
        run: python3 scripts/verify-performance.py site
      - name: Install animation test browser
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: Verify live specimen behavior
        run: python3 scripts/test-live-demos.py site --base /LearnUI_PM
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
