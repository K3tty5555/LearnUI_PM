<div class="demo demo-cursor-spotlight">
  <div class="cs-stage">
    <span class="cs-head">Pick an edition</span>
    <div class="cs-row">
      <div class="cs-card"><div class="cs-in"><i class="cs-dot" style="background:#e9e4d8"></i><b class="cs-name">Paper</b><span class="cs-note">Warm white, oak base.</span><span class="cs-price">$129</span></div></div>
      <div class="cs-card"><div class="cs-in"><i class="cs-dot" style="background:#6b8cff"></i><b class="cs-name">Harbor</b><span class="cs-note">Blue steel, brass dial.</span><span class="cs-price">$139</span></div></div>
      <div class="cs-card"><div class="cs-in"><i class="cs-dot" style="background:#ffb36b"></i><b class="cs-name">Ember</b><span class="cs-note">Black shell, amber glow.</span><span class="cs-price">$149</span></div></div>
    </div>
    <svg class="cs-ghost" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 1.5v12l3.4-3.1 2.2 4.8 2-.9-2.2-4.7H12z"/></svg>
  </div>
  <p class="cs-read"><code>spotlight at 0, 0 · radius 160px</code></p>
</div>
<style>
.demo-cursor-spotlight{width:min(560px,calc(100vw - 80px));color:#f4f4f5;font:13px/1.45 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.demo-cursor-spotlight *{box-sizing:border-box}
.cs-stage{position:relative;height:236px;border-radius:14px;overflow:hidden;background:#0c0d10;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 22px}
.cs-head{color:#8b8e98;font-size:11px;letter-spacing:.06em}
.cs-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* The 1px gap between the outer and inner box is the border; its gradient is brightest where the pointer is. */
.cs-card{padding:1px;border-radius:14px;background:radial-gradient(var(--cs-r,160px) circle at var(--x,-999px) var(--y,-999px),rgba(255,206,140,var(--o,0)),transparent 70%),#26282f}
.cs-in{position:relative;display:flex;flex-direction:column;gap:3px;min-height:130px;padding:14px;border-radius:13px;background:radial-gradient(calc(var(--cs-r,160px) * 1.2) circle at var(--x,-999px) var(--y,-999px),rgba(255,190,120,calc(var(--o,0) * .22)),transparent 70%),#15161b}
.cs-dot{width:14px;height:14px;border-radius:50%;margin-bottom:8px;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.cs-name{font-size:14px}
.cs-note{color:#9a9ca6;font-size:11px}
.cs-price{margin-top:auto;font:600 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#ffd9a8}
.cs-ghost{position:absolute;left:0;top:0;width:16px;height:16px;fill:#fff;stroke:#111;stroke-width:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));pointer-events:none;opacity:0;transition:opacity .3s}
.demo-cursor-spotlight[data-auto="on"] .cs-ghost{opacity:1}
.cs-read{margin:7px 0 0;color:#6b6f7a;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}
@media (max-width:760px){.cs-stage{padding:0 14px}.cs-row{gap:7px}.cs-in{padding:11px}}
@media (max-height:260px){
  .demo-cursor-spotlight{width:calc(100vw - 40px)}
  .cs-stage{height:calc(100vh - 40px);padding:0 12px;gap:6px}
  .cs-head{font-size:9.5px}.cs-row{gap:7px}
  .cs-card{border-radius:11px}.cs-in{min-height:0;height:98px;padding:9px;border-radius:10px;gap:1px}
  .cs-dot{width:10px;height:10px;margin-bottom:5px}.cs-name{font-size:11.5px}.cs-note{font-size:9px;line-height:1.3}.cs-price{font-size:11.5px}
  .cs-read{display:none}
}
</style>
<script>
(function(){
  var root=document.currentScript.parentElement.querySelector('.demo-cursor-spotlight');
  var stage=root.querySelector('.cs-stage'),ghost=root.querySelector('.cs-ghost'),read=root.querySelector('.cs-read code'),head=root.querySelector('.cs-head');
  var cards=[].slice.call(root.querySelectorAll('.cs-card'));
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var auto=!reduce,visible=true,raf=0,start=performance.now(),last=start,idle,tx=0,ty=0,x=0,y=0,o=0,to=0;
  var EN=[['Paper','Warm white, oak base.'],['Harbor','Blue steel, brass dial.'],['Ember','Black shell, amber glow.']];
  var ZH=[['纸白','暖白灯身，橡木底座。'],['港湾','钢蓝灯身，黄铜旋钮。'],['余烬','黑色外壳，琥珀色光。']];
  function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en';}
  function text(){var d=zh()?ZH:EN;head.textContent=zh()?'选一个版本':'Pick an edition';cards.forEach(function(c,i){c.querySelector('.cs-name').textContent=d[i][0];c.querySelector('.cs-note').textContent=d[i][1];});}
  function setAuto(v){auto=v;root.dataset.auto=v?'on':'off';}
  // One pointer position for the whole row; each card gets it in its own coordinates, so light spills across neighbours too.
  function paint(){
    var s=stage.getBoundingClientRect(),R=Math.round(Math.min(160,stage.clientWidth*.42));
    cards.forEach(function(c){var r=c.getBoundingClientRect();c.style.setProperty('--x',(x-(r.left-s.left)).toFixed(1)+'px');c.style.setProperty('--y',(y-(r.top-s.top)).toFixed(1)+'px');c.style.setProperty('--o',o.toFixed(3));c.style.setProperty('--cs-r',R+'px');});
    read.textContent=o>.05?'spotlight at '+Math.round(x)+', '+Math.round(y)+' · radius '+R+'px · border lights up nearby':'pointer away · spotlight fades out';
  }
  function autoPoint(t){var w=stage.clientWidth,h=stage.clientHeight;return [w*.5+w*.38*Math.sin(t*.9),h*.55+h*.24*Math.sin(t*1.7+.8)];}
  stage.addEventListener('pointermove',function(e){if(root.dataset.auto==='on')setAuto(false);clearTimeout(idle);var s=stage.getBoundingClientRect();tx=e.clientX-s.left;ty=e.clientY-s.top;to=1;resume();});
  stage.addEventListener('pointerleave',function(){to=0;clearTimeout(idle);idle=setTimeout(function(){if(!reduce){setAuto(true);start=performance.now();resume();}},1800);});
  function tick(now){
    raf=0;if(!visible)return;var dt=Math.min(.05,(now-last)/1000);last=now;
    if(auto){var p=autoPoint(Math.max(0,now-start)/1000);tx=p[0];ty=p[1];to=1;ghost.style.transform='translate('+p[0].toFixed(1)+'px,'+p[1].toFixed(1)+'px)';}
    var k=reduce?1:1-Math.pow(.0005,dt),ko=reduce?1:1-Math.pow(.02,dt);x+=(tx-x)*k;y+=(ty-y)*k;o+=(to-o)*ko;
    paint();
    raf=requestAnimationFrame(tick);
  }
  function resume(){if(reduce&&root.dataset.auto==='on')return;if(!raf&&visible){last=performance.now();raf=requestAnimationFrame(tick);}}
  if('IntersectionObserver' in window)new IntersectionObserver(function(es){visible=es[0].isIntersecting;resume();}).observe(stage);
  document.addEventListener('learnui:languagechange',text);
  text();setAuto(auto);
  if(reduce){
    root.dataset.auto='on';var s=stage.getBoundingClientRect(),r=cards[1].getBoundingClientRect();x=tx=r.left-s.left+r.width*.62;y=ty=r.top-s.top+r.height*.3;o=to=1;paint();
    ghost.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';
  }
  resume();
})();
</script>
