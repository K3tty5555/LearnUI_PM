<div class="demo demo-ix-details" data-auto="on">
  <div class="ix-bar">

  </div>
  <div class="ix-stage">
    <span class="ix-badge"></span>
    <div class="ix-panel"></div>
    <svg class="ix-ghost" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 1.5v12l3.4-3.1 2.2 4.8 2-.9-2.2-4.7H12z"/></svg>
  </div>
  <p class="ix-note"></p>
</div>
<style>
.demo-ix-details{--ix-ink:#1f2430;--ix-muted:#6b7180;--ix-line:#e3e6ee;--ix-accent:#4c6ef5;width:min(560px,calc(100vw - 80px));color:var(--ix-ink);font:12px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.demo-ix-details *{box-sizing:border-box}
.ix-bar{display:flex;align-items:center;gap:6px;padding-bottom:6px}
.ix-tabs{flex:1 1 auto;min-width:0;display:flex;gap:4px;overflow:auto;scrollbar-width:none;scroll-behavior:smooth}
.ix-tabs::-webkit-scrollbar{display:none}
.ix-tabs button{flex:0 0 auto;border:1px solid var(--ix-line);border-radius:999px;background:#fff;color:var(--ix-muted);padding:5px 9px;font:600 10px/1 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;white-space:nowrap;cursor:pointer}
.ix-tabs button[aria-selected="true"]{background:var(--ix-ink);border-color:var(--ix-ink);color:#fff}
.ix-tabs button:focus-visible,.ix-btn:focus-visible{outline:2px solid var(--ix-accent);outline-offset:2px}
.ix-step{flex:0 0 auto;color:var(--ix-muted);font:600 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}
.ix-stage{position:relative;height:236px;border-radius:14px;background:#f4f6fa;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.ix-panel{position:absolute;inset:0}
.ix-badge{position:absolute;left:10px;top:10px;z-index:6;padding:4px 8px;border-radius:999px;background:var(--ix-ink);color:#fff;font:600 9.5px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;pointer-events:none;display:none}
.ix-ghost{position:absolute;left:0;top:0;z-index:9;width:16px;height:16px;fill:#fff;stroke:#111;stroke-width:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));pointer-events:none;opacity:0;transition:opacity .25s}
.demo-ix-details[data-auto="on"] .ix-ghost{opacity:1}
.ix-note{margin:7px 0 0;min-height:34px;color:var(--ix-muted);font-size:11.5px;line-height:1.5}
.ix-note b{color:var(--ix-ink)}
.ix-btn{position:absolute;padding:6px 11px;border:0;border-radius:8px;background:var(--ix-ink);color:#fff;font:600 11px/1 system-ui,-apple-system,"PingFang SC",sans-serif;cursor:pointer;z-index:4}
.ix-tag{position:absolute;z-index:5;padding:2px 6px;border-radius:4px;background:var(--ix-accent);color:#fff;font:700 8.5px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;pointer-events:none}
/* 1 fan */
.ix-fan-card{position:absolute;left:50%;top:44px;width:74px;height:100px;margin-left:-37px;border-radius:10px;box-shadow:0 6px 14px rgba(20,30,60,.16);transition:transform .5s cubic-bezier(.2,.9,.25,1.1)}
.ix-origin{position:absolute;left:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#e8590c;box-shadow:0 0 0 4px rgba(232,89,12,.2);z-index:3}
.ix-origin-line{position:absolute;left:50%;width:0;border-left:1px dashed #e8590c;z-index:2}
/* 2 wheel */
.ix-wheel{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;overflow:hidden;border-radius:12px;background:#fff;box-shadow:0 4px 14px rgba(20,30,60,.08);cursor:grab;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.ix-wheel-band{position:absolute;left:8px;right:8px;top:50%;height:30px;margin-top:-15px;border-radius:8px;background:#eef1f8}
.ix-wheel-list{position:absolute;left:0;right:0;top:0}
.ix-wheel-list span{display:block;height:30px;text-align:center;font:600 16px/30px ui-monospace,SFMono-Regular,Menlo,monospace}
.ix-meter{position:absolute;right:12px;bottom:10px;font:600 9px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ix-muted);text-align:right}
/* 3 sheet */
.ix-dim{position:absolute;inset:0;background:rgba(20,24,35,.35);transition:opacity .3s}
.ix-sheet{position:absolute;left:12%;right:12%;bottom:0;height:150px;border-radius:16px 16px 0 0;background:#fff;box-shadow:0 -6px 20px rgba(0,0,0,.12);cursor:grab;will-change:transform}
.ix-sheet:before{content:"";position:absolute;left:50%;top:7px;width:34px;height:4px;margin-left:-17px;border-radius:2px;background:#ced4da}
.ix-sheet-row{height:10px;margin:0 16px 8px;border-radius:5px;background:#eef1f6}
.ix-sheet-row:first-of-type{margin-top:26px;width:50%;background:#dee2e6}
/* 4 cart */
.ix-product{position:absolute;left:24px;bottom:22px;width:110px;padding:8px;border-radius:12px;background:#fff;box-shadow:0 4px 12px rgba(20,30,60,.08)}
.ix-product i{display:block;height:58px;border-radius:8px;background:linear-gradient(135deg,#ffd8a8,#f76707)}
.ix-product b{display:block;margin-top:5px;font-size:10px}
.ix-cart{position:absolute;right:22px;top:16px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(20,30,60,.1);display:grid;place-items:center;transition:transform .2s}
.ix-cart svg{width:18px;height:18px;fill:none;stroke:var(--ix-ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ix-cart em{position:absolute;right:-4px;top:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#e03131;color:#fff;font:700 9px/16px system-ui;font-style:normal;text-align:center}
.ix-cart.is-bump{transform:scale(1.18)}
.ix-fly-x{position:absolute;left:0;top:0;z-index:5;pointer-events:none}
.ix-fly-y{width:16px;height:16px;border-radius:50%;background:#f76707;box-shadow:0 2px 6px rgba(247,103,7,.5)}
/* 5 large title */
.ix-phone{position:absolute;left:50%;top:10px;bottom:10px;width:200px;margin-left:-100px;border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 4px 14px rgba(20,30,60,.08)}
.ix-navbar{position:absolute;left:0;right:0;top:0;height:34px;z-index:2;border-bottom:1px solid transparent}
.ix-navbar-bg{position:absolute;inset:0;background:rgba(248,249,252,.96);border-bottom:1px solid var(--ix-line)}
.ix-title{position:absolute;left:14px;top:40px;z-index:3;font:750 22px/1 system-ui,-apple-system,"PingFang SC",sans-serif;transform-origin:0 50%;will-change:transform}
.ix-scroll{position:absolute;left:0;right:0;top:76px;padding:0 14px}
.ix-scroll i{display:block;height:24px;margin-bottom:7px;border-radius:6px;background:#f1f3f5}
/* 6 reorder */
.ix-list{position:absolute;left:50%;top:22px;width:220px;margin-left:-110px}
.ix-row{position:absolute;left:0;right:0;height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--ix-line);border-radius:9px;background:#fff;font-size:11px;font-weight:600;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .2s;cursor:grab}
.ix-row i{width:16px;height:16px;border-radius:4px}
.ix-row.is-dragging{transition:box-shadow .2s;box-shadow:0 10px 22px rgba(20,30,60,.18);z-index:3;cursor:grabbing}
.ix-row s{margin-left:auto;text-decoration:none;color:#adb5bd;letter-spacing:-1px}
/* 7 FLIP */
.ix-grid{position:absolute;left:50%;top:30px;display:grid;grid-template-columns:repeat(3,52px);gap:8px;margin-left:-86px}
.ix-thumb{height:52px;border-radius:8px;cursor:zoom-in}
.ix-big{position:absolute;left:50%;top:14px;width:220px;height:150px;margin-left:-110px;border-radius:12px;transform-origin:0 0;z-index:4;box-shadow:0 14px 30px rgba(20,30,60,.25);cursor:zoom-out}
/* 8 ink */
.ix-pads{position:absolute;inset:26px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ix-pad{position:relative;border-radius:10px;background:#fff;box-shadow:0 2px 8px rgba(20,30,60,.06);cursor:crosshair}
.ix-pad canvas{position:absolute;inset:0;width:100%;height:100%}
.ix-pad span{position:absolute;left:8px;bottom:6px;font:600 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ix-muted)}
/* 9 gooey badge */
.ix-chat-row{position:absolute;left:50%;top:50%;width:230px;height:56px;margin:-28px 0 0 -115px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:12px;background:#fff;box-shadow:0 4px 12px rgba(20,30,60,.08)}
.ix-chat-row i{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#a5d8ff,#4c6ef5)}
.ix-chat-row b{font-size:11px}
.ix-goo{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:4}
.ix-dot-hit{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;z-index:5;cursor:grab}
/* 10 page transition */
.ix-nav{position:absolute;left:50%;top:10px;bottom:10px;width:200px;margin-left:-100px;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 4px 14px rgba(20,30,60,.1)}
.ix-page{position:absolute;inset:0;padding:40px 14px 14px;background:#fff;will-change:transform}
.ix-page h4{margin:0 0 10px;font-size:15px}
.ix-page i{display:block;height:22px;margin-bottom:7px;border-radius:6px;background:#f1f3f5}
.ix-page-b{background:#fff8f0;box-shadow:-8px 0 18px rgba(0,0,0,.18)}
.ix-page-b i{background:#ffe8cc}
.ix-shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
@media (max-width:760px){.ix-stage{height:226px}}
@media (max-height:260px){
  .demo-ix-details{width:calc(100vw - 40px)}
  .ix-bar,.ix-note{display:none}
  .ix-stage{height:calc(100vh - 40px);max-height:160px;min-height:120px}
  .ix-badge{display:block;left:6px;top:6px;font-size:9px}
  .ix-panel{transform:scale(.7);transform-origin:50% 58%}
  .ix-btn{display:none}
  /* Catalog card: four rows on a 30px pitch fit the 148px stage (dev-log 014). */
  .ix-row{height:26px;font-size:10px}
}
@media (prefers-reduced-motion:reduce){.demo-ix-details *{transition:none!important}}
</style>

  var PAL=['linear-gradient(135deg,#ffa8a8,#e64980)','linear-gradient(135deg,#91a7ff,#4263eb)','linear-gradient(135deg,#8ce99a,#2f9e44)','linear-gradient(135deg,#ffe066,#f08c00)','linear-gradient(135deg,#d0bfff,#7048e8)','linear-gradient(135deg,#99e9f2,#1098ad)'];

  var DEMOS=[
  {id:'fan',name:['卡堆扇形展开','Stack to fan'],note:[['变换原点挪到卡片外面','旋转中心放在卡片下方远处，几张卡绕同一点散开才像扇子；展开和收起共用同一套布局，只改角度。'],['Move the transform origin outside the card','rotate every card around one point far below them, and let open and closed share one layout.']],
   build:function(){var cards=[0,1,2,3].map(function(i){var c=el('div','ix-fan-card');c.style.background=PAL[i];c.style.transformOrigin='50% 210%';return c;});
     var oy=44+100*2.1;var line=el('div','ix-origin-line');line.style.top='144px';line.style.height=(oy-144)+'px';var dot=el('span','ix-origin');dot.style.top=Math.min(oy,H()-14)+'px';

     var b=el('button','ix-btn',null,zh()?'展开 / 收起':'Fan / stack');b.style.right='12px';b.style.bottom='12px';b.addEventListener('click',function(){stopAuto();set(!open)});
     return function(){ghostTo(W()-60,H()-24);later(function(){set(true)},700);later(function(){set(false)},2300);later(function(){set(true)},3600);return 5200;};}},
  {id:'wheel',name:['滚轮选择器','Wheel picker'],note:[['松手后速度先逐帧衰减，快停了才吸附','惯性和吸附同时做就会抖；先让速度每帧乘 0.94 慢慢变小，低于阈值再吸到最近一格。'],['Decay velocity every frame, snap only when nearly stopped','doing inertia and snapping at once jitters; multiply speed by 0.94 per frame, then snap below a threshold.']],
   build:function(){var wrap=el('div','ix-wheel');wrap.setAttribute('data-clip-ok','');el('div','ix-wheel-band',wrap);var list=el('div','ix-wheel-list',wrap);for(var i=0;i<60;i++)el('span','',list,String(i).padStart(2,'0'));
     var meter=el('div','ix-meter');var y=-15*30,v=0,state='idle',ROW=30,mid=60;
     function render(){list.style.transform='translateY('+(mid-15+y).toFixed(1)+'px)';meter.textContent=(zh()?'速度 ':'v ')+v.toFixed(2)+' · '+(state==='inertia'?(zh()?'惯性衰减':'decaying'):state==='snap'?(zh()?'吸附中':'snapping'):(zh()?'停住':'at rest'));}

     render();return function(){var cx=W()/2;ghostTo(cx,H()/2+40);later(function(){ghostTo(cx,H()/2-50,350);v=-1.6;state='inertia';},700);later(function(){ghostTo(cx,H()/2+40);},2600);later(function(){ghostTo(cx,H()/2-10,300);v=.9;state='inertia';},3200);return 5600;};}},
  {id:'sheet',name:['半屏浮层','Bottom sheet'],note:[['位移或速度满足一个就关','只看拖了多远会漏掉「轻轻一甩」；拖过 40% 高度，或者松手速度够快，都应该关掉。'],['Close on distance OR velocity','distance alone misses a quick flick; close past 40% of the height or above a release speed.']],
   build:function(){var dim=el('div','ix-dim'),sh=el('div','ix-sheet');sh.setAttribute('data-clip-ok','');for(var i=0;i<4;i++)el('div','ix-sheet-row',sh);var tag=el('span','ix-tag');tag.style.left='12px';tag.style.bottom='164px';tag.style.opacity=0;
     var y=0,open=true,anim=null,H0=150;function set(v,ms){sh.style.transition=ms?'transform '+ms+'ms cubic-bezier(.2,.8,.2,1)':'none';y=v;sh.style.transform='translateY('+v+'px)';dim.style.opacity=String(Math.max(0,1-v/H0)*1);}
     function say(t){tag.textContent=t;tag.style.opacity=1;later(function(){tag.style.opacity=0},1400);}

     drag(sh,{move:function(p,d){set(Math.max(0,d[1]),0)},up:function(v,d){release(v[1],d[1])}});set(0,0);
     return function(){var cx=W()/2,top=H()-H0+16;ghostTo(cx,top);later(function(){ghostTo(cx,top+22,250);set(22,250)},600);later(function(){release(.9,22)},900);
       later(function(){ghostTo(cx,top)},2700);later(function(){ghostTo(cx,top+40,900);set(40,900)},3100);later(function(){release(.05,40)},4100);return 6000;};}},
  {id:'cart',name:['加购飞入角标','Fly to cart'],note:[['横向匀速、纵向缓出，拆成两层','一条弧线用一个变换写不出来：外层只管横向（linear），内层只管纵向（ease-out），叠起来就是抛物线。'],['Split the arc into two layers','an outer layer moves x linearly, an inner layer moves y with ease-out; together they trace a curve.']],
   build:function(){var pr=el('div','ix-product',null,'<i></i><b>'+(zh()?'手冲咖啡壶':'Pour-over kettle')+'</b>');var cart=el('div','ix-cart',null,'<svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg><em>2</em>');

  {id:'title',name:['大标题折叠','Large title collapse'],note:[['全部挂在同一个滚动进度上','缩放、横移、上移和导航栏底色不要写成四段动画，都由同一个 0→1 的进度算出来，才像同一件事。'],['Drive everything from one scroll progress','scale, x, y and the bar background all derive from one 0→1 value, so they read as one motion.']],
   build:function(){var ph=el('div','ix-phone'),bar=el('div','ix-navbar',ph),bg=el('div','ix-navbar-bg',bar),title=el('div','ix-title',ph,zh()?'收件箱':'Inbox'),sc=el('div','ix-scroll',ph);sc.setAttribute('data-clip-ok','');for(var i=0;i<9;i++)el('i','',sc);
     var tag=el('span','ix-tag');tag.style.right='10px';tag.style.bottom='10px';var p=0,target=0;

   build:function(){var row=el('div','ix-chat-row',null,'<i></i><b>'+(zh()?'设计组 · 12 条新消息':'Design team · 12 new')+'</b>');var cv=el('canvas','ix-goo'),hit=el('div','ix-dot-hit');
