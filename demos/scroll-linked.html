<div class="demo demo-scroll-linked">
  <div class="sl-track"><div class="sl-fill"></div><span class="sl-dot"></span></div>
  <div class="sl-stage"><div class="sl-orb" data-clip-ok></div><div><b>Scroll-linked</b><small>progress follows position</small></div></div>
  <div class="sl-meta"><span>0%</span><strong class="sl-pct">48%</strong><span>100%</span></div>
</div>
<style>
.demo-scroll-linked{font:12px/1.35 system-ui,-apple-system,sans-serif;color:#20232a;max-width:100%}.sl-track{position:relative;height:8px;margin:12px 4px 22px;border-radius:999px;background:#e7ebf0}.sl-fill{width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#2563eb,#8b5cf6);transform-origin:left;transform:scaleX(0)}.sl-dot{position:absolute;left:0;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #2563eb;transform:translate(-50%,-50%);box-shadow:0 2px 8px #2563eb40}.sl-stage{height:90px;display:flex;align-items:center;justify-content:center;gap:14px;border:1px solid #dfe3e8;border-radius:12px;background:linear-gradient(135deg,#f8fafc,#eef2ff);overflow:hidden}.sl-orb{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4b5fd,#4f46e5 70%);transform:translateX(0) scale(.72);box-shadow:0 12px 22px #4f46e540}.sl-stage b,.sl-stage small{display:block}.sl-stage small{margin-top:4px;color:#7a8492;font-size:10px}.sl-meta{display:flex;justify-content:space-between;margin-top:8px;color:#7a8492;font:10px ui-monospace,monospace}.sl-meta strong{color:#4f46e5}@media(prefers-reduced-motion:reduce){.sl-orb{transform:none!important}.sl-fill{transform:scaleX(.48)!important}.sl-dot{left:48%!important}}
</style>
<script>(function(){var r=document.currentScript.parentElement,f=r.querySelector('.sl-fill'),d=r.querySelector('.sl-dot'),o=r.querySelector('.sl-orb'),p=r.querySelector('.sl-pct'),t=0,last=performance.now();function tick(now){var dt=now-last;last=now;t=(t+dt*.00008)%1;var v=(Math.sin(t*Math.PI*2)+1)/2;f.style.transform='scaleX('+v+')';d.style.left=(v*100)+'%';o.style.transform='translateX('+(v*54-27)+'px) scale('+(0.72+v*.2)+')';p.textContent=Math.round(v*100)+'%';requestAnimationFrame(tick)}if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(tick)})();</script>
