<div class="demo demo-scroll-triggered">
  <div class="st-viewport"><div class="st-card st-card-a"><b>01</b><span>Scroll-triggered</span><small>enters → reveals</small></div><div class="st-card st-card-b"><b>02</b><span>In-view content</span><small>plays once</small></div><div class="st-card st-card-c"><b>03</b><span>Final state stays</span><small>readable after motion</small></div></div>
  <div class="st-caption"><span>IntersectionObserver</span><strong>in-view</strong></div>
</div>
<style>
.demo-scroll-triggered{font:12px/1.35 system-ui,-apple-system,sans-serif;color:#20232a;max-width:100%}.st-viewport{height:145px;overflow:hidden;padding:12px;display:grid;gap:8px;border:1px solid #dfe3e8;border-radius:12px;background:linear-gradient(180deg,#f8fafc,#eef2f7)}.st-card{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:10px 12px;border:1px solid #dfe3e8;border-radius:9px;background:#fff;box-shadow:0 4px 12px #1e293b0d;opacity:.28;transform:translateY(13px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.75,.25,1)}.st-card b{color:#2563eb;font:600 11px ui-monospace,monospace}.st-card span{font-weight:600}.st-card small{color:#7a8492}.st-card.is-in{opacity:1;transform:none}.st-card-b{transition-delay:.12s}.st-card-c{transition-delay:.24s}.st-caption{display:flex;justify-content:space-between;margin-top:8px;color:#7a8492;font-size:10px}.st-caption strong{color:#2563eb;font:600 10px ui-monospace,monospace}@media(prefers-reduced-motion:reduce){.st-card{opacity:1;transform:none;transition:none}}
</style>
<script>(function(){var root=document.currentScript.parentElement, cards=[].slice.call(root.querySelectorAll('.st-card'));if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){cards.forEach(function(c){c.classList.add('is-in')});return}var i=0;function reveal(){if(i<cards.length){cards[i++].classList.add('is-in');setTimeout(reveal,650)}else{setTimeout(function(){cards.forEach(function(c){c.classList.remove('is-in')});i=0;setTimeout(reveal,450)},1700)}}setTimeout(reveal,300)})();</script>
