<div class="demo demo-scroll-zoom">
  <div class="sz-viewport" tabindex="0" aria-label="Scroll inside to zoom out">
    <div class="sz-track">
      <div class="sz-sticky">
        <div class="sz-frame">
          <div class="sz-scene" aria-hidden="true">
            <svg class="sz-art" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">
              <defs>
                <radialGradient id="sz-sky" cx="70%" cy="20%" r="90%"><stop offset="0" stop-color="#2b1d3f"/><stop offset=".6" stop-color="#120d1c"/><stop offset="1" stop-color="#07060b"/></radialGradient>
                <linearGradient id="sz-petal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe4f1"/><stop offset=".55" stop-color="#f3a6c8"/><stop offset="1" stop-color="#b8579a"/></linearGradient>
                <linearGradient id="sz-stem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#3a6fd8"/></linearGradient>
              </defs>
              <rect width="400" height="240" fill="url(#sz-sky)"/>
              <g transform="translate(176 128) scale(.78)">
                <ellipse rx="34" ry="78" fill="url(#sz-petal)" transform="rotate(-38) translate(0 -54)" opacity=".95"/>
                <ellipse rx="30" ry="70" fill="url(#sz-petal)" transform="rotate(18) translate(0 -50)" opacity=".9"/>
                <ellipse rx="26" ry="62" fill="url(#sz-petal)" transform="rotate(70) translate(0 -46)" opacity=".85"/>
                <ellipse rx="24" ry="56" fill="url(#sz-petal)" transform="rotate(-88) translate(0 -42)" opacity=".8"/>
                <path d="M6 -40 C 30 -90 60 -96 78 -120" stroke="url(#sz-stem)" stroke-width="9" fill="none" stroke-linecap="round"/>
              </g>
              <path d="M226 240 C 226 196 240 178 262 170 C 248 160 242 146 244 128 C 247 104 266 92 286 96 C 306 100 316 120 312 142 C 310 156 302 166 292 172 C 318 180 336 200 338 240 Z" fill="#050407"/>
            </svg>
          </div>
        </div>
        <div class="sz-copy">
          <p class="sz-kicker">Room to imagine</p>
          <p class="sz-line">Make something you can step back from.</p>
        </div>
        <span class="sz-hint">Scroll</span>
      </div>
    </div>
  </div>
  <div class="sz-meta"><span class="sz-label">Scroll progress</span><i class="sz-bar"><b></b></i><code class="sz-read">scene 1.60× · frame 100%</code></div>
</div>
<style>
.demo-scroll-zoom{width:min(560px,calc(100vw - 80px));color:#20232a;font:12px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.demo-scroll-zoom *{box-sizing:border-box}
.sz-viewport{position:relative;height:264px;border-radius:14px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;background:#efeef3}
.sz-viewport::-webkit-scrollbar{display:none}
.sz-viewport:focus-visible{outline:2px solid #6d4aff;outline-offset:3px}
.sz-track{height:300%}
.sz-sticky{position:sticky;top:0;height:calc(100% / 3);overflow:hidden}
.sz-frame{position:absolute;inset:0;overflow:hidden;background:#07060b;transform-origin:50% 0;will-change:transform}
.sz-scene{position:absolute;inset:0;transform:scale(var(--sz-scale,1.6));transform-origin:58% 52%}
.sz-art{display:block;width:100%;height:100%}
.sz-copy{position:absolute;left:0;right:0;bottom:7%;text-align:center;opacity:var(--sz-copy,0);transform:translateY(calc((1 - var(--sz-copy,0)) * 10px));pointer-events:none}
.sz-kicker{margin:0;font:italic 600 18px/1.1 Georgia,"Times New Roman",serif;color:#1f1a2b}
.sz-line{margin:3px 0 0;font-size:10.5px;color:#5d5870}
.sz-hint{position:absolute;right:10px;top:10px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font:600 9.5px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:calc(1 - var(--sz-copy,0));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sz-meta{display:flex;align-items:center;gap:10px;margin-top:8px;color:#6b6f7a;font-size:10.5px}
.sz-bar{position:relative;flex:1;height:4px;border-radius:4px;background:#e2e1ea}
.sz-bar b{position:absolute;left:0;top:0;bottom:0;width:calc(var(--sz-p,0) * 100%);border-radius:inherit;background:#6d4aff}
.sz-read{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#6b6f7a;min-width:150px;text-align:right}
@media (max-width:760px){.sz-viewport{height:236px}.sz-read{display:none}}
@media (max-height:260px){
  .demo-scroll-zoom{width:calc(100vw - 40px)}
  .sz-viewport{height:calc(100vh - 44px);max-height:156px;min-height:118px}
  .sz-meta{display:none}
  .sz-kicker{font-size:13px}.sz-line{display:none}.sz-copy{bottom:5%}
}
</style>
<script>
(function(){
  var root=document.currentScript.parentElement.querySelector('.demo-scroll-zoom');
  var frame=root.querySelector('.sz-frame');
  var vp=root.querySelector('.sz-viewport'),read=root.querySelector('.sz-read'),label=root.querySelector('.sz-label'),hint=root.querySelector('.sz-hint');
  var kicker=root.querySelector('.sz-kicker'),line=root.querySelector('.sz-line');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var auto=!reduce,raf=0,visible=true,start=performance.now(),resumeTimer,setTop=-1;
  function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en';}
  function text(){
    kicker.textContent=zh()?'留一点想象的空间':'Room to imagine';
    line.textContent=zh()?'退后一步，才看得见全貌。':'Make something you can step back from.';
    label.textContent=zh()?'滚动进度':'Scroll progress';hint.textContent=zh()?'在画面里滚动':'Scroll';
    vp.setAttribute('aria-label',zh()?'在画面里滚动来拉远':'Scroll inside to zoom out');
  }
  function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
  // Progress 0 -> 1 pulls the camera back: the scene scales from 1.6 to 1 while the frame insets into a card.
  function render(p){
    var e=ease(Math.max(0,Math.min(1,p))),scale=1.6-.6*e,copy=Math.max(0,(e-.7)/.3);
    var s=root.style;
    s.setProperty('--sz-p',p.toFixed(3));s.setProperty('--sz-scale',scale.toFixed(3));
    // The whole frame shrinks toward the top (leaving room for the headline) while the scene inside zooms back to 1x,
    // so the final card shows the entire picture: a camera pulling back, not a crop.
    var compact=vp.clientHeight<170,f=1-(compact?.44:.34)*e;frame.style.transform='translateY('+(e*7).toFixed(2)+'%) scale('+f.toFixed(3)+')';frame.style.borderRadius=(e*16/f).toFixed(1)+'px';
    s.setProperty('--sz-copy',copy.toFixed(3));
    read.textContent='scene '+scale.toFixed(2)+'× · frame '+Math.round(f*100)+'%';
  }
  function progress(){var max=vp.scrollHeight-vp.clientHeight;return max>0?vp.scrollTop/max:0;}
  vp.addEventListener('scroll',function(){render(progress());if(Math.abs(vp.scrollTop-setTop)>2)pauseAuto();});
  function pauseAuto(){if(reduce)return;auto=false;clearTimeout(resumeTimer);resumeTimer=setTimeout(function(){auto=true;start=performance.now()-progressToTime(progress());},2600);}
  // The hub card is inert, so the demo scrolls itself: down over 2.4s, hold, then back up.
  var CYCLE=6200;
  function timeToProgress(t){var c=(t%CYCLE)/CYCLE;return c<.4?c/.4:c<.62?1:c<.9?1-(c-.62)/.28:0;}
  function progressToTime(p){return p*.4*CYCLE;}
  function tick(now){
    raf=0;if(!visible)return;
    if(auto){var max=vp.scrollHeight-vp.clientHeight;vp.scrollTop=timeToProgress(now-start)*max;setTop=vp.scrollTop;render(progress());}
    raf=requestAnimationFrame(tick);
  }
  function resume(){if(!raf&&visible)raf=requestAnimationFrame(tick);}
  ['wheel','touchstart','pointerdown','keydown'].forEach(function(ev){vp.addEventListener(ev,pauseAuto,{passive:true})});
  if('IntersectionObserver' in window)new IntersectionObserver(function(es){visible=es[0].isIntersecting;resume();}).observe(vp);
  document.addEventListener('learnui:languagechange',text);
  text();
  if(reduce){vp.scrollTop=vp.scrollHeight;render(1);}else{render(0);resume();}
})();
</script>
