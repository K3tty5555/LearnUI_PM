<div class="demo demo-agent-processing">
  <div class="agent-process-card"><div class="process-head"><div><strong class="process-title">Agent run</strong><span class="process-sub">Review repository and prepare a patch</span></div><button class="process-cancel" type="button">Cancel</button></div><ol class="process-steps"><li data-state="done"><span class="step-mark">✓</span><span><b>Read request</b><small>Input understood</small></span></li><li data-state="active"><span class="step-mark">2</span><span><b>Inspect files</b><small>Searching the project</small></span></li><li data-state="pending"><span class="step-mark">3</span><span><b>Prepare changes</b><small>Waiting</small></span></li></ol><div class="process-foot"><span class="process-live" role="status" aria-live="polite">Inspecting files…</span><button class="process-next" type="button">Advance step</button></div></div>
</div>
<style>
.demo-agent-processing{--p-ink:#20242c;--p-muted:#6d7480;--p-line:#dfe3e9;--p-blue:#315fc8;--p-soft:#f2f5ff;font:12px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--p-ink);width:100%;max-width:490px}.demo-agent-processing *{box-sizing:border-box}.agent-process-card{padding:15px;border:1px solid var(--p-line);border-radius:12px;background:#fff;box-shadow:0 8px 22px rgba(31,42,61,.07)}.process-head{display:flex;align-items:start;justify-content:space-between;gap:12px}.process-title,.process-sub{display:block}.process-title{font-size:14px}.process-sub{margin-top:3px;color:var(--p-muted);font-size:10px}.process-cancel,.process-next{border:1px solid var(--p-line);border-radius:6px;background:#fff;color:var(--p-ink);padding:6px 9px;font:600 10px inherit;cursor:pointer}.process-cancel:hover,.process-next:hover{border-color:#aebfe9;background:var(--p-soft)}.process-cancel:focus-visible,.process-next:focus-visible{outline:2px solid var(--p-blue);outline-offset:2px}.process-steps{display:grid;gap:8px;margin:17px 0 12px;padding:0;list-style:none}.process-steps li{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:9px;min-height:30px;color:var(--p-muted)}.process-steps li[data-state=active]{color:var(--p-ink)}.step-mark{display:grid;place-items:center;width:22px;height:22px;border:1px solid var(--p-line);border-radius:50%;font:600 10px ui-monospace,monospace}.process-steps li[data-state=done] .step-mark{border-color:#87b9a0;background:#edf8f1;color:#247047}.process-steps li[data-state=active] .step-mark{border-color:#9db3eb;background:var(--p-soft);color:var(--p-blue);box-shadow:0 0 0 3px #f3f6ff}.process-steps b,.process-steps small{display:block}.process-steps b{font-size:11px}.process-steps small{margin-top:2px;font-size:9px}.process-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #eef0f3;padding-top:11px}.process-live{color:var(--p-muted);font-size:10px}.process-next{color:var(--p-blue)}
@media (max-height: 260px) { .demo-agent-processing { transform: scale(.72); transform-origin: center; } }
</style>
<script>(function(){var root=document.currentScript.parentElement.querySelector('.demo-agent-processing'),next=root.querySelector('.process-next'),cancel=root.querySelector('.process-cancel'),live=root.querySelector('.process-live'),steps=[].slice.call(root.querySelectorAll('li')),labels=[['Inspecting files…','正在检查文件…'],['Preparing patch…','正在准备补丁…'],['Run complete','运行完成']];function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en'}function run(){var i=steps.findIndex(function(x){return x.dataset.state==='active'});if(i<0){i=1}steps.forEach(function(s,n){s.dataset.state=n<i?'done':n===i?'active':'pending';s.querySelector('.step-mark').textContent=n<i?'✓':n+1});var t=labels[Math.min(i,labels.length-1)];live.textContent=zh()?t[1]:t[0];next.textContent=i>=steps.length-1?(zh()?'重新运行':'Run again'):(zh()?'推进步骤':'Advance step');if(i>=steps.length-1)steps[steps.length-1].dataset.state='active'}next.addEventListener('click',run);cancel.addEventListener('click',function(){live.textContent=zh()?'已取消':'Run cancelled';steps.forEach(function(s){if(s.dataset.state==='active')s.dataset.state='pending'});cancel.disabled=true});document.addEventListener('learnui:languagechange',run);run()})();</script>
