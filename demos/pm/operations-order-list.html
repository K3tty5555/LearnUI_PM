<div class="pm-demo pm-orders" data-pm-demo>
  <div class="pm-demo-toolbar">
    <strong>订单中心</strong>
    <div class="pm-state-switch" aria-label="示例状态">
      <button class="active" data-demo-state="default">默认</button>
      <button data-demo-state="loading">加载</button>
      <button data-demo-state="empty">空结果</button>
      <button data-demo-state="error">错误</button>
    </div>
  </div>
  <div class="pm-demo-frame pm-app-layout">
    <nav class="pm-mini-nav"><b>交易</b><span>概览</span><span class="on">订单</span><span>退款</span></nav>
    <section class="pm-mini-main">
      <div class="pm-mini-actions"><div class="pm-mini-input">订单号 / 客户</div><button>筛选</button><button class="primary">新建订单</button></div>
      <div data-demo-panel="default" class="pm-table-wrap">
        <table class="pm-mini-table"><thead><tr><th>订单</th><th>客户</th><th>状态</th><th>金额</th></tr></thead><tbody><tr><td>#A-2048</td><td>海屿科技</td><td><span class="pm-status success">已支付</span></td><td>¥ 8,640</td></tr><tr><td>#A-2047</td><td>嘉禾零售</td><td><span class="pm-status pending">待确认</span></td><td>¥ 3,280</td></tr><tr><td>#A-2046</td><td>启明教育</td><td><span class="pm-status muted">处理中</span></td><td>¥ 5,120</td></tr></tbody></table>
      </div>
      <div data-demo-panel="loading" hidden class="pm-skeleton-list"><i></i><i></i><i></i></div>
      <div data-demo-panel="empty" hidden class="pm-demo-message"><b>没有符合条件的订单</b><span>清除筛选条件后再试。</span><button>清除筛选</button></div>
      <div data-demo-panel="error" hidden class="pm-demo-message error"><b>订单数据加载失败</b><span>其他页面不受影响。</span><button>重新加载</button></div>
    </section>
  </div>
</div>
