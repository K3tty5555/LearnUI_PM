<div class="demo demo-ai-status-orb">
  <div class="orb-card"><div class="orb-visual" aria-hidden="true"><span class="orb-halo"></span><span class="orb-core"></span></div><div class="orb-copy"><strong class="orb-state">Idle</strong><span class="orb-caption">Ready when you are</span></div><div class="orb-controls" role="group" aria-label="AI state"><button type="button" data-state="idle">Idle</button><button type="button" data-state="listening">Listen</button><button type="button" data-state="thinking">Think</button><button type="button" data-state="speaking">Speak</button><button type="button" data-state="error">Error</button></div></div>
  <span class="orb-status" role="status" aria-live="polite">AI is idle</span>
</div>
<style>
.demo-ai-status-orb{--a-ink:#252932;--a-muted:#68727f;--a-line:#dce1e8;--a-accent:#3467d6;font:12px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--a-ink);width:100%;max-width:470px}.demo-ai-status-orb *{box-sizing:border-box}.orb-card{display:grid;grid-template-columns:78px 1fr;grid-template-rows:auto auto;align-items:center;gap:12px;padding:16px;border:1px solid var(--a-line);border-radius:12px;background:linear-gradient(145deg,#fff,#f6f8fb);box-shadow:0 8px 22px rgba(30,45,70,.07)}.orb-visual{position:relative;display:grid;place-items:center;width:70px;height:70px}.orb-core{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0 8%,#a9c4ff 29%,#3467d6 72%,#233f8b);box-shadow:inset -8px -10px 15px rgba(22,43,104,.28),0 8px 16px rgba(52,103,214,.25)}.orb-halo{position:absolute;width:62px;height:62px;border:1px solid rgba(52,103,214,.24);border-radius:50%;opacity:.7}.orb-copy strong,.orb-copy span{display:block}.orb-copy strong{font-size:16px;letter-spacing:-.02em}.orb-copy span{margin-top:4px;color:var(--a-muted);font-size:10px}.orb-controls{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}.orb-controls button{border:1px solid var(--a-line);border-radius:6px;background:#fff;color:var(--a-muted);padding:6px 8px;font:600 9px inherit;cursor:pointer}.orb-controls button:hover,.orb-controls button[aria-pressed=true]{border-color:#b7c8f3;background:#f3f6ff;color:var(--a-accent)}.orb-controls button:focus-visible{outline:2px solid var(--a-accent);outline-offset:2px}.orb-status{display:block;min-height:16px;margin-top:8px;color:var(--a-muted);font-size:10px}.demo-ai-status-orb[data-state=listening] .orb-core{animation:orb-breathe 1.8s ease-in-out infinite}.demo-ai-status-orb[data-state=listening] .orb-halo{animation:orb-ring 1.8s ease-in-out infinite}.demo-ai-status-orb[data-state=thinking] .orb-halo{animation:orb-spin 2.2s linear infinite}.demo-ai-status-orb[data-state=speaking] .orb-core{animation:orb-speak .72s ease-in-out infinite alternate}.demo-ai-status-orb[data-state=error] .orb-core{background:radial-gradient(circle at 34% 30%,#fff 0 8%,#f1abb2 28%,#b43745 72%,#792c3a);box-shadow:inset -8px -10px 15px rgba(120,25,40,.28),0 8px 16px rgba(180,55,69,.2)}.demo-ai-status-orb[data-state=error] .orb-halo{border-color:rgba(180,55,69,.4)}@keyframes orb-breathe{50%{transform:scale(1.08)}}@keyframes orb-ring{50%{transform:scale(1.14);opacity:.28}}@keyframes orb-spin{to{transform:rotate(360deg)}}@keyframes orb-speak{to{transform:scale(1.12)}}@media(max-width:390px){.orb-card{grid-template-columns:64px 1fr}.orb-visual{width:58px;height:58px}.orb-core{width:38px;height:38px}.orb-halo{width:52px;height:52px}}@media(prefers-reduced-motion:reduce){.demo-ai-status-orb .orb-core,.demo-ai-status-orb .orb-halo{animation:none}}
</style>
<script>
(function(){var root=document.currentScript.parentElement.querySelector('.demo-ai-status-orb'),stateEl=root.querySelector('.orb-state'),caption=root.querySelector('.orb-caption'),status=root.querySelector('.orb-status'),buttons=[].slice.call(root.querySelectorAll('.orb-controls button')),copy={idle:[['Idle','Ready when you are','AI is idle'],['待机','准备好后即可开始','AI 正在待机']],listening:[['Listening','Speak your request','AI is listening'],['聆听中','说出你的请求','AI 正在聆听']],thinking:[['Thinking','Working on an answer','AI is thinking'],['思考中','正在生成回答','AI 正在思考']],speaking:[['Speaking','Sharing the answer','AI is speaking'],['输出中','正在分享回答','AI 正在输出']],error:[['Error','Try again','AI needs attention'],['错误','请重试','AI 需要关注']]};function run(state){root.dataset.state=state;var c=copy[state][document.documentElement.getAttribute('data-lang-mode')==='en'?0:1];stateEl.textContent=c[0];caption.textContent=c[1];status.textContent=c[2];buttons.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.state===state?'true':'false')})}buttons.forEach(function(b){b.addEventListener('click',function(){run(b.dataset.state)})});document.addEventListener('learnui:languagechange',function(){run(root.dataset.state||'idle')});run('idle')})();
</script>
