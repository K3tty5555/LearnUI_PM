<div class="demo demo-scroll-snap"><div class="ss-rail"><section><small>01 / SNAP</small><b>Start</b></section><section><small>02 / SNAP</small><b>Focus</b></section><section><small>03 / SNAP</small><b>Ship</b></section></div><div class="ss-dots"><i class="on"></i><i></i><i></i><span>scroll-snap-align: start</span></div></div>
<style>
.demo-scroll-snap{font:12px/1.35 system-ui,-apple-system,sans-serif;color:#20232a;max-width:100%}.ss-rail{display:flex;gap:10px;overflow:hidden;height:145px;scroll-snap-type:x mandatory;border:1px solid #dfe3e8;border-radius:12px;background:#f8fafc}.ss-rail section{flex:0 0 100%;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;padding:24px;background:linear-gradient(135deg,#fff,#eef2ff)}.ss-rail section:nth-child(2){background:linear-gradient(135deg,#fff,#ecfeff)}.ss-rail section:nth-child(3){background:linear-gradient(135deg,#fff,#fef3c7)}.ss-rail small{color:#64748b;font:10px ui-monospace,monospace}.ss-rail b{margin-top:8px;font-size:28px;letter-spacing:-.04em}.ss-dots{display:flex;align-items:center;gap:5px;margin-top:8px}.ss-dots i{width:6px;height:6px;border-radius:50%;background:#cbd5e1}.ss-dots i.on{width:18px;border-radius:999px;background:#2563eb}.ss-dots span{margin-left:auto;color:#7a8492;font:10px ui-monospace,monospace}@media(prefers-reduced-motion:reduce){.ss-rail{scroll-behavior:auto}}

<script>(function(){var rail=document.currentScript.parentElement.querySelector('.ss-rail'),dots=[].slice.call(document.currentScript.parentElement.querySelectorAll('.ss-dots i')),i=0;if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;function go(){i=(i+1)%3;rail.scrollTo({left:rail.clientWidth*i,behavior:'smooth'});dots.forEach(function(d,n){d.classList.toggle('on',n===i)});setTimeout(go,1800)}setTimeout(go,900)})();</script>
