          <text x="321" y="307" font-weight="700">SILENT</text><text x="590" y="307" text-anchor="end">GENTLE LIFE</text>
        </g>
        <g fill="#fff" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9.5" letter-spacing="1">
          <text transform="translate(604 352) rotate(90)">C 10</text><text transform="translate(604 448) rotate(90)">M 16</text><text transform="translate(604 512) rotate(90)">Y 0</text><text transform="translate(604 626) rotate(90)">K 0</text><text transform="translate(604 688) rotate(90)">#00AFF</text>
        </g>
        <g fill="#fff" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8.6">
          <text x="28" y="751">1hour, 20 min</text><text x="131" y="751">4.5</text><text x="203" y="751">1080x1350</text><text x="300" y="751">portrait feed post</text>
          <text x="537" y="756" font-weight="700">instagram</text><text x="543" y="765" font-size="7.4">:terest–</text>

        <g fill="#fff" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11.2">
          <text x="28" y="775">this design poster series is a bit different</text><text x="28" y="788">this time, it's design posters with my own</text><text x="28" y="801">artworks. I want to encourage fusion</text><text x="28" y="814">between different skills, in a design.</text>
          <text x="273" y="775">since I am always inspired by the</text><text x="273" y="788">blue sky, many of these artworks</text><text x="273" y="801">include that aspect in some way.</text>
        </g>

          <text transform="translate(78 392) rotate(-24)" font-family="'Snell Roundhand','Savoye LET','Segoe Script','Brush Script MT','URW Chancery L',cursive" font-style="italic" font-weight="700" font-size="122" fill="#E01A1A" stroke="#E01A1A" stroke-width="2.6" stroke-linejoin="round" letter-spacing="-3">Dream core</text>
          <path d="M70 486 C 110 420 150 380 196 352" fill="none" stroke="#E01A1A" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M452 168 C 500 146 548 128 600 104" fill="none" stroke="#E01A1A" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M334 36 C 338 90 330 170 322 268" fill="none" stroke="#E01A1A" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>
      <rect x="250" y="560" width="195" height="180" fill="none" data-ov-focus="唯一白亮的发光主体" data-ov-focus-en="The only white-hot shape: the glowing subject"/>
      <rect x="40" y="610" width="190" height="110" fill="none" data-ov-space="暗色地面留给光晕散开" data-ov-space-en="Dark ground left empty for the glow"/>
    </svg>
    <svg class="gd-grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="4.4" y1="0" x2="4.4" y2="100"/><line x1="43.3" y1="0" x2="43.3" y2="100"/><line x1="51" y1="0" x2="51" y2="100"/><line x1="95.2" y1="0" x2="95.2" y2="100"/><line x1="0" y1="6.2" x2="100" y2="6.2"/><line x1="0" y1="43" x2="100" y2="43"/><line x1="0" y1="89.3" x2="100" y2="89.3"/></svg>

  <div class="gd-controls" role="group" aria-label="Build steps"><button type="button" data-step-btn="1">1 Photo</button><button type="button" data-step-btn="2">2 Glow</button><button type="button" data-step-btn="3">3 Map</button><button type="button" data-step-btn="4" aria-pressed="true">4 Type</button><button type="button" data-step-btn="5">5 Motion</button></div>
</div>
<style>
.gd-neon{width:min(320px,calc(100vw - 80px));font:12px/1.4 system-ui,-apple-system,"PingFang SC",sans-serif}
.gd-neon *{box-sizing:border-box}
.nd-frame{position:relative;width:100%;aspect-ratio:630/838;overflow:hidden;border-radius:4px;background:#0A2631}
.nd-cv,.nd-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.nd-cv,.nd-type,.nd-pulse{transition:opacity .55s ease}
.gd-neon[data-step="1"] .nd-cv2,.gd-neon[data-step="1"] .nd-cv3,.gd-neon[data-step="2"] .nd-cv3{opacity:0}
.gd-neon[data-step="1"] .nd-type,.gd-neon[data-step="2"] .nd-type,.gd-neon[data-step="3"] .nd-type{opacity:0}
.nd-pulse{position:absolute;left:30%;top:60%;width:50%;height:36%;border-radius:50%;background:radial-gradient(closest-side,rgba(236,254,108,.55),rgba(117,225,245,.28) 55%,rgba(117,225,245,0));mix-blend-mode:screen;opacity:0;pointer-events:none}
.nd-speck{position:absolute;bottom:14%;width:3px;height:3px;border-radius:50%;background:#fffde0;box-shadow:0 0 6px 2px rgba(236,254,108,.8);opacity:0;pointer-events:none}
.gd-neon[data-step="5"] .nd-pulse{animation:nd-breathe 2.4s ease-in-out infinite}
.gd-neon[data-step="5"] .nd-speck{animation:nd-rise 3.2s linear infinite}
.gd-neon[data-step="5"] .nd-write-rect{animation:nd-write 2.6s ease-out both}
@keyframes nd-breathe{0%,100%{opacity:.25;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
@keyframes nd-rise{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-120px)}}
@keyframes nd-write{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.nd-write-rect{transform-box:fill-box;transform-origin:0 0}
.gd-grid{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
.gd-grid line{stroke:#22d3ee;stroke-width:1;stroke-dasharray:4 3;fill:none;vector-effect:non-scaling-stroke}
[data-show-grid="on"] .gd-grid{opacity:1}
.gd-controls{display:flex;justify-content:center;gap:4px;margin-top:8px}
.gd-controls button{border:1px solid #d7dbe3;border-radius:999px;background:#fff;color:#5d6472;padding:4px 8px;font:600 10px/1 system-ui,-apple-system,"PingFang SC",sans-serif;cursor:pointer;white-space:nowrap}
.gd-controls button[aria-pressed="true"]{background:#1f2430;border-color:#1f2430;color:#fff}
@media (max-height:260px){.gd-neon{width:calc((100vh - 24px)*.752)}.gd-controls{display:none}}
@media (prefers-reduced-motion:reduce){.nd-cv,.nd-type,.nd-pulse{transition:none}.gd-neon[data-step="5"] .nd-pulse,.gd-neon[data-step="5"] .nd-speck,.gd-neon[data-step="5"] .nd-write-rect{animation:none}.gd-neon[data-step="5"] .nd-pulse{opacity:.7}}
</style>
<script>
(function(){
  var root=document.currentScript.parentElement.querySelector('.gd-neon');
  var W=630,H=838;
  function seeded(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  // The lamb, facing left, in poster coordinates (measured from the MUTTON frame).
  function sheep(c){
    c.beginPath();
    // woolly body as a cluster of overlapping circles (non-zero fill merges them)
    [[312,632,30],[340,612,32],[376,604,33],[410,612,31],[434,638,26],[424,666,26],[390,676,28],[350,676,28],[316,660,26]].forEach(function(o){c.moveTo(o[0]+o[2],o[1]);c.arc(o[0],o[1],o[2],0,6.2832);});
    c.moveTo(432,644);c.ellipse(372,644,60,40,0,0,6.2832);
    c.moveTo(297,605);c.ellipse(276,606,21,29,-.55,0,6.2832);
    c.moveTo(306,590);c.ellipse(294,588,13,6,-.35,0,6.2832);
    [[320,676,10,58],[342,682,10,50],[398,682,10,50],[420,674,10,58]].forEach(function(l){c.rect(l[0],l[1],l[2],l[3]);});
  }
  // The landscape, painted in natural colours; `dim` darkens everything except the subject.
  function scene(c,dim,glow){
    var R=seeded(7),g;
    g=c.createLinearGradient(0,0,0,340);g.addColorStop(0,'#b9d6ec');g.addColorStop(1,'#eef0e6');c.fillStyle=g;c.fillRect(0,0,W,H);
    // distant mountains
    c.fillStyle='#6f8193';c.beginPath();c.moveTo(0,320);c.lineTo(28,300);c.lineTo(60,316);c.lineTo(120,330);c.lineTo(200,318);c.lineTo(250,304);c.lineTo(290,314);c.lineTo(340,332);c.lineTo(420,326);c.lineTo(520,334);c.lineTo(630,330);c.lineTo(630,360);c.lineTo(0,360);c.closePath();c.fill();
    // lake
    g=c.createLinearGradient(0,340,0,450);g.addColorStop(0,'#dfe9ee');g.addColorStop(1,'#a9c3cf');c.fillStyle=g;c.fillRect(0,340,W,120);
    // valley slopes and ground
    g=c.createLinearGradient(0,330,0,H);g.addColorStop(0,'#5d7f45');g.addColorStop(.5,'#3c5a2c');g.addColorStop(1,'#1e2f16');c.fillStyle=g;
    c.beginPath();c.moveTo(0,368);c.bezierCurveTo(90,390,180,440,250,470);c.lineTo(470,462);c.bezierCurveTo(520,420,580,360,630,322);c.lineTo(630,H);c.lineTo(0,H);c.closePath();c.fill();
    // road
    c.strokeStyle='rgba(205,200,180,.7)';c.lineWidth=2.4;c.beginPath();c.moveTo(0,580);c.bezierCurveTo(160,560,280,520,380,476);c.stroke();
    // grass texture
    for(var i=0;i<2600;i++){var x=R()*W,y=480+R()*(H-480);c.fillStyle='rgba('+(R()<.5?'20,34,14':'120,140,80')+','+(.25+R()*.35).toFixed(2)+')';c.fillRect(x,y,1.4,2+R()*5);}
    if(dim){c.fillStyle='rgba(6,14,20,'+dim+')';c.fillRect(0,0,W,H);}
    if(glow){
      c.save();c.fillStyle='#ffffff';
      [[30,'rgba(255,236,150,.8)'],[10,'rgba(255,250,220,.9)']].forEach(function(s){c.shadowColor=s[1];c.shadowBlur=s[0];sheep(c);c.fill();});
      c.restore();
      c.save();c.translate(360,734);c.scale(1,.3);g=c.createRadialGradient(0,0,4,0,0,140);g.addColorStop(0,'rgba(255,245,190,.75)');g.addColorStop(1,'rgba(255,245,190,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,140,0,6.2832);c.fill();c.restore();
    }else{c.fillStyle='#d9d4c6';sheep(c);c.fill();c.fillStyle='rgba(60,60,50,.35)';c.beginPath();c.ellipse(268,620,9,6,-.5,0,6.2832);c.fill();}
  }
  var cv=root.querySelectorAll('.nd-cv');
  scene(cv[0].getContext('2d'),0,false);
  var c2=cv[1].getContext('2d');scene(c2,.5,true);
  // Gradient map: luminance onto deep teal > cyan > lemon > white, then a halftone dot screen.
  // The map reads a lightly dimmed copy, so the sky stays on the bright end of the ramp.
  var src=document.createElement('canvas');src.width=W;src.height=H;var sc=src.getContext('2d');scene(sc,.22,true);
  var c3=cv[2].getContext('2d'),img=sc.getImageData(0,0,W,H),p=img.data;
  var RAMP=[[0,[4,22,29]],[.22,[12,58,71]],[.42,[26,120,140]],[.6,[95,211,234]],[.76,[180,245,224]],[.86,[236,254,108]],[.95,[250,255,200]],[1,[255,255,246]]];
  function ramp(v){for(var k=1;k<RAMP.length;k++)if(v<=RAMP[k][0]){var a=RAMP[k-1],b=RAMP[k],t=(v-a[0])/(b[0]-a[0]);return[a[1][0]+(b[1][0]-a[1][0])*t,a[1][1]+(b[1][1]-a[1][1])*t,a[1][2]+(b[1][2]-a[1][2])*t];}return RAMP[RAMP.length-1][1];}
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){var i=(y*W+x)*4,l=(p[i]*.3+p[i+1]*.59+p[i+2]*.11)/255;
    // lift the sky so it lands on lemon at the top and cyan at the horizon, as in the original
    if(y<318&&l>.5)l=Math.min(.93,.66+(1-y/318)*.28);
    var c=ramp(l),dot=(Math.sin(x*1.15)*Math.sin(y*1.15)+1)/2,shade=1-.16*(dot>l?1:0)*(1-l);
    p[i]=c[0]*shade;p[i+1]=c[1]*shade;p[i+2]=c[2]*shade;}
  c3.putImageData(img,0,0);
  var btns=[].slice.call(root.querySelectorAll('[data-step-btn]'));
  var NAMES={1:['1 原照片','1 Photo'],2:['2 主体发光','2 Glow'],3:['3 映射·半调','3 Map'],4:['4 排版','4 Type'],5:['5 动效','5 Motion']};
  function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en';}
  function text(){btns.forEach(function(b){b.textContent=NAMES[b.dataset.stepBtn][zh()?0:1];});}
  function setStep(n){root.dataset.step=String(n);btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.stepBtn===String(n)?'true':'false');});root.dispatchEvent(new CustomEvent('gd:layout',{bubbles:true}));}
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,auto=!reduce,timer;
  btns.forEach(function(b){b.addEventListener('click',function(){auto=false;clearTimeout(timer);setStep(+b.dataset.stepBtn);});});
  function cycle(){if(!auto)return;timer=setTimeout(function(){setStep(+root.dataset.step%5+1);cycle();},+root.dataset.step>=4?4200:2600);}
  document.addEventListener('learnui:languagechange',text);
  text();cycle();
})();
</script>
