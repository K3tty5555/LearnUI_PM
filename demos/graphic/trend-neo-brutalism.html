<div class="demo gd-specimen gd-nbrutal" data-step="3">
  <div class="nb-frame" data-gd-canvas>
    <svg class="nb-svg" viewBox="0 0 600 800" role="img" aria-label="RAW — neo-brutalist poster (style demo)">
      <defs><clipPath id="nb-clip"><rect x="20" y="70" width="560" height="400"/></clipPath></defs>
      <rect width="600" height="800" fill="#FFFFFF"/>

      <!-- step 2: oversized type, cut by the frame, and an inverted band -->
      <g class="nb-big">
        <g clip-path="url(#nb-clip)" data-ov-type="超大字：撑破格子被切掉" data-ov-type-en="Oversized type, cut off by its cell">
          <text x="2" y="474" font-family="'Helvetica Neue','Arial Black',Arial,sans-serif" font-weight="900" font-size="540" textLength="610" lengthAdjust="spacingAndGlyphs" fill="#0A0A0A">RAW</text>
        </g>
        <rect x="20" y="470" width="560" height="70" fill="#0A0A0A"/>
        <text x="34" y="518" font-family="'Helvetica Neue','Arial Black',Arial,sans-serif" font-weight="900" font-size="35" fill="#FFFFFF" textLength="532" lengthAdjust="spacingAndGlyphs" data-ov-type="反白粗体标语条" data-ov-type-en="Reversed bold slogan band">NO ORNAMENT. NO APOLOGY.</text>
      </g>

      <!-- step 3: every remaining cell filled with small facts, one fluorescent cell -->
      <g class="nb-info">
        <rect class="nb-pink" x="113.3" y="540" width="93.4" height="90" fill="#FF3EA5"/>
        <text x="160" y="604" text-anchor="middle" font-family="'Helvetica Neue','Arial Black',Arial,sans-serif" font-weight="900" font-size="46" fill="#0A0A0A" data-ov-focus="全页唯一的荧光粉格子" data-ov-focus-en="The one fluorescent cell on the sheet">027</text>
        <g class="nb-mono" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#0A0A0A" data-ov-type="等宽小字塞满格子" data-ov-type-en="Monospaced small type fills the cells"></g>
        <g class="nb-bars" fill="#0A0A0A"></g>
      </g>
      <rect x="300" y="635" width="88" height="80" fill="none" data-ov-space="故意空着的一格，让密度有对比" data-ov-space-en="One cell left empty so the density has contrast"/>

      <!-- step 1: the grid, printed -->
      <g class="nb-grid" stroke="#0A0A0A" stroke-width="2" fill="none">
        <rect x="20" y="20" width="560" height="760" stroke-width="3"/>
        <line x1="20" y1="70" x2="580" y2="70"/><line x1="20" y1="470" x2="580" y2="470"/><line x1="20" y1="540" x2="580" y2="540"/>
        <line x1="20" y1="630" x2="580" y2="630"/><line x1="20" y1="720" x2="580" y2="720"/>
        <g class="nb-cols"></g>
      </g>
      <g class="nb-idx" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="8" fill="#0A0A0A"></g>
    </svg>
    <svg class="gd-grid" viewBox="0 0 600 800" preserveAspectRatio="none" aria-hidden="true"><line x1="20" y1="0" x2="20" y2="800"/><line x1="580" y1="0" x2="580" y2="800"/><line x1="0" y1="70" x2="600" y2="70"/><line x1="0" y1="470" x2="600" y2="470"/><line x1="0" y1="720" x2="600" y2="720"/></svg>
  </div>
  <p class="nb-note"></p>
  <div class="gd-controls" role="group" aria-label="Build steps"><button type="button" data-step-btn="1">1</button><button type="button" data-step-btn="2">2</button><button type="button" data-step-btn="3" aria-pressed="true">3</button></div>
</div>
<style>
.gd-nbrutal{width:min(340px,calc(100vw - 80px));font:12px/1.4 system-ui,-apple-system,"PingFang SC",sans-serif}
.gd-nbrutal *{box-sizing:border-box}
.nb-frame{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;border-radius:2px;background:#fff}
.nb-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.nb-big,.nb-info{transition:opacity .35s steps(2)}
.gd-nbrutal[data-step="1"] .nb-big,.gd-nbrutal:not([data-step="3"]) .nb-info{opacity:0}
.nb-note{margin:8px 0 0;text-align:center;color:#6b7280;font-size:11px}
.gd-grid{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
.gd-grid line{stroke:#22d3ee;stroke-width:1;stroke-dasharray:4 3;fill:none;vector-effect:non-scaling-stroke}
[data-show-grid="on"] .gd-grid{opacity:1}
.gd-controls{display:flex;justify-content:center;gap:4px;margin-top:6px}
.gd-controls button{border:1px solid #d7dbe3;border-radius:999px;background:#fff;color:#5d6472;padding:4px 9px;font:600 10px/1 system-ui,-apple-system,"PingFang SC",sans-serif;cursor:pointer}
.gd-controls button[aria-pressed="true"]{background:#1f2430;border-color:#1f2430;color:#fff}
@media (max-height:260px){.gd-nbrutal{width:min(150px,calc(100vw - 40px))}.gd-controls,.nb-note{display:none}}
@media (prefers-reduced-motion:reduce){.nb-big,.nb-info{transition:none}}
</style>
<script>
(function(){
  var root=document.currentScript.parentElement.querySelector('.gd-nbrutal');
  var NS='http://www.w3.org/2000/svg',note=root.querySelector('.nb-note');
  function add(parent,tag,attrs,txt){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(txt)e.textContent=txt;parent.appendChild(e);return e;}
  // Six equal columns, drawn through the rows that are split (top strip and the two info rows).
  var cols=root.querySelector('.nb-cols'),W=560/6;
  for(var c=1;c<6;c++){var x=(20+W*c).toFixed(1);add(cols,'line',{x1:x,y1:20,x2:x,y2:70});add(cols,'line',{x1:x,y1:540,x2:x,y2:780});}
  var idx=root.querySelector('.nb-idx');
  for(c=0;c<6;c++){add(idx,'text',{x:(20+W*c+5).toFixed(1),y:780-6},'C'+(c+1)+'/R5');}
  var mono=root.querySelector('.nb-mono');
  function cell(col,y,lines,size){lines.forEach(function(t,i){add(mono,'text',{x:(20+W*col+7).toFixed(1),y:y+i*(size||13),'font-size':size||10.5},t);});}
  cell(0,40,['ISSUE','027'],12);cell(1,40,['2027.05.14','THU'],12);cell(2,40,['18:00—','23:00'],12);cell(3,40,['ROOM','B-12'],12);cell(4,40,['ENTRY','FREE'],12);cell(5,40,['PRINT','B/W+1'],12);
  cell(0,557,['LECTURES','01 GRID','02 WEIGHT','03 DENSITY','04 CONTRAST','05 NOISE']);
  cell(2,557,['NO ORNAMENT','IS THE','ORNAMENT.','—','READING','ROOM OPEN']);
  cell(3,557,['51.9244 N','4.4777 E','ALT 3 M','WIND SW','TEMP 14C','RH 71%']);
  cell(4,557,['SPEAKERS','A. VOSS','K. LIN','M. OKAFOR','J. ROTH','+ GUESTS']);
  cell(5,557,['TICKETS','NONE.','JUST','WALK IN.','BRING','A PEN.']);
  cell(0,647,['ARCHIVE','REF NB-27','-0514-B','SHEET','1 OF 1','']);
  cell(1,647,['SIZE','A1 594×841','STOCK','80 GSM','INK','K + PINK']);
  cell(4,647,['DOORS','17:30','TALKS','18:00','LAST','22:40']);
  cell(5,647,['OUT','NOW.','','','','']);
  add(mono,'text',{x:27,y:756,'font-size':22,'font-weight':900,'font-family':"'Helvetica Neue','Arial Black',Arial,sans-serif"},'NB—27');
  cell(1,741,['FIG. 027','BLACK ON WHITE']);cell(2,741,['GRID 6×5','GUTTER 0']);cell(3,741,['TYPE','GROTESK 900']);cell(4,741,['MONO','10.5 PT']);cell(5,741,['NO','DECORATION']);
  var bars=root.querySelector('.nb-bars'),x=20+W*2+8,seq=[3,1,2,1,4,1,1,2,3,1,2,2,1,3,1,1,4,2,1,2,1,3,1,2];
  seq.forEach(function(w,i){if(i%2===0)add(bars,'rect',{x:x.toFixed(1),y:640,width:w*1.6,height:58});x+=w*1.6;});
  var btns=[].slice.call(root.querySelectorAll('[data-step-btn]'));
  var NAMES={1:['1 网格外露','1 Grid'],2:['2 超大字','2 Huge type'],3:['3 信息塞满','3 Pack it']};
  function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en';}
  function text(){btns.forEach(function(b){b.textContent=NAMES[b.dataset.stepBtn][zh()?0:1];});note.textContent=zh()?'风格示范：自拟海报，不是看板里的原作':'Style demo: an invented poster, not a work from the board';}
  function setStep(n){root.dataset.step=String(n);btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.stepBtn===String(n)?'true':'false');});root.dispatchEvent(new CustomEvent('gd:layout',{bubbles:true}));}
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,auto=!reduce,timer;
  btns.forEach(function(b){b.addEventListener('click',function(){auto=false;clearTimeout(timer);setStep(+b.dataset.stepBtn);});});
  function cycle(){if(!auto)return;timer=setTimeout(function(){setStep(+root.dataset.step%3+1);cycle();},3200);}
  document.addEventListener('learnui:languagechange',text);
  text();cycle();
})();
</script>
