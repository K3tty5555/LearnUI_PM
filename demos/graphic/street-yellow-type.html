<style>
.gd-yst{width:min(345px,calc(100vw - 80px));font:12px/1.4 system-ui,-apple-system,"PingFang SC",sans-serif}
.gd-yst *{box-sizing:border-box}
.ys-frame{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;border-radius:4px;background:#ebe8e1}
.ys-view{position:absolute;inset:0;width:100%;height:100%;transition:opacity .45s}
.gd-yst:not([data-view="hk"]) [data-v="hk"],.gd-yst:not([data-view="sun"]) [data-v="sun"],.gd-yst:not([data-view="tokyo"]) [data-v="tokyo"],.gd-yst:not([data-view="pen"]) [data-v="pen"]{opacity:0;pointer-events:none}
.ys-didone{font-family:"Bodoni 72","Didot","Bodoni Moda","Playfair Display",Georgia,serif;font-weight:700}
.ys-slab{font-family:"Rockwell","Roboto Slab","American Typewriter",Georgia,serif;font-weight:400}
.ys-thin{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:300;letter-spacing:.06em}
.ys-geo{font-family:Futura,"Century Gothic","Avenir Next",sans-serif;font-weight:500}
.ys-round{font-family:"Varela Round","Arial Rounded MT Bold","Avenir Next",sans-serif}
.ys-tiny{font-family:"Helvetica Neue",Arial,sans-serif;letter-spacing:.04em}
.ys-sansb{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700}
.ys-cjk{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;font-weight:600}
.ys-cjkb{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","PingFang SC",sans-serif;font-weight:800}
.gd-yst .gd-grid{opacity:0;transition:opacity .25s;pointer-events:none}
.gd-yst .gd-grid line{stroke:#22d3ee;stroke-width:1;stroke-dasharray:4 3;fill:none;vector-effect:non-scaling-stroke}
[data-show-grid="on"] .gd-yst .gd-grid,.gd-yst[data-show-grid="on"] .gd-grid{opacity:1}
.gd-controls{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:8px}
.gd-controls button{border:1px solid #d7dbe3;border-radius:999px;background:#fff;color:#5d6472;padding:4px 9px;font:600 10px/1 system-ui,-apple-system,"PingFang SC",sans-serif;cursor:pointer}
.gd-controls button[aria-pressed="true"]{background:#1f2430;border-color:#1f2430;color:#fff}
@media (max-height:260px){.gd-yst{width:calc((100vh - 16px) * .75)}.gd-controls{display:none}}
@media (prefers-reduced-motion:reduce){.ys-view{transition:none}}
</style>
<script>
(function(){
  var root=document.currentScript.parentElement.querySelector('.gd-yst');
  var btns=[].slice.call(root.querySelectorAll('[data-view-btn]'));
  // Button labels are the posters' own titles, so they stay the same in both languages.
  function setView(v){root.dataset.view=v;btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.viewBtn===v?'true':'false')});root.dispatchEvent(new CustomEvent('gd:layout',{bubbles:true}));}
  var order=['hk','sun','tokyo','pen'];
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,auto=!reduce,timer;
  btns.forEach(function(b){b.addEventListener('click',function(){auto=false;clearTimeout(timer);setView(b.dataset.viewBtn)})});
  function cycle(){if(!auto)return;timer=setTimeout(function(){setView(order[(order.indexOf(root.dataset.view)+1)%order.length]);cycle();},4200);}
  cycle();
})();
</script>
