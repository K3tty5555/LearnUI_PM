<div class="demo gd-specimen gd-glitch" data-step="4">

          <g class="gl-spikes" fill="#2340E6"></g>
          <circle cx="355" cy="255" r="150" fill="none" stroke="#2340E6" stroke-width="11"/>

        </g>
        <g stroke="#2B3FE0" stroke-width="1.6">
          <rect x="565" y="312" width="120" height="76" fill="url(#gl-check)"/><ellipse cx="625" cy="350" rx="44" ry="20" fill="url(#gl-blob)" stroke="none"/><path d="M600 350 Q625 330 650 350 Q625 366 600 350Z" fill="#2B3FE0" stroke="none"/>
          <rect x="18" y="575" width="122" height="77" fill="url(#gl-check)"/><ellipse cx="80" cy="608" rx="58" ry="24" fill="url(#gl-blob)" stroke="none"/>
          <rect x="568" y="653" width="122" height="77" fill="url(#gl-check)"/><ellipse cx="634" cy="690" rx="46" ry="30" fill="url(#gl-blob)" stroke="none"/>
        </g>
        <g fill="#2B3FE0" font-family="'Helvetica Neue',Arial,'PingFang SC',sans-serif">
          <text x="575" y="637" font-size="10.5">@章章晴子</text>
          <g font-size="10"><text x="58" y="684">Beneath the moonlight,</text><text x="58" y="700">I pray devoutly, wishing</text><text x="58" y="716">all dreams come true</text></g>
          <g font-size="11.2" data-ov-type="两端对齐的小号英文块" data-ov-type-en="Tiny justified English block"><text x="563" y="774" textLength="110" lengthAdjust="spacing">SILENT     MOONLIT</text><text x="563" y="792" textLength="110" lengthAdjust="spacing">NIGHT,     PRAYERS</text><text x="563" y="810" textLength="110" lengthAdjust="spacing">DRIFT  WITH  THE</text><text x="563" y="828" textLength="110" lengthAdjust="spacing">WIND TO YOU ALL</text></g>
        </g>

      <rect x="318" y="128" width="80" height="246" fill="none" data-ov-focus="脸和合十的手：唯一完好的地方" data-ov-focus-en="Face and praying hands, left intact"/>
      <rect x="12" y="500" width="190" height="64" fill="none" data-ov-space="下半浅灰底留给拖影" data-ov-space-en="Calm grey half for the smear"/>

    <svg class="gd-grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="14.6" y1="0" x2="14.6" y2="100"/><line x1="78.2" y1="0" x2="78.2" y2="100"/><line x1="84" y1="0" x2="84" y2="100"/><line x1="0" y1="51" x2="100" y2="51"/><line x1="0" y1="92" x2="100" y2="92"/></svg>
  </div>
  <div class="gd-controls" role="group" aria-label="Build steps"><button type="button" data-step-btn="1">1 Subject</button><button type="button" data-step-btn="2">2 Slice</button><button type="button" data-step-btn="3">3 Displace</button><button type="button" data-step-btn="4" aria-pressed="true">4 Layout</button><button type="button" data-step-btn="5">5 Motion</button></div>
</div>
<style>
.gd-glitch{width:min(320px,calc(100vw - 80px));font:12px/1.4 system-ui,-apple-system,"PingFang SC",sans-serif}
.gd-glitch *{box-sizing:border-box}
.gl-frame{position:relative;width:100%;aspect-ratio:720/962;overflow:hidden;border-radius:4px;background:#E3E3E6}
.gl-cv,.gl-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.gl-cv,.gl-type{transition:opacity .5s ease}
.gd-glitch[data-step="1"] .gl-cv2,.gd-glitch[data-step="1"] .gl-cv3,.gd-glitch[data-step="2"] .gl-cv3{opacity:0}
.gd-glitch[data-step="1"] .gl-type,.gd-glitch[data-step="2"] .gl-type,.gd-glitch[data-step="3"] .gl-type{opacity:0}
.gl-halo{transform-box:view-box;transform-origin:355px 255px}
.gd-glitch[data-step="5"] .gl-halo{animation:gl-spin 14s linear infinite}
@keyframes gl-spin{to{transform:rotate(360deg)}}
.gd-grid{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
.gd-grid line{stroke:#22d3ee;stroke-width:1;stroke-dasharray:4 3;fill:none;vector-effect:non-scaling-stroke}
[data-show-grid="on"] .gd-grid{opacity:1}
.gd-controls{display:flex;justify-content:center;gap:4px;margin-top:8px}
.gd-controls button{border:1px solid #d7dbe3;border-radius:999px;background:#fff;color:#5d6472;padding:4px 8px;font:600 10px/1 system-ui,-apple-system,"PingFang SC",sans-serif;cursor:pointer;white-space:nowrap}
.gd-controls button[aria-pressed="true"]{background:#1f2430;border-color:#1f2430;color:#fff}
@media (max-height:260px){.gd-glitch{width:calc((100vh - 24px)*.748)}.gd-controls{display:none}}
@media (prefers-reduced-motion:reduce){.gl-cv,.gl-type{transition:none}.gd-glitch[data-step="5"] .gl-halo{animation:none}}
</style>
<script>
(function(){
  var root=document.currentScript.parentElement.querySelector('.gd-glitch');
  var W=720,H=962,SPLIT=490;
  function seeded(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function mk(){var c=document.createElement('canvas');c.width=W;c.height=H;return c;}
  // Spiked halo ring, built once.
  var NS='http://www.w3.org/2000/svg',sp=root.querySelector('.gl-spikes');
  for(var k=0;k<28;k++){var a=k/28*6.2832,len=k%2?30:62,w=.07,r0=150,pts=[[r0,a-w],[r0+len,a],[r0,a+w]].map(function(q){return(355+Math.cos(q[1])*q[0]).toFixed(1)+','+(255+Math.sin(q[1])*q[0]).toFixed(1);}).join(' ');
    var t=document.createElementNS(NS,'polygon');t.setAttribute('points',pts);sp.appendChild(t);
    var a2=a+3.1416/28,inner=[[r0,a2-.05],[r0-26,a2],[r0,a2+.05]].map(function(q){return(355+Math.cos(q[1])*q[0]).toFixed(1)+','+(255+Math.sin(q[1])*q[0]).toFixed(1);}).join(' ');
    t=document.createElementNS(NS,'polygon');t.setAttribute('points',inner);sp.appendChild(t);}
  // The statue (a stand-in for the AI-generated subject): veiled head, praying hands, robe, cobalt drape.
  var statue=mk(),s=statue.getContext('2d'),g;
  function hang(x,y,len,kind){s.strokeStyle='rgba(120,124,132,.7)';s.lineWidth=1;s.beginPath();s.moveTo(x,0);s.lineTo(x,y-14);s.stroke();
    g=s.createLinearGradient(x-16,y-16,x+16,y+16);g.addColorStop(0,'#f4f5f7');g.addColorStop(.5,'#8d939c');g.addColorStop(1,'#dfe2e6');s.fillStyle=g;
    s.beginPath();if(kind){s.arc(x,y,16,0,6.2832);s.arc(x+5,y-3,13,0,6.2832,true);}else{s.arc(x,y,15,0,6.2832);s.arc(x,y,8,0,6.2832,true);}s.fill('evenodd');}
  [[170,250,1],[228,170,0],[150,336,0],[560,246,1],[512,176,0],[590,330,1],[205,440,0],[520,452,1],[268,96,1],[452,92,0]].forEach(function(h){hang(h[0],h[1],0,h[2]);});
  s.lineJoin='round';s.strokeStyle='rgba(110,114,122,.55)';s.lineWidth=1.6;
  g=s.createLinearGradient(240,0,480,0);g.addColorStop(0,'#bfc2c7');g.addColorStop(.3,'#f4f4f3');g.addColorStop(.62,'#ececeb');g.addColorStop(1,'#a9adb4');
  // robe: narrow at the shoulders, widening to the base
  s.fillStyle=g;s.beginPath();s.moveTo(292,292);s.bezierCurveTo(276,420,256,700,240,900);s.lineTo(482,900);s.bezierCurveTo(470,700,452,440,430,292);s.closePath();s.fill();s.stroke();
  // fold lines
  s.strokeStyle='rgba(150,154,162,.55)';[[318,420,300,890],[338,470,330,895],[404,470,420,895]].forEach(function(f){s.beginPath();s.moveTo(f[0],f[1]);s.quadraticCurveTo((f[0]+f[2])/2-8,(f[1]+f[3])/2,f[2],f[3]);s.stroke();});
  // veil / hood over the head and shoulders
  s.strokeStyle='rgba(110,114,122,.55)';
  g=s.createLinearGradient(290,0,430,0);g.addColorStop(0,'#cfd1d5');g.addColorStop(.4,'#f8f8f7');g.addColorStop(1,'#b6b9bf');
  s.fillStyle=g;s.beginPath();s.moveTo(356,128);s.bezierCurveTo(300,128,302,200,296,240);s.bezierCurveTo(290,270,270,300,262,330);s.lineTo(452,330);s.bezierCurveTo(440,300,420,270,416,240);s.bezierCurveTo(410,200,412,128,356,128);s.closePath();s.fill();s.stroke();
  // face, lit from the left
  g=s.createLinearGradient(326,0,388,0);g.addColorStop(0,'#fbfbfa');g.addColorStop(.6,'#efefee');g.addColorStop(1,'#c5c8cc');
  s.fillStyle=g;s.beginPath();s.ellipse(357,190,29,40,0,0,6.2832);s.fill();
  s.fillStyle='rgba(120,124,132,.45)';s.fillRect(342,182,10,2);s.fillRect(362,182,10,2);s.fillRect(355,190,3,12);s.fillRect(349,212,15,2);
  // crown
  s.fillStyle='#e4e5e7';for(var c=0;c<6;c++){s.beginPath();s.moveTo(330+c*9,140);s.lineTo(334.5+c*9,118);s.lineTo(339+c*9,140);s.fill();}s.fillRect(328,138,58,9);
  // praying hands, pointed up, in front of the chest
  s.fillStyle='#fdfdfc';s.beginPath();s.moveTo(340,372);s.lineTo(343,300);s.quadraticCurveTo(356,262,369,300);s.lineTo(372,372);s.closePath();s.fill();s.stroke();
  s.beginPath();s.moveTo(356,280);s.lineTo(356,370);s.stroke();
  // sleeves
  s.fillStyle='#e9e9e8';s.beginPath();s.moveTo(300,336);s.quadraticCurveTo(318,380,340,372);s.lineTo(340,352);s.quadraticCurveTo(322,350,312,320);s.closePath();s.fill();s.stroke();
  s.beginPath();s.moveTo(420,336);s.quadraticCurveTo(398,380,372,372);s.lineTo(372,352);s.quadraticCurveTo(392,350,404,320);s.closePath();s.fill();s.stroke();
  // cobalt drape down the right side
  g=s.createLinearGradient(400,0,480,0);g.addColorStop(0,'#2546c8');g.addColorStop(1,'#0c1f6b');s.fillStyle=g;
  s.beginPath();s.moveTo(404,240);s.bezierCurveTo(440,320,446,430,450,540);s.bezierCurveTo(456,660,466,790,474,890);s.lineTo(432,890);s.bezierCurveTo(426,720,418,540,404,390);s.closePath();s.fill();
  s.fillStyle='#2B3FE0';s.fillRect(300,392,128,9);s.fillRect(372,401,6,86);s.fillRect(390,401,6,92);
  s.fillStyle='#bfc2c7';s.fillRect(0,900,W,62);
  // Sliced version: the lower body cut into strips, shifted, some stretched into cobalt streaks; face and hands stay.
  function sliced(dst,seed){var R=seeded(seed),y=SPLIT-40;dst.drawImage(statue,0,0,W,y,0,0,W,y);
    while(y<H){var h=3+Math.floor(R()*12),dx=(R()-.5)*(y>600?70:40);dst.drawImage(statue,0,y,W,h,dx,y,W,h);
      if(R()<.35){var sx=380+R()*80,sw=4+R()*14;dst.drawImage(statue,sx,y,sw,h,sx,y,40+R()*90,h);}
      if(R()<.22){dst.fillStyle=R()<.5?'rgba(43,63,224,.85)':'rgba(12,31,107,.9)';dst.fillRect(410+R()*60,y,30+R()*80,h);}
      if(R()<.18){dst.fillStyle='rgba(245,245,245,.9)';dst.fillRect(220+R()*60,y,20+R()*50,Math.max(2,h-2));}
      y+=h;}}
  // Displaced background: a cyan field whose rows are pushed along a stripe texture into black streaks.
  var bg=mk(),b=bg.getContext('2d'),R=seeded(42);
  b.fillStyle='#E3E3E6';b.fillRect(0,0,W,H);b.fillStyle='#19BDD4';b.fillRect(0,0,W,SPLIT);
  for(var y=0;y<SPLIT;){var h=2+Math.floor(R()*6),shift=Math.sin(y*.045)*40+(R()-.5)*60;
    for(var x=-60;x<W;){var w=8+R()*90,d=Math.hypot(x+w/2-355,(y-255)*1.1),ring=Math.abs(d-300)<70,left=x<140,top=y<70,p=ring?.72:(left||top)?.55:.22;
      if(R()<p){b.fillStyle=R()<.9?'#0B0B0D':'#e8f6f8';b.fillRect(x+shift,y,w,h);}x+=w;}y+=h;}
  // grey mountains and the glitched base strip
  b.fillStyle='#45474c';b.beginPath();b.moveTo(0,820);b.lineTo(40,792);b.lineTo(80,810);b.lineTo(120,786);b.lineTo(170,830);b.lineTo(210,880);b.lineTo(0,890);b.fill();
  b.beginPath();b.moveTo(560,880);b.lineTo(610,812);b.lineTo(650,826);b.lineTo(690,798);b.lineTo(720,820);b.lineTo(720,890);b.fill();
  b.fillStyle='#8a8d93';b.beginPath();b.moveTo(40,792);b.lineTo(60,840);b.lineTo(30,880);b.fill();b.beginPath();b.moveTo(690,798);b.lineTo(676,850);b.lineTo(705,880);b.fill();
  for(var i=0;i<70;i++){b.fillStyle=R()<.5?'#d4d5d8':'#f1f1f2';b.fillRect(R()*W,850+R()*60,6+R()*28,6+R()*24);}
  var cv=root.querySelectorAll('.gl-cv'),c1=cv[0].getContext('2d'),c2=cv[1].getContext('2d'),c3=cv[2].getContext('2d');
  c1.fillStyle='#E3E3E6';c1.fillRect(0,0,W,H);c1.drawImage(statue,0,0);
  c2.fillStyle='#E3E3E6';c2.fillRect(0,0,W,H);sliced(c2,9);
  function step3(seed){c3.drawImage(bg,0,0);sliced(c3,seed);}
  step3(9);
  var btns=[].slice.call(root.querySelectorAll('[data-step-btn]'));
  var NAMES={1:['1 素材','1 Subject'],2:['2 切片错位','2 Slice'],3:['3 置换底','3 Displace'],4:['4 排版','4 Layout'],5:['5 动态','5 Motion']};
  function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en';}
  function text(){btns.forEach(function(b){b.textContent=NAMES[b.dataset.stepBtn][zh()?0:1];});}
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,auto=!reduce,timer,jitter;
  // Motion step: the strips re-shuffle on a stepped beat, like the designer's video loop.
  function setStep(n){root.dataset.step=String(n);btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.stepBtn===String(n)?'true':'false');});
    clearInterval(jitter);if(n===5&&!reduce){var sd=10;jitter=setInterval(function(){step3(sd++);},220);}else step3(9);
    root.dispatchEvent(new CustomEvent('gd:layout',{bubbles:true}));}
  btns.forEach(function(b){b.addEventListener('click',function(){auto=false;clearTimeout(timer);setStep(+b.dataset.stepBtn);});});
  function cycle(){if(!auto)return;timer=setTimeout(function(){setStep(+root.dataset.step%5+1);cycle();},+root.dataset.step>=4?4200:2600);}
  document.addEventListener('learnui:languagechange',text);
  text();cycle();
})();
</script>
