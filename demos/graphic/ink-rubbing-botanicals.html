<div class="demo gd-specimen gd-rub" data-format="corner">
  <div class="rb-frame" data-gd-canvas>
    <svg class="rb-svg" viewBox="0 0 720 960" role="img" aria-label="黑白拓印肌理海报还原：四角布字与标本标签两种版式">
      <defs>
        <filter id="rb-fibre" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".035 .7" numOctaves="4" seed="12"/>
          <feColorMatrix values="0 0 0 0 .42  0 0 0 0 .42  0 0 0 0 .41  0 0 0 .14 0"/>
        </filter>
        <filter id="rb-speck" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".95" numOctaves="1" seed="21"/>
          <feColorMatrix values="0 0 0 0 .2  0 0 0 0 .2  0 0 0 0 .2  0 0 0 .1 -.03"/>
        </filter>
      </defs>

      <!-- paper -->
      <rect width="720" height="960" fill="#FBFBFA"/>
      <rect width="720" height="960" filter="url(#rb-fibre)"/>
      <g stroke="#CFCECB" stroke-width="1.2" opacity=".75">
        <line x1="58" y1="0" x2="58" y2="960"/><line x1="84" y1="0" x2="84" y2="960"/>
        <line x1="636" y1="0" x2="636" y2="960"/><line x1="662" y1="0" x2="662" y2="960"/>
      </g>

      <!-- the pressed trace, generated by script -->
      <g class="rb-plant"></g>
      <g class="rb-wing"></g>
      <rect width="720" height="960" filter="url(#rb-speck)" pointer-events="none"/>

      <!-- format A: a four-character title split into the corners -->
      <g class="rb-corner" font-family="'Songti SC','STSong','Noto Serif CJK SC','Source Han Serif SC',serif" fill="#1B1B1B">
        <g font-weight="700" font-size="104" data-ov-type="四字标题拆到四个角，用词把主体框住" data-ov-type-en="A four-character title split into the four corners, framing the subject">
          <text x="52" y="152">花</text><text x="668" y="152" text-anchor="end">骨</text>
          <text x="52" y="884">墨</text><text x="668" y="884" text-anchor="end">影</text>
        </g>
        <g transform="translate(104 322) rotate(90)">
          <text font-family="'Didot','Playfair Display','Times New Roman',serif" font-size="21" fill="#2B2B2A" letter-spacing="1.8">Color removed, texture revealed</text>
        </g>
        <g transform="translate(626 342) rotate(90)">
          <text font-family="'Songti SC','STSong',serif" font-size="19" fill="#2B2B2A" letter-spacing="2.4">以墨为媒，留存植物最本真的肌理</text>
        </g>
        <text x="360" y="906" text-anchor="middle" font-family="'Songti SC','STSong',serif" font-size="17" fill="#3A3A39" letter-spacing="2">@ 黄小粘</text>
      </g>

      <!-- format B: the same trace presented as a herbarium sheet -->
      <g class="rb-label" fill="#1B1B1B">
        <text x="40" y="76" font-family="'Songti SC','STSong','Noto Serif CJK SC',serif" font-weight="700" font-size="42" letter-spacing="1">以墨守住蝶的纹理　留下本真</text>
        <g font-family="'Didot','Playfair Display','Times New Roman',serif" font-size="19" fill="#2B2B2A">
          <text x="44" y="106">Stripped of color, the wing speaks in lines.</text>
          <text x="470" y="106">Its veins remember the air.</text>
        </g>
        <g stroke="#1B1B1B" stroke-width="1.4" fill="none">
          <path d="M150 232 L300 420"/><path d="M588 430 L452 496"/><path d="M300 806 L312 646"/>
        </g>
        <g data-ov-type="标本式标注：引线指向部位，中文大、英文小" data-ov-type-en="Herbarium labels: leader lines to each part, Chinese large and English small">
          <text x="96" y="178" font-family="'Didot','Playfair Display','Times New Roman',serif" font-size="19" fill="#2B2B2A" letter-spacing="1.4">Pristine White</text>
          <text x="92" y="228" font-family="'Songti SC','STSong','Noto Serif CJK SC',serif" font-weight="700" font-size="54">素白</text>
          <text x="520" y="382" font-family="'Didot','Playfair Display','Times New Roman',serif" font-size="19" fill="#2B2B2A" letter-spacing="1.4">Wing Bone</text>
          <text x="516" y="432" font-family="'Songti SC','STSong','Noto Serif CJK SC',serif" font-weight="700" font-size="54">翅骨</text>
          <text x="214" y="862" font-family="'Songti SC','STSong','Noto Serif CJK SC',serif" font-weight="700" font-size="54">纹理</text>
          <text x="222" y="894" font-family="'Didot','Playfair Display','Times New Roman',serif" font-size="19" fill="#2B2B2A" letter-spacing="1.4">Texture</text>
        </g>
        <g transform="translate(76 272) rotate(90)">
          <text font-family="'Didot','Playfair Display','Times New Roman',serif" font-size="18" fill="#2B2B2A" letter-spacing="1.6">Pure white ground, dark veins &#8212; a portrait of flight, paused.</text>
        </g>
        <g transform="translate(680 300) rotate(90)">
          <text font-family="'Didot','Playfair Display','Times New Roman',serif" font-size="18" fill="#2B2B2A" letter-spacing="1.6">Butterfly Wings in Black &amp; White</text>
        </g>
      </g>

      <!-- marks that belong to both formats -->
      <circle class="rb-focus" cx="360" cy="470" r="112" fill="none"
              data-ov-focus="压出来的痕本身：脉络与残破的边，墨在压力轻处自然断开"
              data-ov-focus-en="The pressed trace itself: veins and torn edges, the ink breaking where the pressure was light"/>
      <rect x="150" y="196" width="430" height="120" fill="none" class="rb-space"
            data-ov-space="主体四周空着的纸，它干的活比印出来的任何东西都多"
            data-ov-space-en="The empty paper around the subject, doing more work than anything printed"/>
    </svg>
    <svg class="gd-grid" viewBox="0 0 720 960" preserveAspectRatio="none" aria-hidden="true">
      <line x1="58" y1="0" x2="58" y2="960"/><line x1="662" y1="0" x2="662" y2="960"/>
      <line x1="360" y1="0" x2="360" y2="960"/>
      <line x1="0" y1="168" x2="720" y2="168"/><line x1="0" y1="790" x2="720" y2="790"/>
    </svg>
  </div>
  <div class="gd-controls" role="group" aria-label="Layouts">
    <button type="button" data-format-btn="corner" aria-pressed="true">A</button><button type="button" data-format-btn="label">B</button>
  </div>
</div>
<style>
.gd-rub{width:min(336px,calc(100vw - 80px));font:12px/1.4 system-ui,-apple-system,"PingFang SC",sans-serif}
.gd-rub *{box-sizing:border-box}
.rb-frame{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;border-radius:4px;background:#FBFBFA}
.rb-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rb-plant,.rb-wing,.rb-corner,.rb-label{transition:opacity var(--dur-3,320ms) var(--ease-out,ease)}
.gd-rub[data-format="corner"] .rb-wing,.gd-rub[data-format="corner"] .rb-label{opacity:0}
.gd-rub[data-format="label"] .rb-plant,.gd-rub[data-format="label"] .rb-corner{opacity:0}
.gd-rub[data-format="label"] .rb-space{x:430;y:620;width:240;height:150}
.gd-grid{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity var(--dur-2,200ms) var(--ease-out,ease);pointer-events:none;z-index:6}
.gd-grid line{stroke:#22d3ee;stroke-width:1;stroke-dasharray:4 3;fill:none;vector-effect:non-scaling-stroke}
[data-show-grid="on"] .gd-grid{opacity:1}
.gd-controls{display:flex;justify-content:center;gap:4px;margin-top:8px}
.gd-controls button{border:1px solid #d7dbe3;border-radius:999px;background:#fff;color:#5d6472;padding:4px 9px;font:600 10px/1 system-ui,-apple-system,"PingFang SC",sans-serif;cursor:pointer}
.gd-controls button[aria-pressed="true"]{background:#1f2430;border-color:#1f2430;color:#fff}
@media (max-height:260px){.gd-rub{width:min(150px,calc(100vw - 40px))}.gd-controls{display:none}}
@media (prefers-reduced-motion:reduce){.rb-plant,.rb-wing,.rb-corner,.rb-label{transition:none}}
</style>
<script>
(function(){
  var root=document.currentScript.parentElement.querySelector('.gd-rub');
  var NS='http://www.w3.org/2000/svg';
  var seed=20261026;
  function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}
  function add(g,tag,attrs){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);g.appendChild(e);return e;}
  var INK='#1B1B1B',PAPER='#FBFBFA';

  // A leaf or a petal: one torn outline plus the veins inside it.
  function blade(g,cx,cy,len,wid,deg,veins){
    var a=deg*Math.PI/180,tx=Math.cos(a)*len,ty=Math.sin(a)*len;
    var px=-Math.sin(a)*wid,py=Math.cos(a)*wid;
    add(g,'path',{d:'M'+cx+' '+cy+' Q'+(cx+tx*.4+px)+' '+(cy+ty*.4+py)+' '+(cx+tx)+' '+(cy+ty)+
                     ' Q'+(cx+tx*.4-px)+' '+(cy+ty*.4-py)+' '+cx+' '+cy+'Z',
                  fill:'none',stroke:INK,'stroke-width':1.9,'stroke-linejoin':'round'});
    add(g,'path',{d:'M'+cx+' '+cy+'L'+(cx+tx)+' '+(cy+ty),fill:'none',stroke:INK,'stroke-width':1.5});
    for(var i=1;i<veins;i++){
      var t=i/veins,sx=cx+tx*t,sy=cy+ty*t,sp=(1-Math.abs(t-.45)*1.7);
      for(var s=-1;s<2;s+=2){
        add(g,'path',{d:'M'+sx+' '+sy+'Q'+(sx+tx*.08+px*sp*.6*s)+' '+(sy+ty*.08+py*sp*.6*s)+' '+(sx+tx*.16+px*sp*s)+' '+(sy+ty*.16+py*sp*s),
                      fill:'none',stroke:INK,'stroke-width':.75,opacity:.8});
      }
    }
    // torn, worm-eaten edges
    for(var h=0;h<3;h++){
      var t2=.3+rnd()*.6,hx=cx+tx*t2+px*(.5+rnd()*.5)*(rnd()<.5?-1:1),hy=cy+ty*t2+py*(.5+rnd()*.5)*(rnd()<.5?-1:1);
      add(g,'ellipse',{cx:hx.toFixed(1),cy:hy.toFixed(1),rx:(3+rnd()*5).toFixed(1),ry:(2+rnd()*4).toFixed(1),fill:PAPER});
    }
  }
  function flower(g,cx,cy,r,deg){
    for(var i=0;i<6;i++)blade(g,cx,cy,r*(.82+rnd()*.36),r*.3,deg+i*60+rnd()*10-5,7);
    for(var s=0;s<6;s++){
      var a=(deg+s*58)*Math.PI/180,L=r*.55;
      add(g,'path',{d:'M'+cx+' '+cy+'L'+(cx+Math.cos(a)*L).toFixed(1)+' '+(cy+Math.sin(a)*L).toFixed(1),fill:'none',stroke:INK,'stroke-width':1.3});
      add(g,'ellipse',{cx:(cx+Math.cos(a)*L).toFixed(1),cy:(cy+Math.sin(a)*L).toFixed(1),rx:5,ry:3,fill:INK,transform:'rotate('+(deg+s*58)+' '+(cx+Math.cos(a)*L).toFixed(1)+' '+(cy+Math.sin(a)*L).toFixed(1)+')'});
    }
  }
  // Uneven pressure: paper-coloured dashes laid back over the same area break the ink up.
  function gaps(g,x,y,w,h,n){
    for(var i=0;i<n;i++){
      var gx=x+rnd()*w,gy=y+rnd()*h,a=rnd()*Math.PI,L=4+rnd()*16;
      add(g,'path',{d:'M'+gx.toFixed(1)+' '+gy.toFixed(1)+'l'+(Math.cos(a)*L).toFixed(1)+' '+(Math.sin(a)*L).toFixed(1),
                    stroke:PAPER,'stroke-width':(1.4+rnd()*2.6).toFixed(1),'stroke-linecap':'round',opacity:(.5+rnd()*.5).toFixed(2)});
    }
  }

  var plant=root.querySelector('.rb-plant');
  add(plant,'path',{d:'M372 870 Q352 720 362 600 Q372 470 346 356',fill:'none',stroke:INK,'stroke-width':3.2,'stroke-linecap':'round'});
  blade(plant,366,742,150,30,-168,9); blade(plant,362,660,126,25,-14,8);
  blade(plant,360,566,170,32,-160,10); blade(plant,356,498,128,24,-20,8);
  flower(plant,318,560,118,-18); flower(plant,392,392,104,12);
  blade(plant,348,392,120,24,-150,8);
  add(plant,'path',{d:'M352 420 Q330 380 338 338',fill:'none',stroke:INK,'stroke-width':2.4});
  blade(plant,338,338,74,18,-96,6);
  gaps(plant,160,290,420,560,170);

  // The wing: veins fanning from the body, cross-veins between them, holes where it is worn.
  var wing=root.querySelector('.rb-wing');
  var BX=300,BY=612;
  add(wing,'path',{d:'M'+BX+' '+BY+' Q200 450 212 282 Q300 300 372 416 Q440 300 548 352 Q560 500 470 556 Q392 600 '+BX+' '+BY+'Z',
                   fill:'none',stroke:INK,'stroke-width':2.2,'stroke-linejoin':'round'});
  for(var i=0;i<16;i++){
    var a=(-158+i*10.5)*Math.PI/180,L=180+Math.sin(i*.8)*86;
    add(wing,'path',{d:'M'+BX+' '+BY+'Q'+(BX+Math.cos(a)*L*.55-10)+' '+(BY+Math.sin(a)*L*.55)+' '+(BX+Math.cos(a)*L).toFixed(1)+' '+(BY+Math.sin(a)*L).toFixed(1),
                     fill:'none',stroke:INK,'stroke-width':(1.5-i*.04).toFixed(2),opacity:.9});
  }
  for(var c=1;c<7;c++){
    var t=c/7,d='M';
    for(var j=0;j<16;j++){
      var a2=(-158+j*10.5)*Math.PI/180,L2=(180+Math.sin(j*.8)*86)*t;
      d+=(j?'L':'')+(BX+Math.cos(a2)*L2).toFixed(1)+' '+(BY+Math.sin(a2)*L2).toFixed(1);
    }
    add(wing,'path',{d:d,fill:'none',stroke:INK,'stroke-width':.7,opacity:.65});
  }
  [[318,452,15,11],[404,478,11,8],[492,468,9,13],[262,398,8,6]].forEach(function(h){
    add(wing,'ellipse',{cx:h[0],cy:h[1],rx:h[2],ry:h[3],fill:PAPER,stroke:INK,'stroke-width':.9});
  });
  add(wing,'ellipse',{cx:BX-6,cy:BY+6,rx:13,ry:11,fill:INK});
  add(wing,'path',{d:'M'+(BX-14)+' '+(BY-2)+'q-26 -16 -40 -40M'+(BX-16)+' '+(BY+4)+'q-30 -6 -48 -22',fill:'none',stroke:INK,'stroke-width':1.6});
  add(wing,'path',{d:'M'+(BX-8)+' '+(BY+16)+'q-6 26 -22 40M'+(BX+2)+' '+(BY+16)+'q2 28 -8 44',fill:'none',stroke:INK,'stroke-width':1.3});
  gaps(wing,200,270,370,360,150);

  var btns=[].slice.call(root.querySelectorAll('[data-format-btn]'));
  var NAMES={corner:['四角布字','Corner title'],label:['标本标签','Specimen labels']};
  function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en';}
  function text(){btns.forEach(function(b){b.textContent=NAMES[b.dataset.formatBtn][zh()?0:1];});}
  function set(f){
    root.dataset.format=f;
    btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.formatBtn===f?'true':'false');});
    var fc=root.querySelector('.rb-focus');
    fc.setAttribute('cx',f==='corner'?360:330);fc.setAttribute('cy',f==='corner'?470:452);fc.setAttribute('r',f==='corner'?112:118);
    root.dispatchEvent(new CustomEvent('gd:layout',{bubbles:true}));
  }
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,auto=!reduce,timer;
  btns.forEach(function(b){b.addEventListener('click',function(){auto=false;clearTimeout(timer);set(b.dataset.formatBtn);});});
  function cycle(){if(!auto)return;timer=setTimeout(function(){set(root.dataset.format==='corner'?'label':'corner');cycle();},3600);}
  document.addEventListener('learnui:languagechange',text);
  text();cycle();
})();
</script>
