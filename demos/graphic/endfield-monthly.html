<div class="demo gd-specimen gd-endfield" data-mode="final">
  <div class="ef-frame" data-gd-canvas>
    <div class="ef-panel">
      <div class="ef-chip">
        <span class="ef-badge" data-ov-focus="金币角标，金色花销之一" data-ov-focus-en="The coin badge, one of the gold spends"><b>¥</b></span>
        <svg class="ef-art" viewBox="0 0 120 100" aria-hidden="true" preserveAspectRatio="xMidYMax slice">
          <defs><linearGradient id="ef-sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1a2333"/><stop offset="1" stop-color="#2E3B4E"/></linearGradient></defs>
          <rect width="120" height="100" fill="url(#ef-sky)"/>
          <circle cx="92" cy="22" r="11" fill="#D9A94E" opacity=".85"/>
          <path d="M0 100 L22 52 L36 74 L54 40 L72 70 L90 56 L104 78 L120 62 L120 100 Z" fill="#0B0E13"/>
          <g data-ov-type="角色立绘区" data-ov-type-en="Character art area">
            <path d="M42 100 C42 68 49 54 58 46 C67 54 74 68 74 100 Z" fill="#F5F2EA"/>
            <path d="M52 100 C52 76 56 63 58 58 C60 63 64 76 64 100 Z" fill="#D9A94E" opacity=".55"/>
            <circle cx="58" cy="36" r="11" fill="#F5F2EA"/>
            <path d="M47 35 C47 22 52 18 58 18 C64 18 69 22 69 35 L67 32 C64 26 52 26 49 32 Z" fill="#2E3B4E"/>
          </g>
        </svg>
      </div>
      <div class="ef-side">
        <p class="ef-lease"><span class="lang-zh">月卡 · 每日领取，30 天有效</span><span class="lang-en">Monthly pass · 30 days</span></p>
        <div class="ef-goods">
          <div class="ef-good"><i>◆</i><b>×300</b></div>
          <div class="ef-good"><i>▲</i><b>×5</b></div>
        </div>
        <button class="ef-buy" type="button"><span class="lang-zh">¥ 30 立即购买</span><span class="lang-en">¥ 30 Buy now</span></button>
      </div>
      <span class="ef-hairline" aria-hidden="true"></span>
      <div class="ef-icons">
        <span class="ef-ico"><i>◆</i><em>300</em></span><span class="ef-ico"><i>▲</i><em>5</em></span><span class="ef-ico"><i>■</i><em>2</em></span><span class="ef-ico"><i>●</i><em>10</em></span><span class="ef-ico"><i>✦</i><em>1</em></span><span class="ef-more">…</span>
      </div>
      <span class="ef-space" data-ov-space="小卡与按钮之间厚重的深色留白" data-ov-space-en="Heavy dark padding between chip and button"></span>
    </div>
    <svg class="gd-grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="30" y1="0" x2="30" y2="100"/><line x1="0" y1="76" x2="100" y2="76"/></svg>
  </div>
  <div class="gd-controls" role="group" aria-label="Build order"><button type="button" data-mode-btn="struct">Structure</button><button type="button" data-mode-btn="final" aria-pressed="true">Finished</button></div>
</div>
<style>
.gd-endfield{width:min(560px,calc(100vw - 80px));font:12px/1.4 system-ui,-apple-system,"PingFang SC",sans-serif}
.gd-endfield *{box-sizing:border-box}
.ef-frame{position:relative;width:100%;aspect-ratio:1080/330;overflow:hidden;border-radius:6px;background:#0B0E13}
.ef-panel{position:absolute;inset:0;background:linear-gradient(160deg,#131926,#101622 60%,#0D121C);display:grid;grid-template-columns:30% 1fr;grid-template-rows:1fr auto;padding:2.6% 3% 2.4%;column-gap:3.4%}
.ef-chip{position:relative;border-radius:.9em;overflow:hidden;background:#1a2333}
.ef-chip:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(217,169,78,.35)}
.ef-art{position:absolute;inset:0;width:100%;height:100%}
.ef-badge{position:absolute;right:7%;top:5%;width:20%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 28%,#f3d488,#D9A94E 55%,#9a742f);display:grid;place-items:center;box-shadow:0 .15em .35em rgba(0,0,0,.5)}
.ef-badge b{color:#3a2c10;font:900 calc(var(--ef-u,460px)*.045)/1 "Avenir Next",system-ui,sans-serif}
.ef-side{display:flex;flex-direction:column;justify-content:center;gap:.55em;min-width:0}
.ef-lease{margin:0;color:#F5F2EA;font:700 calc(var(--ef-u,460px)*.036)/1.25 system-ui,sans-serif}
.ef-lease .lang-en{color:#8a94a6;font-weight:600;font-size:.86em}
.ef-goods{display:flex;gap:4%}
.ef-good{display:flex;align-items:center;gap:.35em;background:#18202e;border:1px solid #232d3d;border-radius:.4em;padding:.22em .55em}
.ef-good i{color:#D9A94E;font-style:normal;font-size:calc(var(--ef-u,460px)*.032)}
.ef-good b{color:#F5F2EA;font:600 calc(var(--ef-u,460px)*.028)/1 system-ui,sans-serif}
.ef-buy{align-self:flex-start;border:0;border-radius:.55em;padding:.42em .9em;background:linear-gradient(180deg,#efcb7c,#D9A94E 55%,#b8873a);color:#241a06;font:800 calc(var(--ef-u,460px)*.034)/1 system-ui,sans-serif;letter-spacing:.03em;cursor:pointer;box-shadow:0 .12em .3em rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.4)}
.ef-hairline{grid-column:1/3;grid-row:2;height:1px;background:linear-gradient(90deg,transparent,rgba(217,169,78,.5),transparent);margin:2.2% 0 2%}
.ef-icons{grid-column:1/3;grid-row:3;display:flex;gap:3.2%;align-items:center}
.ef-ico{display:flex;align-items:center;gap:.32em;color:#F5F2EA}
.ef-ico i{width:1.7em;height:1.7em;display:grid;place-items:center;background:#18202e;border:1px solid #232d3d;border-radius:.35em;font-style:normal;color:#D9A94E;font-size:calc(var(--ef-u,460px)*.028)}
.ef-ico em{font-style:normal;font-size:calc(var(--ef-u,460px)*.026);color:#8a94a6}
.ef-more{margin-left:auto;color:#5d6472;font-size:calc(var(--ef-u,460px)*.03);letter-spacing:.08em}
.ef-space{position:absolute;left:33%;top:18%;width:26%;height:30%;pointer-events:none}
/* Structure mode mirrors the tutorial's first step: bare rectangles, no art, no gold. */
.gd-endfield[data-mode="struct"] .ef-art,.gd-endfield[data-mode="struct"] .ef-buy,.gd-endfield[data-mode="struct"] .ef-lease{visibility:hidden}
.gd-endfield[data-mode="struct"] .ef-badge{background:#39404d}
.gd-endfield[data-mode="struct"] .ef-badge b{visibility:hidden}
.gd-endfield[data-mode="struct"] .ef-buy{background:#39404d}
.gd-endfield[data-mode="struct"] .ef-ico i,.gd-endfield[data-mode="struct"] .ef-good i{color:#5d6472}
.gd-endfield[data-mode="struct"] .ef-hairline{background:#2a3342}
.gd-endfield .ef-art,.gd-endfield .ef-buy,.gd-endfield .ef-lease{transition:visibility 0s .25s}
.gd-grid{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
.gd-grid line{stroke:#22d3ee;stroke-width:1;stroke-dasharray:4 3;fill:none;vector-effect:non-scaling-stroke}
[data-show-grid="on"] .gd-grid{opacity:1}
.gd-controls{display:flex;justify-content:center;gap:4px;margin-top:8px}
.gd-controls button{border:1px solid #d7dbe3;border-radius:999px;background:#fff;color:#5d6472;padding:4px 9px;font:600 10px/1 system-ui,-apple-system,"PingFang SC",sans-serif;cursor:pointer}
.gd-controls button[aria-pressed="true"]{background:#1f2430;border-color:#1f2430;color:#fff}
@media (max-height:260px){.gd-endfield{width:calc(100vw - 40px)}.gd-controls{display:none}}
</style>
<script>
(function(){
  var root=document.currentScript.parentElement.querySelector('.gd-endfield');
  var frame=root.querySelector('.ef-frame');
  var btns=[].slice.call(root.querySelectorAll('[data-mode-btn]'));
  var NAMES={struct:['结构','Structure'],final:['成品','Finished']};
  function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en';}
  function text(){btns.forEach(function(b){b.textContent=NAMES[b.dataset.modeBtn][zh()?0:1];});}
  function setMode(m){root.dataset.mode=m;btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.modeBtn===m?'true':'false');});root.dispatchEvent(new CustomEvent('gd:layout',{bubbles:true}));}
  btns.forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.modeBtn);});});
  function fit(){root.style.setProperty('--ef-u',frame.offsetHeight+'px');}
  if('ResizeObserver' in window)new ResizeObserver(fit).observe(frame);
  document.addEventListener('learnui:languagechange',text);
  text();fit();
})();
</script>
