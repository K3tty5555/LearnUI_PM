<div class="demo gd-specimen gd-endfield" data-mode="final">
  <div class="ef-frame" data-gd-canvas>
    <div class="ef-panel">
      <div class="ef-chip">
        <span class="ef-badge" data-ov-focus="金币角标，金色花销之一" data-ov-focus-en="The coin badge, one of the gold spends"><b>¥</b></span>
        <svg class="ef-art" viewBox="0 0 120 170" aria-hidden="true">
          <defs><linearGradient id="ef-sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1a2333"/><stop offset="1" stop-color="#2E3B4E"/></linearGradient></defs>
          <rect width="120" height="170" fill="url(#ef-sky)"/>
          <circle cx="88" cy="34" r="16" fill="#D9A94E" opacity=".85"/>
          <path d="M0 170 L34 96 L52 128 L74 78 L98 132 L120 104 L120 170 Z" fill="#0B0E13"/>
          <g data-ov-type="角色立绘区" data-ov-type-en="Character art area">
            <path d="M38 170 C38 120 48 96 60 82 C72 96 82 120 82 170 Z" fill="#F5F2EA"/>
            <path d="M50 170 C50 130 56 108 60 100 C64 108 70 130 70 170 Z" fill="#D9A94E" opacity=".55"/>
            <circle cx="60" cy="66" r="15" fill="#F5F2EA"/>
            <path d="M45 64 C45 46 52 40 60 40 C68 40 75 46 75 64 L72 60 C68 52 52 52 48 60 Z" fill="#2E3B4E"/>
          </g>
        </svg>
        <span class="ef-chip-name">MONATSKARTE</span>
      </div>
      <div class="ef-side">
        <div class="ef-goods">
          <div class="ef-good"><i>◆</i><b>×300</b></div>
          <div class="ef-good"><i>▲</i><b>×5</b></div>
          <div class="ef-good"><i>●</i><b>×2</b></div>
        </div>
        <p class="ef-lease"><span class="lang-zh">月卡 · 每日领取，30 天有效</span><span class="lang-en">Monthly pass · 30 days</span></p>
        <button class="ef-buy" type="button"><span class="lang-zh">¥ 30 立即购买</span><span class="lang-en">¥ 30 Buy now</span></button>
      </div>
      <span class="ef-hairline" aria-hidden="true"></span>
      <div class="ef-icons">
        <span class="ef-ico"><i>◆</i><em>300</em></span><span class="ef-ico"><i>▲</i><em>5</em></span><span class="ef-ico"><i>■</i><em>2</em></span><span class="ef-ico"><i>●</i><em>10</em></span><span class="ef-ico"><i>✦</i><em>1</em></span>
      </div>
      <span class="ef-space" data-ov-space="小卡四周厚重的深色留白" data-ov-space-en="The heavy dark padding around the chip"></span>
    </div>
    <svg class="gd-grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="0" x2="0" y2="100"/><line x1="44" y1="0" x2="44" y2="100"/><line x1="0" y1="84" x2="100" y2="84"/></svg>
  </div>
  <div class="gd-controls" role="group" aria-label="Build order"><button type="button" data-mode-btn="struct">Structure</button><button type="button" data-mode-btn="final" aria-pressed="true">Finished</button></div>
</div>
<style>
.gd-endfield{width:min(430px,calc(100vw - 80px));font:12px/1.4 system-ui,-apple-system,"PingFang SC",sans-serif}
.gd-endfield *{box-sizing:border-box}
.ef-frame{position:relative;width:100%;aspect-ratio:31/38;overflow:hidden;border-radius:4px;background:#0B0E13}
.ef-panel{position:absolute;inset:6.5%;background:linear-gradient(160deg,#131926,#101622 60%,#0D121C);border:1px solid #1E2836;display:grid;grid-template-columns:44% 1fr;grid-template-rows:1fr auto auto;gap:0 6%;padding:7% 6.5% 6%}
.ef-chip{grid-row:1/4;position:relative;border-radius:calc(var(--ef-u,460px)*.045);overflow:hidden;background:#1a2333}
.ef-chip:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(217,169,78,.35)}
.ef-art{position:absolute;inset:0;width:100%;height:100%}
.ef-badge{position:absolute;right:6%;top:5%;width:17%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 28%,#f3d488,#D9A94E 55%,#9a742f);display:grid;place-items:center;box-shadow:0 calc(var(--ef-u,460px)*.008) calc(var(--ef-u,460px)*.02) rgba(0,0,0,.5)}
.ef-badge b{color:#3a2c10;font:900 calc(var(--ef-u,460px)*.038)/1 "Avenir Next",system-ui,sans-serif}
.ef-chip-name{position:absolute;left:0;right:0;bottom:0;padding:4% 7%;background:linear-gradient(transparent,rgba(11,14,19,.85));color:#F5F2EA;font:700 calc(var(--ef-u,460px)*.026)/1 system-ui,sans-serif;letter-spacing:.16em}
.ef-side{display:flex;flex-direction:column;justify-content:flex-end;gap:5%;padding-bottom:4%}
.ef-goods{display:flex;gap:5%;align-items:center}
.ef-good{flex:1;display:flex;align-items:center;gap:6%;background:#18202e;border:1px solid #232d3d;border-radius:.4em;padding:2.5% 5%}
.ef-good i{color:#D9A94E;font-style:normal;font-size:calc(var(--ef-u,460px)*.03)}
.ef-good b{color:#F5F2EA;font:600 calc(var(--ef-u,460px)*.023)/1 system-ui,sans-serif}
.ef-lease{margin:0;color:#8a94a6;font-size:calc(var(--ef-u,460px)*.021);line-height:1.5}
.ef-buy{border:0;border-radius:.5em;padding:4.5% 6%;background:linear-gradient(180deg,#efcb7c,#D9A94E 55%,#b8873a);color:#241a06;font:800 calc(var(--ef-u,460px)*.028)/1 system-ui,sans-serif;letter-spacing:.04em;cursor:pointer;box-shadow:0 calc(var(--ef-u,460px)*.007) calc(var(--ef-u,460px)*.02) rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.4)}
.ef-hairline{grid-column:1/3;grid-row:2;height:1px;background:linear-gradient(90deg,transparent,rgba(217,169,78,.5),transparent);margin:4.5% 0 4%}
.ef-icons{grid-column:1/3;grid-row:3;display:grid;grid-template-columns:repeat(5,1fr);gap:4%}
.ef-ico{display:flex;flex-direction:column;align-items:center;gap:8%;color:#F5F2EA}
.ef-ico i{width:100%;aspect-ratio:1;display:grid;place-items:center;background:#18202e;border:1px solid #232d3d;border-radius:.35em;font-style:normal;color:#D9A94E;font-size:calc(var(--ef-u,460px)*.026)}
.ef-ico em{font-style:normal;font-size:calc(var(--ef-u,460px)*.021);color:#8a94a6}
.ef-space{position:absolute;left:53%;top:9%;width:40%;height:52%;pointer-events:none}
/* Structure mode mirrors the tutorial's first step: bare rectangles, no art, no gold. */
.gd-endfield[data-mode="struct"] .ef-art,.gd-endfield[data-mode="struct"] .ef-badge b,.gd-endfield[data-mode="struct"] .ef-buy,.gd-endfield[data-mode="struct"] .ef-chip-name{visibility:hidden}
.gd-endfield[data-mode="struct"] .ef-badge{background:#39404d}
.gd-endfield[data-mode="struct"] .ef-buy{background:#39404d}
.gd-endfield[data-mode="struct"] .ef-ico i,.gd-endfield[data-mode="struct"] .ef-good i{color:#5d6472}
.gd-endfield[data-mode="struct"] .ef-hairline{background:#2a3342}
.gd-endfield .ef-art,.gd-endfield .ef-badge,.gd-endfield .ef-buy,.gd-endfield .ef-chip-name{transition:visibility 0s .3s}
.gd-grid{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
.gd-grid line{stroke:#22d3ee;stroke-width:1;stroke-dasharray:4 3;fill:none;vector-effect:non-scaling-stroke}
[data-show-grid="on"] .gd-grid{opacity:1}
.gd-controls{display:flex;justify-content:center;gap:4px;margin-top:8px}
.gd-controls button{border:1px solid #d7dbe3;border-radius:999px;background:#fff;color:#5d6472;padding:4px 9px;font:600 10px/1 system-ui,-apple-system,"PingFang SC",sans-serif;cursor:pointer}
.gd-controls button[aria-pressed="true"]{background:#1f2430;border-color:#1f2430;color:#fff}
@media (max-height:260px){.gd-endfield{width:calc(100vw - 40px)}.gd-controls{display:none}}
</style>
<script>
(function(){
  var root=document.currentScript.parentElement.querySelector('.gd-endfield');
  var frame=root.querySelector('.ef-frame');
  var btns=[].slice.call(root.querySelectorAll('[data-mode-btn]'));
  var NAMES={struct:['结构','Structure'],final:['成品','Finished']};
  function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en';}
  function text(){btns.forEach(function(b){b.textContent=NAMES[b.dataset.modeBtn][zh()?0:1];});}
  function setMode(m){root.dataset.mode=m;btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.modeBtn===m?'true':'false');});root.dispatchEvent(new CustomEvent('gd:layout',{bubbles:true}));}
  btns.forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.modeBtn);});});
  function fit(){root.style.setProperty('--ef-u',frame.offsetHeight+'px');}
  if('ResizeObserver' in window)new ResizeObserver(fit).observe(frame);
  document.addEventListener('learnui:languagechange',text);
  text();fit();
})();
</script>
