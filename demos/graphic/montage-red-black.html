<div class="demo gd-specimen gd-montage" data-step="4">
  <div class="mt-frame" data-gd-canvas>
    <div class="mt-paper">
      <div class="mt-col mt-col-num">
        <div class="mt-num" data-ov-type="超大数字当图像用" data-ov-type-en="An oversized numeral treated as an image">
          <svg viewBox="0 0 200 300" aria-hidden="true"><text x="100" y="250" text-anchor="middle" font-family="'Avenir Next Condensed','Bahnschrift',Impact,sans-serif" font-weight="900" font-size="270" fill="#111">1</text></svg>
          <i class="mt-num-badge" data-ov-focus="红色数字，全页唯一饱和点" data-ov-focus-en="The red numeral, the only saturated point"></i>
        </div>
        <div class="mt-facts">DOK. FOTOGRAFIE — SERIE 04<br>STRASSENBILD / ROT<br>78 SEITEN · TAGESDOSSIER</div>
      </div>
      <div class="mt-col mt-col-photo">
        <div class="mt-photo"><canvas class="mt-halftone" width="220" height="300"></canvas></div>
        <div class="mt-red" data-ov-space="唯一的纯红色块" data-ov-space-en="The single pure-red block"></div>
        <div class="mt-caption">AUSGABE 04 — MONTAGE</div>
      </div>
      <h2 class="mt-head" data-ov-type="窄体大写大标题" data-ov-type-en="Condensed caps headline"><span>STRASSE</span><span>IM <b class="mt-head-red">KOPF</b></span></h2>
      <span class="mt-tape" aria-hidden="true"></span>
    </div>
    <svg class="gd-grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="41" y1="0" x2="41" y2="100"/><line x1="0" y1="6" x2="100" y2="6"/><line x1="0" y1="88" x2="100" y2="88"/></svg>
  </div>
  <div class="gd-controls" role="group" aria-label="Build steps"><button type="button" data-step-btn="1">1 Photo</button><button type="button" data-step-btn="2">2 Numeral</button><button type="button" data-step-btn="3">3 Type</button><button type="button" data-step-btn="4" aria-pressed="true">4 Final</button></div>
</div>
<style>
.gd-montage{width:min(430px,calc(100vw - 80px));font:12px/1.4 system-ui,-apple-system,"PingFang SC",sans-serif}
.gd-montage *{box-sizing:border-box}
.mt-frame{position:relative;width:100%;aspect-ratio:27/38;overflow:hidden;border-radius:4px;background:#F2EFE9}
.mt-paper{position:absolute;inset:5.5%;background:#F2EFE9;display:grid;grid-template-columns:26% 1fr;grid-template-rows:auto 1fr auto;gap:3%}
.mt-col-num{grid-row:1/4;display:flex;flex-direction:column;gap:3%;min-height:0}
.mt-num{position:relative;flex:1;min-height:0}
.mt-num{height:64%}.mt-num svg{width:100%;height:100%;display:block}
.mt-num-badge{position:absolute;left:8%;top:4%;width:14%;aspect-ratio:1;background:#D8281E}
.mt-facts{font:700 calc(var(--mt-u,420px)*.021)/1.5 "Courier New",monospace;color:#111;letter-spacing:.04em}
.mt-col-photo{grid-row:1/4;display:flex;flex-direction:column;gap:2.4%;min-height:0}
.mt-photo{flex:1;min-height:0;position:relative;background:#111}
.mt-halftone{width:100%;height:100%;display:block}
.mt-red{height:10%;background:#D8281E;width:100%}
.mt-caption{font:700 calc(var(--mt-u,420px)*.02)/1 "Courier New",monospace;color:#111;letter-spacing:.14em}
.mt-head{position:absolute;left:5.5%;right:5.5%;bottom:9%;margin:0;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none}
.mt-head span{font:900 calc(var(--mt-u,420px)*.152)/0.82 "Avenir Next Condensed","Bahnschrift","Arial Narrow",Impact,sans-serif;letter-spacing:-.005em;color:#F2EFE9;text-shadow:0 0 1.2em rgba(17,17,17,.55);transform:scaleY(1.12);transform-origin:0 100%}
.mt-head .mt-head-red{color:#D8281E;font-style:inherit}
.mt-tape{position:absolute;right:7%;top:6%;width:13%;height:4%;background:rgba(242,239,233,.65);transform:rotate(8deg);border:1px solid rgba(17,17,17,.12)}
.gd-montage .st1,.gd-montage .st2,.gd-montage .st3{transition:opacity .5s ease}
.gd-montage[data-step="1"] .st2,.gd-montage[data-step="1"] .st3,.gd-montage[data-step="2"] .st3{opacity:0}
.gd-montage[data-step="1"] .mt-num,.gd-montage[data-step="1"] .mt-facts{opacity:0}
.gd-montage[data-step="2"] .mt-head,.gd-montage[data-step="2"] .mt-facts{opacity:0}
.gd-montage[data-step="3"] .mt-head{opacity:0}
.gd-grid{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
.gd-grid line{stroke:#22d3ee;stroke-width:1;stroke-dasharray:4 3;fill:none;vector-effect:non-scaling-stroke}
[data-show-grid="on"] .gd-grid{opacity:1}
.gd-controls{display:flex;justify-content:center;gap:4px;margin-top:8px}
.gd-controls button{border:1px solid #d7dbe3;border-radius:999px;background:#fff;color:#5d6472;padding:4px 9px;font:600 10px/1 system-ui,-apple-system,"PingFang SC",sans-serif;cursor:pointer}
.gd-controls button[aria-pressed="true"]{background:#1f2430;border-color:#1f2430;color:#fff}
@media (max-height:260px){.gd-montage{width:calc(100vw - 40px)}.gd-controls{display:none}}
@media (prefers-reduced-motion:reduce){.gd-montage .st1,.gd-montage .st2,.gd-montage .st3{transition:none}}
</style>
<script>
(function(){
  var root=document.currentScript.parentElement.querySelector('.gd-montage');
  var frame=root.querySelector('.mt-frame');
  // Halftone: a street-corner scene drawn as dots, red for one area and black elsewhere.
  var cv=root.querySelector('.mt-halftone'),ctx=cv.getContext('2d');
  function seeded(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var R=seeded(14);
  function draw(){
    var w=cv.width,h=cv.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#111';
    var d=2.6;
    for(var y=d/2;y<h;y+=d*1.55)for(var x=d/2;x<w;x+=d*1.55){
      // A simple street-corner scene in darkness values: sky bright, buildings mid, road dark.
      var horizon=h*0.58, skyscrapers=[[0.08,0.30,0.42],[0.33,0.22,0.30],[0.52,0.34,0.46],[0.86,0.26,0.36]];
      var v;
      if(y<horizon){ v=0.78-((y/horizon)*0.32); // sky gradient
        for(var k=0;k<skyscrapers.length;k++){var b=skyscrapers[k];
          if(x>w*b[0]&&x<w*(b[0]+b[1])&&y>h*(0.20+b[2]*0.4)&&y<horizon){
            v=0.30+((x/w-b[0])*0.5); if(((x/d|0)+(y/d|0))%7===0)v+=0.28; break; }}
      } else { v=0.16+((y-horizon)/(h-horizon))*0.1; if(Math.abs((y-h*0.80))<d*2)v+=0.42; } // road + kerb line
      if(R()<0.02)v=Math.min(1,v+0.5);
      var r=Math.sqrt(v)*d*0.72;
      if(r<0.32)continue;
      ctx.fillStyle=(x>w*0.66&&y>h*0.66)?'#D8281E':'#111';
      ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();
    }
  }
  draw();
  function fit(){root.style.setProperty('--mt-u',frame.offsetHeight+'px');}
  var btns=[].slice.call(root.querySelectorAll('[data-step-btn]'));
  var NAMES={1:['1 照片','1 Photo'],2:['2 数字','2 Numeral'],3:['3 标题','3 Type'],4:['4 成稿','4 Final']};
  function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en';}
  function text(){btns.forEach(function(b){b.textContent=NAMES[b.dataset.stepBtn][zh()?0:1];});}
  function setStep(n){root.dataset.step=String(n);btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.stepBtn===String(n)?'true':'false');});root.dispatchEvent(new CustomEvent('gd:layout',{bubbles:true}));}
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,auto=!reduce,timer;
  btns.forEach(function(b){b.addEventListener('click',function(){auto=false;clearTimeout(timer);setStep(+b.dataset.stepBtn);});});
  function cycle(){if(!auto)return;timer=setTimeout(function(){setStep(+root.dataset.step%4+1);cycle();},3000);}
  if('ResizeObserver' in window)new ResizeObserver(fit).observe(frame);
  document.addEventListener('learnui:languagechange',text);
  text();fit();cycle();
})();
</script>
