<div class="demo gd-specimen gd-wtree" data-step="7">
  <div class="wt-frame" data-gd-canvas>
    <svg class="wt-svg" viewBox="0 0 720 958" role="img" aria-label="沉沦在世界树之下">
      <defs>
        <linearGradient id="wt-disc" gradientUnits="userSpaceOnUse" x1="0" y1="230" x2="0" y2="730"><stop offset="0" stop-color="#3F45EE"/><stop offset=".48" stop-color="#4C52E8"/><stop offset=".76" stop-color="#8C90E2" stop-opacity=".85"/><stop offset="1" stop-color="#C6C8E6" stop-opacity=".3"/></linearGradient>
        <radialGradient id="wt-moon" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#3E5BFF"/><stop offset=".6" stop-color="#2233E5"/><stop offset="1" stop-color="#1626C8"/></radialGradient>
        <g class="wt-masks"></g>
      </defs>
      <!-- 1 · grey ground, noise, concrete wall in Multiply -->
      <rect width="720" height="958" fill="#D4D4D4"/>
      <image class="wt-wall" x="0" y="0" width="720" height="958" preserveAspectRatio="none"/>
      <!-- 2 · cross of guides, radiating lines, inner ring of ticks and stars -->
      <g class="st2">
        <g class="wt-guides" stroke="#22b8d8" stroke-width="1" opacity=".7"><line x1="362" y1="0" x2="362" y2="958"/><line x1="0" y1="470" x2="720" y2="470"/></g>
        <g class="wt-rays" stroke="#1d1d1d" stroke-width="1.3"></g>
      </g>
      <!-- 3 · the blue disc with its fading gradient and ring (before slicing) -->
      <g class="st3 wt-whole">
        <circle cx="362" cy="470" r="240" fill="url(#wt-disc)"/>
        <circle cx="362" cy="470" r="257" fill="none" stroke="url(#wt-disc)" stroke-width="10"/>
      </g>
      <!-- 4 · the disc cut along the radiating lines -->
      <g class="st4 wt-sliced" data-ov-type="画面无文字：层级靠大小，圆盘最大" data-ov-type-en="No lettering: hierarchy by scale, the disc first"></g>
      <g class="st4 wt-rays-front" stroke="#1d1d1d" stroke-width="1.1" opacity=".75"></g>
      <g class="st2 wt-inner" fill="#1d1d1d" stroke="#1d1d1d"></g>
      <!-- 5 · mountains and whale, both turned into contour lines -->
      <image class="st5 wt-land" x="0" y="0" width="720" height="958" preserveAspectRatio="none"/>
      <!-- 6 · world tree and the orbit rings (back halves behind the tree, front halves over it) -->
      <g class="st6">
        <path class="wt-ring-back wt-ring-k" fill="none" stroke="#141414" stroke-width="2.4"/>
        <path class="wt-ring-back wt-ring-b" fill="none" stroke="#2233E5" stroke-width="3" stroke-dasharray="40 8 6 8"/>
        <image class="wt-tree" x="0" y="0" width="720" height="958" preserveAspectRatio="none"/>
        <path class="wt-ring-front wt-ring-k" fill="none" stroke="#141414" stroke-width="2.6"/>
        <path class="wt-ring-front wt-ring-b" fill="none" stroke="#2233E5" stroke-width="3.2" stroke-dasharray="70 10 8 10"/>
        <rect x="322" y="560" width="96" height="70" fill="none" data-ov-focus="树干和鲸背相接、两条圆环穿过处" data-ov-focus-en="Trunk meets the whale's back, crossed by both rings"/>
      </g>
      <!-- 7 · crescent moons around the edge, pixel checkerboards in opposite corners -->
      <g class="st7">
        <g class="wt-moons"></g>
        <g class="wt-pixels" fill="#2a3bea"></g>
      </g>
      <rect x="150" y="8" width="190" height="60" fill="none" data-ov-space="顶部只有放射线伸进来的水泥底" data-ov-space-en="Bare concrete at the top, reached only by the rays"/>
    </svg>
    <svg class="gd-grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="50.3" y1="0" x2="50.3" y2="100"/><line x1="0" y1="49.1" x2="100" y2="49.1"/></svg>
  </div>
  <div class="gd-controls" role="group" aria-label="Build steps"><button type="button" data-step-btn="1">1</button><button type="button" data-step-btn="2">2</button><button type="button" data-step-btn="3">3</button><button type="button" data-step-btn="4">4</button><button type="button" data-step-btn="5">5</button><button type="button" data-step-btn="6">6</button><button type="button" data-step-btn="7" aria-pressed="true">7</button></div>
</div>
<style>

.gd-wtree .st2,.gd-wtree .st3,.gd-wtree .st4,.gd-wtree .st5,.gd-wtree .st6,.gd-wtree .st7,.gd-wtree .wt-guides{transition:opacity .5s ease}
.gd-wtree[data-step="1"] .st2,.gd-wtree[data-step="1"] .st3,.gd-wtree[data-step="2"] .st3{opacity:0}
.gd-wtree[data-step="1"] .st4,.gd-wtree[data-step="2"] .st4,.gd-wtree[data-step="3"] .st4{opacity:0}
.gd-wtree[data-step="4"] .st3,.gd-wtree[data-step="5"] .st3,.gd-wtree[data-step="6"] .st3,.gd-wtree[data-step="7"] .st3{opacity:0}
.gd-wtree[data-step="1"] .st5,.gd-wtree[data-step="2"] .st5,.gd-wtree[data-step="3"] .st5,.gd-wtree[data-step="4"] .st5{opacity:0}
.gd-wtree[data-step="1"] .st6,.gd-wtree[data-step="2"] .st6,.gd-wtree[data-step="3"] .st6,.gd-wtree[data-step="4"] .st6,.gd-wtree[data-step="5"] .st6{opacity:0}
.gd-wtree:not([data-step="7"]) .st7{opacity:0}
.gd-wtree[data-step="7"] .wt-guides,.gd-wtree[data-step="6"] .wt-guides{opacity:0}
.gd-grid{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
.gd-grid line{stroke:#22d3ee;stroke-width:1;stroke-dasharray:4 3;fill:none;vector-effect:non-scaling-stroke}
[data-show-grid="on"] .gd-grid{opacity:1}
.gd-controls{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:8px}
.gd-controls button{border:1px solid #d7dbe3;border-radius:999px;background:#fff;color:#5d6472;padding:4px 8px;font:600 10px/1 system-ui,-apple-system,"PingFang SC",sans-serif;cursor:pointer}
.gd-controls button[aria-pressed="true"]{background:#1f2430;border-color:#1f2430;color:#fff}
@media (max-height:260px){.gd-wtree{width:auto;height:calc(100vh - 24px);aspect-ratio:720/958}.gd-controls{display:none}}
@media (prefers-reduced-motion:reduce){.gd-wtree .st2,.gd-wtree .st3,.gd-wtree .st4,.gd-wtree .st5,.gd-wtree .st6,.gd-wtree .st7,.gd-wtree .wt-guides{transition:none}}
</style>

  L.save();L.clip(whale);L.strokeStyle='rgba(235,235,235,.85)';L.lineWidth=1.3;for(i=0;i<13;i++){L.beginPath();L.moveTo(92+i*13,640+i*4);L.quadraticCurveTo(170+i*16,760+i*6,300+i*20,958);L.stroke();}L.restore();
