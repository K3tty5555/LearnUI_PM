<div class="demo gd-specimen gd-ti">
  <div class="ti-poster" data-gd-canvas>
    <svg class="ti-sky" viewBox="0 0 300 450" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="ti-rail ti-rail-l" aria-hidden="true"><span>TEAM LIQUID · DOTA 2 · TI 2025</span></div>
    <div class="ti-rail ti-rail-r" aria-hidden="true"><span>SEEK THE STARS</span><i></i><i></i><i></i><i></i></div>
    <svg class="ti-player" viewBox="0 0 200 260" aria-hidden="true">
      <defs><linearGradient id="ti-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe6ff"/><stop offset="1" stop-color="#3b5cd6"/></linearGradient><linearGradient id="ti-shirt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8f0ff"/><stop offset=".5" stop-color="#9fb8f7"/><stop offset="1" stop-color="#1c2f8c"/></linearGradient></defs>
      <path d="M30 260c4-52 34-78 70-84 36 6 66 32 70 84z" fill="url(#ti-shirt)"/>
      <path d="M86 150h28v30H86z" fill="#9fb2e8"/>
      <ellipse cx="100" cy="104" rx="38" ry="48" fill="url(#ti-skin)"/>
      <path d="M62 94c4-32 26-46 42-46 22 0 38 16 36 42-12-14-30-18-46-14-14 4-26 10-32 18z" fill="#1a2357"/>
      <path d="M86 196l14 14 14-14-6 30H92z" fill="#2a49c8"/>
    </svg>
    <span class="gd-focus" data-ov-focus="被青光照亮的脸" data-ov-focus-en="Face lit by cyan" style="left:50%;top:40%"></span>
    <span class="gd-space" data-ov-space="头顶星空留空" data-ov-space-en="Star field kept open" style="left:12%;top:3%;width:76%;height:16%"></span>
    <div class="ti-text">
      <b class="ti-title" data-ov-type="衬线大标题" data-ov-type-en="Serif title">Game Day</b>
      <span class="ti-vs" data-ov-type="对阵 · 小号粗体" data-ov-type-en="Opponent · small bold">VS NIGMA GALAXY</span>
      <span class="ti-time" data-ov-type="时间 · 最小字" data-ov-type-en="Time · smallest">13:00 CEST / 7:00 EDT</span>
    </div>
    <svg class="gd-grid" viewBox="0 0 300 450" preserveAspectRatio="none" aria-hidden="true"><line x1="22" y1="0" x2="22" y2="450"/><line x1="278" y1="0" x2="278" y2="450"/><line x1="0" y1="352" x2="300" y2="352"/></svg>
  </div>
</div>
<style>
.gd-ti{width:min(280px,calc(100vw - 80px));font:12px/1.4 system-ui,-apple-system,"PingFang SC",sans-serif}
.gd-ti *{box-sizing:border-box}
.ti-poster{position:relative;width:100%;aspect-ratio:2/3;overflow:hidden;border-radius:4px;background:radial-gradient(120% 80% at 50% 35%,#1d3fb8 0%,#0b1660 45%,#060b33 100%)}
.ti-sky{position:absolute;inset:0;width:100%;height:100%}
.ti-player{position:absolute;left:12%;right:12%;bottom:14%;width:76%;filter:drop-shadow(0 0 18px rgba(127,231,255,.35))}
.ti-rail{position:absolute;top:6%;bottom:6%;display:flex;flex-direction:column;align-items:center;gap:6px;color:rgba(232,236,255,.75);font:600 calc(var(--ti-w,280px) * .024)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em}
.ti-rail span{writing-mode:vertical-rl;transform:rotate(180deg)}
.ti-rail-l{left:3%}.ti-rail-r{right:3%}
.ti-rail-r span{transform:none}
.ti-rail i{width:4px;height:4px;border-radius:50%;background:#7fe7ff;opacity:.7}
.ti-rail-l:before,.ti-rail-r:after{content:"";flex:1;width:1px;background:linear-gradient(transparent,rgba(127,231,255,.6),transparent)}
.ti-text{position:absolute;left:8%;right:8%;bottom:4.5%;display:grid;gap:3px}
.ti-title{color:#eef2ff;font:400 calc(var(--ti-w,280px) * .15)/1 "Didot","Bodoni 72","Playfair Display",Georgia,serif;letter-spacing:-.01em}
.ti-vs{color:#fff;font:800 calc(var(--ti-w,280px) * .045)/1.1 "Avenir Next","Helvetica Neue",Arial,sans-serif;letter-spacing:.12em}
.ti-time{color:rgba(232,236,255,.7);font:500 calc(var(--ti-w,280px) * .032)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
.gd-grid{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
.gd-grid line{stroke:#22d3ee;stroke-width:1;stroke-dasharray:4 3;fill:none;vector-effect:non-scaling-stroke}
[data-show-grid="on"] .gd-grid{opacity:1}
.gd-space,.gd-focus{position:absolute;pointer-events:none}
@media (max-height:260px){.gd-ti{width:min(110px,calc(100vw - 40px))}}
</style>
<script>
(function(){
  var root=document.currentScript.parentElement.querySelector('.gd-ti');
  var poster=root.querySelector('.ti-poster'),sky=root.querySelector('.ti-sky');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Star field, two glowing arcs and a few four-point stars: the cosmic layer behind the photography.
  var seed=11;function r(){seed=(seed*16807)%2147483647;return seed/2147483647;}
  var stars='';for(var i=0;i<90;i++){stars+='<circle cx="'+(r()*300).toFixed(1)+'" cy="'+(r()*450).toFixed(1)+'" r="'+(r()*1.1+.2).toFixed(2)+'" fill="#fff" opacity="'+(r()*.7+.2).toFixed(2)+'" class="ti-star"/>';}
  function spark(x,y,s){return '<path d="M'+x+' '+(y-s)+'Q'+x+' '+y+' '+(x+s)+' '+y+'Q'+x+' '+y+' '+x+' '+(y+s)+'Q'+x+' '+y+' '+(x-s)+' '+y+'Q'+x+' '+y+' '+x+' '+(y-s)+'Z" fill="#cfefff"/>';}
  sky.innerHTML='<defs><filter id="ti-blur"><feGaussianBlur stdDeviation="3"/></filter></defs>'+stars+
    '<path d="M-20 300 Q150 120 320 260" stroke="#7fe7ff" stroke-width="5" fill="none" opacity=".55" filter="url(#ti-blur)"/><path d="M-20 300 Q150 120 320 260" stroke="#c9f6ff" stroke-width="1" fill="none" opacity=".9"/>'+
    '<path d="M0 360 Q160 210 300 330" stroke="#5c7cff" stroke-width="1" fill="none" opacity=".7"/>'+spark(58,70,9)+spark(246,118,6)+spark(230,40,4)+spark(40,220,5);
  function fit(){root.style.setProperty('--ti-w',poster.offsetWidth+'px');}
  var starsEl=[].slice.call(sky.querySelectorAll('.ti-star')),raf=0,visible=true;
  function tick(now){raf=0;if(!visible)return;starsEl.forEach(function(s,i){if(i%6===0)s.setAttribute('opacity',(.35+.45*Math.abs(Math.sin(now/900+i))).toFixed(2));});raf=requestAnimationFrame(tick);}
  if('ResizeObserver' in window)new ResizeObserver(fit).observe(poster);
  if('IntersectionObserver' in window)new IntersectionObserver(function(es){visible=es[0].isIntersecting;if(visible&&!raf&&!reduce)raf=requestAnimationFrame(tick);}).observe(poster);
  fit();if(!reduce)raf=requestAnimationFrame(tick);
})();
</script>
