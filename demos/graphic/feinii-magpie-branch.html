<div class="demo gd-specimen gd-feinii" data-step="4" data-motion="on">

          <stop offset="0" stop-color="#E3D6DC"/><stop offset=".55" stop-color="#C4B3BC"/><stop offset="1" stop-color="#8E8089"/>
        </linearGradient>

          <stop offset="0" stop-color="#E4E2E6"/><stop offset=".5" stop-color="#AFB2BA"/><stop offset="1" stop-color="#7C828B"/>
        </linearGradient>
        <linearGradient id="fn-tile" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5B6469"/><stop offset="1" stop-color="#2A3136"/>

            <circle cx="30" cy="22" r="11"/><circle cx="30" cy="22" r="4"/>

          </g>

          <circle cx="604" cy="146" r="15"/><circle cx="604" cy="176" r="15"/>
        </g>
        <text x="604" y="152" text-anchor="middle" font-family="'Songti SC','STSong',serif" font-size="15" fill="#E3DEE0">飞</text>
        <text x="604" y="182" text-anchor="middle" font-family="'Songti SC','STSong',serif" font-size="15" fill="#E3DEE0">鹊</text>
        <circle cx="608" cy="212" r="13" fill="#F2EAEA"/>

        <g class="fn-seal" data-ov-focus="朱红印：全画唯一的饱和色" data-ov-focus-en="The vermilion seal: the only saturated colour">
          <circle cx="594" cy="350" r="17" fill="#C92431"/>
          <circle cx="594" cy="350" r="13.5" fill="none" stroke="#F2EAEA" stroke-width="1.2" opacity=".85"/>
          <path d="M588 344h12M588 350h12M588 356h12" stroke="#F2EAEA" stroke-width="1.6" opacity=".8"/>
        </g>

        <!-- bottom left -->
        <g fill="none" stroke="#EFEAEC" stroke-width="2">
          <path d="M44 744 h56 q8 0 8 8 v76 q0 8 -8 8 h-56 q-8 0 -8 -8 v-76 q0 -8 8 -8z"/>
          <path d="M72 824 V770 M72 788 Q56 774 48 760 M72 782 Q88 768 96 756 M64 824 Q52 806 48 792 M80 824 Q92 806 96 792"/>
        </g>
        <g fill="none" stroke="#EFEAEC" stroke-width="2"><path d="M124 786 h52 q6 0 6 6 v50 q0 6 -6 6 h-52 q-6 0 -6 -6 v-50 q0 -6 6 -6z"/></g>
        <text x="150" y="828" text-anchor="middle" font-family="'Songti SC','STSong',serif" font-size="34" fill="#EFEAEC">鵲</text>
        <g font-family="'Didot','Playfair Display','Times New Roman',serif" font-size="40" letter-spacing="2" fill="none" stroke="#F3EEF0" stroke-width="1.3" opacity=".9">
          <text x="40" y="890">CHINESE</text><text x="40" y="928">STYLE</text>
        </g>
        <g font-family="'Didot','Playfair Display','Times New Roman',serif" font-size="10" fill="#8C8580" letter-spacing=".6">
          <text x="200" y="906">NEW CHINESE STYLE</text><text x="200" y="920">2026</text>
        </g>

        <!-- bottom right -->
        <g fill="none" stroke="#B9AEAE" stroke-width="1.8"><path d="M620 792 h56 q8 0 8 8 v56 q0 8 -8 8 h-56 q-8 0 -8 -8 v-56 q0 -8 8 -8z"/></g>
        <text x="648" y="846" text-anchor="middle" font-family="'Songti SC','STSong',serif" font-size="34" fill="#B9AEAE">尊</text>
        <g fill="#A79C9A" font-family="'Didot','Playfair Display','Times New Roman',serif" font-size="14" letter-spacing=".6" text-anchor="end">
          <text x="700" y="902">SEEKING HOPE IN THE ASHES</text><text x="700" y="924">BLOOMING IN DESPAIR.</text>
        </g>
      </g>

      <rect x="470" y="840" width="236" height="96" fill="none"
            data-ov-space="右下角被渐变冲淡的米白区，只剩两行小字" data-ov-space-en="The washed-out beige corner, left with two small lines"/>
      <rect width="720" height="960" filter="url(#fn-grain)" pointer-events="none"/>
    </svg>
    <svg class="gd-grid" viewBox="0 0 720 960" preserveAspectRatio="none" aria-hidden="true">
      <line x1="205" y1="0" x2="205" y2="960"/><line x1="347" y1="0" x2="347" y2="960"/>
      <line x1="482" y1="0" x2="482" y2="960"/><line x1="40" y1="0" x2="40" y2="960"/>
      <line x1="0" y1="108" x2="720" y2="108"/><line x1="0" y1="808" x2="720" y2="808"/>
    </svg>
  </div>
  <div class="gd-controls" role="group" aria-label="Build steps">
    <button type="button" data-step-btn="1">1</button><button type="button" data-step-btn="2">2</button><button type="button" data-step-btn="3">3</button><button type="button" data-step-btn="4" aria-pressed="true">4</button>
    <button type="button" class="fn-toggle" data-motion-btn aria-pressed="true">动</button>
  </div>
</div>
<style>
.gd-feinii{width:min(336px,calc(100vw - 80px));font:12px/1.4 system-ui,-apple-system,"PingFang SC",sans-serif}
.gd-feinii *{box-sizing:border-box}
.fn-frame{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;border-radius:4px;background:#0C1013}
.fn-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.fn-g2,.fn-g3,.fn-g4{transition:opacity var(--dur-3,320ms) var(--ease-out,ease)}
.gd-feinii[data-step="1"] .fn-g2,.gd-feinii[data-step="1"] .fn-g3,.gd-feinii[data-step="2"] .fn-g3{opacity:0}
.gd-feinii[data-step="1"] .fn-g4,.gd-feinii[data-step="2"] .fn-g4,.gd-feinii[data-step="3"] .fn-g4{opacity:0}
/* The published poster barely moves: a few pixels of sway and a slow drift in the mist. */
.gd-feinii[data-motion="on"] .fn-branch{animation:fn-sway calc(var(--dur-3,320ms) * 26) ease-in-out infinite alternate;transform-origin:96px 236px}
.gd-feinii[data-motion="on"] .fn-blooms{animation:fn-breathe calc(var(--dur-3,320ms) * 34) ease-in-out infinite alternate;transform-origin:50% 45%}
.gd-feinii[data-motion="on"] .fn-mist{animation:fn-drift calc(var(--dur-3,320ms) * 60) linear infinite alternate}
.gd-feinii[data-motion="on"] .fn-seal{animation:fn-pulse calc(var(--dur-3,320ms) * 22) ease-in-out infinite alternate;transform-origin:594px 350px}
@keyframes fn-sway{from{transform:rotate(-.45deg)}to{transform:rotate(.45deg)}}
@keyframes fn-breathe{from{transform:scale(.995) translateY(2px)}to{transform:scale(1.005) translateY(-2px)}}
@keyframes fn-drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes fn-pulse{from{opacity:.82}to{opacity:1}}
.gd-grid{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity var(--dur-2,200ms) var(--ease-out,ease);pointer-events:none;z-index:6}
.gd-grid line{stroke:#22d3ee;stroke-width:1;stroke-dasharray:4 3;fill:none;vector-effect:non-scaling-stroke}
[data-show-grid="on"] .gd-grid{opacity:1}
.gd-controls{display:flex;justify-content:center;gap:4px;margin-top:8px}
.gd-controls button{border:1px solid #d7dbe3;border-radius:999px;background:#fff;color:#5d6472;padding:4px 9px;font:600 10px/1 system-ui,-apple-system,"PingFang SC",sans-serif;cursor:pointer}
.gd-controls button[aria-pressed="true"]{background:#1f2430;border-color:#1f2430;color:#fff}
.fn-toggle{margin-left:8px}
@media (max-height:260px){.gd-feinii{width:min(150px,calc(100vw - 40px))}.gd-controls{display:none}}
@media (prefers-reduced-motion:reduce){
  .fn-g2,.fn-g3,.fn-g4{transition:none}
  .fn-branch,.fn-blooms,.fn-mist,.fn-seal{animation:none!important}
}
</style>
<script>
(function(){
  var root=document.currentScript.parentElement.querySelector('.gd-feinii');
  var NS='http://www.w3.org/2000/svg';
  // Pine needles: fans of short strokes cloned along the three branch paths.
  var host=root.querySelector('.fn-needles');
  var paths=[].slice.call(root.querySelectorAll('.fn-branch path'));
  paths.forEach(function(p,pi){
    var len=p.getTotalLength(),n=Math.round(len/26);
    for(var i=1;i<n;i++){
      var pt=p.getPointAtLength(i*len/n),prev=p.getPointAtLength(Math.max(0,i*len/n-6));
      var a=Math.atan2(pt.y-prev.y,pt.x-prev.x),side=(i%2?1:-1),r=13+((i*7+pi*3)%9);
      for(var k=-1;k<2;k++){
        var ang=a+side*(1.15+k*0.34),e=document.createElementNS(NS,'path');
        e.setAttribute('d','M'+pt.x.toFixed(1)+' '+pt.y.toFixed(1)+' l'+(Math.cos(ang)*r).toFixed(1)+' '+(Math.sin(ang)*r).toFixed(1));
        host.appendChild(e);
      }
    }
  });
  var btns=[].slice.call(root.querySelectorAll('[data-step-btn]'));
  var toggle=root.querySelector('[data-motion-btn]');
  var NAMES={1:['1 底','1 Ground'],2:['2 花枝','2 Branch'],3:['3 建筑','3 Eaves'],4:['4 文字','4 Type']};
  function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en';}
  function text(){
    btns.forEach(function(b){b.textContent=NAMES[b.dataset.stepBtn][zh()?0:1];});
    var on=root.dataset.motion==='on';
    toggle.textContent=zh()?(on?'动态':'静止'):(on?'Motion':'Still');
  }
  function setStep(n){root.dataset.step=String(n);btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.stepBtn===String(n)?'true':'false');});root.dispatchEvent(new CustomEvent('gd:layout',{bubbles:true}));}
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,auto=!reduce,timer;
  if(reduce)root.dataset.motion='off';
  btns.forEach(function(b){b.addEventListener('click',function(){auto=false;clearTimeout(timer);setStep(+b.dataset.stepBtn);});});
  toggle.addEventListener('click',function(){
    var on=root.dataset.motion!=='on';
    root.dataset.motion=on?'on':'off';toggle.setAttribute('aria-pressed',on?'true':'false');text();
  });
  function cycle(){if(!auto)return;timer=setTimeout(function(){setStep(+root.dataset.step%4+1);cycle();},2800);}
  document.addEventListener('learnui:languagechange',text);
  text();cycle();
})();
</script>
