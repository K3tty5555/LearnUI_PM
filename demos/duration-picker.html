<div class="demo demo-duration-picker">
  <div class="duration-card">
    <div class="duration-head"><strong>Session length</strong><span>Set a duration</span></div>
    <div class="duration-fields"><label><span>Hours</span><input class="dur-hours" type="number" min="0" max="12" value="0"></label><span class="duration-colon">:</span><label><span>Minutes</span><input class="dur-minutes" type="number" min="0" max="59" step="5" value="45"></label></div>
    <div class="duration-presets" role="group" aria-label="Duration presets"><button type="button" data-min="15">15 min</button><button type="button" data-min="30">30 min</button><button type="button" data-min="60">1 hr</button></div>
    <div class="duration-summary" role="status"><span>Total duration</span><strong>45 minutes</strong></div>
  </div>
</div>
<style>
.demo-duration-picker{--d-ink:#252932;--d-muted:#6b7280;--d-line:#dfe3e8;--d-accent:#3467d6;font:12px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--d-ink);width:100%;max-width:390px}.demo-duration-picker *{box-sizing:border-box}.duration-card{padding:16px;border:1px solid var(--d-line);border-radius:12px;background:#fff;box-shadow:0 8px 20px rgba(30,40,60,.06)}.duration-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.duration-head strong{font-size:13px}.duration-head span{color:var(--d-muted);font-size:10px}.duration-fields{display:flex;align-items:end;gap:8px}.duration-fields label{display:grid;gap:5px;flex:1}.duration-fields label>span{color:var(--d-muted);font-size:10px}.duration-fields input{width:100%;height:40px;padding:0 10px;border:1px solid var(--d-line);border-radius:8px;background:#fafbfc;color:var(--d-ink);font:600 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}.duration-fields input:focus-visible{outline:0;border-color:var(--d-accent);box-shadow:0 0 0 3px rgba(52,103,214,.15)}.duration-colon{padding-bottom:10px;color:var(--d-muted);font-weight:700}.duration-presets{display:flex;gap:6px;margin-top:12px}.duration-presets button{border:1px solid var(--d-line);border-radius:6px;background:#fff;color:var(--d-muted);padding:6px 10px;font:600 10px inherit;cursor:pointer;transition:background .16s,color .16s,border-color .16s}.duration-presets button:hover,.duration-presets button[aria-pressed=true]{border-color:#b7c8f3;background:#f3f6ff;color:var(--d-accent)}.duration-presets button:focus-visible{outline:2px solid var(--d-accent);outline-offset:2px}.duration-summary{display:flex;justify-content:space-between;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid #edf0f3;color:var(--d-muted);font-size:10px}.duration-summary strong{color:var(--d-ink);font-size:11px;font-variant-numeric:tabular-nums}@media(prefers-reduced-motion:reduce){.duration-presets button{transition:none}}
@media (max-height:260px){.demo-duration-picker{transform:scale(.82);transform-origin:center;}}
</style>
<script>
(function(){var root=document.currentScript.parentElement.querySelector('.demo-duration-picker'),h=root.querySelector('.dur-hours'),m=root.querySelector('.dur-minutes'),out=root.querySelector('.duration-summary strong'),presets=[].slice.call(root.querySelectorAll('.duration-presets button'));function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en'}function render(){var hours=Math.max(0,Math.min(12,parseInt(h.value||0,10))),mins=Math.max(0,Math.min(59,parseInt(m.value||0,10)));var total=hours*60+mins;h.value=Math.floor(total/60);m.value=total%60;out.textContent=zh()?(total===0?'0 分钟':(Math.floor(total/60)?Math.floor(total/60)+' 小时'+(total%60?' '+total%60+' 分钟':''):total+' 分钟')):(total===0?'0 minutes':(Math.floor(total/60)?Math.floor(total/60)+' hr'+(Math.floor(total/60)>1?'s':'')+(total%60?' '+total%60+' min':''):total+' minutes'));presets.forEach(function(p){p.setAttribute('aria-pressed',Number(p.dataset.min)===total?'true':'false')})} [h,m].forEach(function(i){i.addEventListener('input',render);i.addEventListener('blur',render)});presets.forEach(function(p){p.addEventListener('click',function(){var total=Number(p.dataset.min);h.value=Math.floor(total/60);m.value=total%60;render()})});document.addEventListener('learnui:languagechange',render);render()})();
</script>
