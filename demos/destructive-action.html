<div class="demo demo-destructive-action">
  <div class="danger-card"><div><strong>Project Atlas</strong><span>Shared with 8 teammates</span></div><button type="button" class="danger-trigger">Delete project</button></div>
  <div class="danger-confirm" role="alertdialog" aria-labelledby="danger-title" aria-describedby="danger-copy" hidden><strong id="danger-title">Delete Project Atlas?</strong><p id="danger-copy">This removes the project and its saved views. You can undo this for 10 seconds.</p><div><button type="button" class="danger-cancel">Cancel</button><button type="button" class="danger-final">Delete project</button></div></div>
  <div class="danger-feedback" role="status" aria-live="polite" hidden>Project deleted <button type="button" class="danger-undo">Undo</button></div>
</div>
<style>
.demo-destructive-action{--x-ink:#252932;--x-muted:#69727f;--x-line:#dce1e8;--x-danger:#b43745;--x-danger-bg:#fff5f5;font:12px/1.45 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--x-ink);width:100%;max-width:470px}.demo-destructive-action *{box-sizing:border-box}.danger-card,.danger-confirm{padding:15px;border:1px solid var(--x-line);border-radius:12px;background:#fff;box-shadow:0 8px 20px rgba(30,40,60,.06)}.danger-card{display:flex;align-items:center;justify-content:space-between;gap:14px}.danger-card strong,.danger-card span{display:block}.danger-card strong{font-size:13px}.danger-card span{margin-top:3px;color:var(--x-muted);font-size:10px}.danger-trigger,.danger-final{border:1px solid #e1a4ab;border-radius:7px;background:var(--x-danger-bg);color:var(--x-danger);padding:7px 9px;font:600 10px inherit;cursor:pointer}.danger-trigger:hover,.danger-final:hover{background:#ffecee}.danger-trigger:focus-visible,.danger-final:focus-visible,.danger-cancel:focus-visible,.danger-undo:focus-visible{outline:2px solid var(--x-danger);outline-offset:2px}.danger-confirm{margin-top:8px;border-color:#e7b8bd;background:#fffafa}.danger-confirm[hidden],.danger-feedback[hidden]{display:none}.danger-confirm>strong{font-size:13px}.danger-confirm p{margin:7px 0 12px;color:var(--x-muted);font-size:10px;line-height:1.6}.danger-confirm>div{display:flex;justify-content:end;gap:6px}.danger-cancel{border:1px solid var(--x-line);border-radius:7px;background:#fff;color:var(--x-ink);padding:7px 9px;font:600 10px inherit;cursor:pointer}.danger-feedback{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding:10px 12px;border-radius:8px;background:#edf8f3;color:#176b4b;font-size:10px}.danger-undo{border:0;background:none;color:#176b4b;font:700 10px inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
</style>
<script>
(function(){var root=document.currentScript.parentElement.querySelector('.demo-destructive-action'),trigger=root.querySelector('.danger-trigger'),confirm=root.querySelector('.danger-confirm'),cancel=root.querySelector('.danger-cancel'),finalBtn=root.querySelector('.danger-final'),feedback=root.querySelector('.danger-feedback'),undo=root.querySelector('.danger-undo'),timer;function open(){confirm.hidden=false;trigger.disabled=true;cancel.focus()}function close(){confirm.hidden=true;trigger.disabled=false;trigger.focus()}function deleted(){confirm.hidden=true;feedback.hidden=false;clearTimeout(timer);timer=setTimeout(function(){feedback.hidden=true;trigger.disabled=false},10000)}trigger.addEventListener('click',open);cancel.addEventListener('click',close);finalBtn.addEventListener('click',deleted);undo.addEventListener('click',function(){feedback.hidden=true;trigger.disabled=false;trigger.focus()})})();
</script>
