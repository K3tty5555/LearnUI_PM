<div class="demo demo-streaming-response">
  <article class="stream-card"><div class="stream-head"><span><b>Answer</b><small>Generated from 3 sources</small></span><span class="stream-dot" aria-hidden="true"></span></div><p class="stream-text">A good agent keeps its work visible: show the current step, preserve partial results, and ask before consequential actions.</p><div class="stream-actions"><button type="button" class="stream-stop">Stop</button><button type="button" class="stream-retry">Retry</button><button type="button" class="stream-copy">Copy</button></div><span class="stream-status" role="status" aria-live="polite">Generating…</span></article>
</div>
<style>
.demo-streaming-response{--s-ink:#20242c;--s-muted:#707783;--s-line:#e0e4ea;--s-blue:#315fc8;font:12px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--s-ink);width:100%;max-width:490px}.demo-streaming-response *{box-sizing:border-box}.stream-card{padding:15px;border:1px solid var(--s-line);border-radius:12px;background:#fff;box-shadow:0 8px 22px rgba(31,42,61,.07)}.stream-head,.stream-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.stream-head b,.stream-head small{display:block}.stream-head b{font-size:13px}.stream-head small{margin-top:2px;color:var(--s-muted);font-size:9px}.stream-dot{width:7px;height:7px;border-radius:50%;background:var(--s-blue);box-shadow:0 0 0 4px #edf2ff;animation:stream-pulse 1.1s ease-in-out infinite}.stream-text{min-height:58px;margin:18px 0 13px;font-size:12px;line-height:1.8}.stream-text::after{content:"";display:inline-block;width:2px;height:13px;margin-left:3px;vertical-align:-2px;background:var(--s-blue);animation:stream-caret .8s steps(1) infinite}.stream-card[data-done=true] .stream-text::after,.stream-card[data-done=true] .stream-dot{display:none}.stream-actions{justify-content:flex-start}.stream-actions button{border:1px solid var(--s-line);border-radius:6px;background:#fff;color:var(--s-ink);padding:6px 9px;font:600 10px inherit;cursor:pointer}.stream-actions button:hover{border-color:#aebfe9;background:#f3f6ff}.stream-actions button:focus-visible{outline:2px solid var(--s-blue);outline-offset:2px}.stream-stop{color:var(--s-blue)!important}.stream-status{display:block;min-height:16px;margin-top:9px;color:var(--s-muted);font-size:10px}@keyframes stream-pulse{50%{opacity:.35}}@keyframes stream-caret{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.stream-dot,.stream-text::after{animation:none}}
@media (max-height: 260px) { .demo-streaming-response { transform: scale(.72); transform-origin: center; } }
</style>
<script>(function(){var root=document.currentScript.parentElement.querySelector('.demo-streaming-response'),text=root.querySelector('.stream-text'),status=root.querySelector('.stream-status'),stop=root.querySelector('.stream-stop'),retry=root.querySelector('.stream-retry'),copy=root.querySelector('.stream-copy'),FULL_EN='A good agent keeps its work visible: show the current step, preserve partial results, and ask before consequential actions.',FULL_ZH='好的 Agent 会让工作过程可见：展示当前步骤，保留部分结果，并在关键操作前请求确认。',timer,at=0;function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en'}function start(){clearInterval(timer);at=0;root.dataset.done='';text.textContent='';status.textContent=zh()?'正在生成…':'Generating…';var full=zh()?FULL_ZH:FULL_EN;timer=setInterval(function(){at=Math.min(full.length,at+4);text.textContent=full.slice(0,at);if(at>=full.length){clearInterval(timer);root.dataset.done='true';status.textContent=zh()?'生成完成':'Complete'}},120)}stop.addEventListener('click',function(){clearInterval(timer);root.dataset.done='true';status.textContent=zh()?'已停止，已保留部分内容':'Stopped. Partial answer kept.'});retry.addEventListener('click',start);copy.addEventListener('click',function(){if(navigator.clipboard)navigator.clipboard.writeText(text.textContent);status.textContent=zh()?'已复制回答':'Answer copied'});document.addEventListener('learnui:languagechange',function(){status.textContent=root.dataset.done==='true'?(zh()?'生成完成':'Complete'):(zh()?'正在生成…':'Generating…')});start()})();</script>
