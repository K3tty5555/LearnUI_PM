<div class="demo demo-animated-counter">
  <div class="counter-card"><div><span class="counter-label">Completed tasks</span><strong class="counter-value" aria-hidden="true">1,240</strong></div><div class="counter-actions"><button type="button" data-value="1240" aria-label="Show 1,240">1,240</button><button type="button" data-value="1860" aria-label="Show 1,860">1,860</button><button type="button" data-value="980" aria-label="Show 980">980</button></div></div>
  <span class="counter-status" role="status" aria-live="polite">1,240 completed tasks</span>
</div>
<style>
.demo-animated-counter{--c-ink:#20232a;--c-muted:#6c7480;--c-line:#dce1e8;--c-accent:#3467d6;font:12px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--c-ink);width:100%;max-width:430px}.demo-animated-counter *{box-sizing:border-box}.counter-card{display:flex;justify-content:space-between;align-items:end;gap:16px;padding:16px;border:1px solid var(--c-line);border-radius:12px;background:linear-gradient(145deg,#fff,#f7f9fc);box-shadow:0 8px 22px rgba(30,45,70,.07)}.counter-label{display:block;color:var(--c-muted);font-size:10px}.counter-value{display:block;margin-top:5px;font:650 32px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.counter-actions{display:flex;flex-wrap:wrap;justify-content:end;gap:5px}.counter-actions button{border:1px solid var(--c-line);border-radius:6px;background:#fff;color:var(--c-muted);padding:6px 7px;font:600 9px inherit;cursor:pointer}.counter-actions button:hover,.counter-actions button[aria-pressed=true]{border-color:#b7c8f3;background:#f3f6ff;color:var(--c-accent)}.counter-actions button:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}.counter-status{display:block;min-height:16px;margin-top:9px;color:var(--c-muted);font-size:10px}.counter-value.is-changing{animation:counter-settle 450ms cubic-bezier(.16,1,.3,1)}@keyframes counter-settle{from{opacity:.45;transform:translateY(4px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}@media(max-width:390px){.counter-card{align-items:start;flex-direction:column}.counter-actions{justify-content:start}}@media(prefers-reduced-motion:reduce){.counter-value.is-changing{animation:none}}
</style>
<script>
(function(){var root=document.currentScript.parentElement.querySelector('.demo-animated-counter'),valueEl=root.querySelector('.counter-value'),status=root.querySelector('.counter-status'),buttons=[].slice.call(root.querySelectorAll('.counter-actions button')),current=1240,frame=0;function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en'}function fmt(n){return Math.round(n).toLocaleString('en-US')}function announce(n){status.textContent=zh()?'已完成 '+fmt(n)+' 项任务':fmt(n)+' completed tasks'}function set(target){cancelAnimationFrame(frame);var start=current,t0=performance.now(),reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduced){current=target;valueEl.textContent=fmt(target);announce(target);return}function tick(now){var p=Math.min(1,(now-t0)/450),e=1-Math.pow(1-p,3);current=start+(target-start)*e;valueEl.textContent=fmt(current);if(p<1)frame=requestAnimationFrame(tick);else{current=target;valueEl.textContent=fmt(target);announce(target);valueEl.classList.remove('is-changing')}}valueEl.classList.remove('is-changing');void valueEl.offsetWidth;valueEl.classList.add('is-changing');frame=requestAnimationFrame(tick)}buttons.forEach(function(b){b.addEventListener('click',function(){buttons.forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});set(Number(b.dataset.value))})});buttons[0].setAttribute('aria-pressed','true');document.addEventListener('learnui:languagechange',function(){announce(current)});announce(current)})();
</script>
