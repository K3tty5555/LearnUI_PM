<div class="demo demo-otp-input">
  <div class="otp-shell" role="group" aria-labelledby="otp-label" aria-describedby="otp-help otp-status">
    <div class="otp-head"><div><strong id="otp-label">Verification code</strong><span id="otp-help">Enter the 6-digit code</span></div><button type="button" class="otp-clear">Clear</button></div>
    <div class="otp-slots" role="group" aria-label="Six digit verification code">
      <input maxlength="1" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1"><input maxlength="1" inputmode="numeric" aria-label="Digit 2"><input maxlength="1" inputmode="numeric" aria-label="Digit 3"><input maxlength="1" inputmode="numeric" aria-label="Digit 4"><input maxlength="1" inputmode="numeric" aria-label="Digit 5"><input maxlength="1" inputmode="numeric" aria-label="Digit 6">
    </div>
    <p class="otp-status" id="otp-status" role="status">Paste a code or type each digit.</p>
  </div>
</div>
<style>
.demo-otp-input{--o-ink:#20232a;--o-muted:#66707c;--o-line:#d8dde5;--o-accent:#3467d6;font:12px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--o-ink);width:100%;max-width:430px}.demo-otp-input *{box-sizing:border-box}.otp-shell{padding:16px;border:1px solid var(--o-line);border-radius:12px;background:linear-gradient(145deg,#fff,#f5f7fa);box-shadow:0 8px 22px rgba(30,45,70,.08)}.otp-head{display:flex;align-items:start;justify-content:space-between;gap:8px;margin-bottom:13px}.otp-head strong,.otp-head span{display:block}.otp-head strong{font-size:13px}.otp-head span{margin-top:2px;color:var(--o-muted);font-size:10px}.otp-clear{border:0;background:none;color:var(--o-accent);font:600 10px inherit;cursor:pointer;padding:3px 2px}.otp-clear:focus-visible{outline:2px solid var(--o-accent);outline-offset:3px;border-radius:4px}.otp-slots{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.otp-slots input{width:100%;height:45px;border:1px solid var(--o-line);border-radius:8px;background:#fff;text-align:center;font:600 20px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--o-ink);font-variant-numeric:tabular-nums;caret-color:var(--o-accent);transition:border-color .16s,box-shadow .16s,transform .16s}.otp-slots input:focus-visible{outline:0;border-color:var(--o-accent);box-shadow:0 0 0 3px rgba(52,103,214,.16);transform:translateY(-1px)}.otp-slots input.is-filled{background:#f5f8ff;border-color:#b7c8f3}.otp-slots input.is-invalid{border-color:#bd3e4b;background:#fff7f7}.otp-status{min-height:17px;margin:10px 0 0;color:var(--o-muted);font-size:10px}.otp-status.is-success{color:#176b4b}.otp-status.is-error{color:#a12f3c}@media(max-width:390px){.otp-shell{padding:12px}.otp-slots{gap:5px}.otp-slots input{height:42px;font-size:18px}}@media(prefers-reduced-motion:reduce){.otp-slots input{transition:none}}
</style>
<script>
(function(){var root=document.currentScript.parentElement.querySelector('.demo-otp-input'),slots=[].slice.call(root.querySelectorAll('.otp-slots input')),status=root.querySelector('.otp-status'),clear=root.querySelector('.otp-clear');function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en'}function value(){return slots.map(function(s){return s.value}).join('')}function render(){slots.forEach(function(s){s.classList.toggle('is-filled',!!s.value)});var v=value();status.className='otp-status';if(v.length===6){status.textContent=zh()?'验证码已完成，可以验证。':'Code complete — ready to verify.';status.classList.add('is-success')}else status.textContent=zh()?'粘贴验证码，或逐位输入。':'Paste a code or type each digit.'}function fill(text){var chars=(text||'').replace(/\D/g,'').slice(0,6).split('');slots.forEach(function(s,i){s.value=chars[i]||''});var at=Math.min(chars.length,5);slots[at].focus();render()}slots.forEach(function(s,i){s.addEventListener('input',function(){s.value=s.value.replace(/\D/g,'').slice(-1);if(s.value&&i<5)slots[i+1].focus();render()});s.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!s.value&&i>0){slots[i-1].value='';slots[i-1].focus();render()}if(e.key==='ArrowLeft'&&i>0){e.preventDefault();slots[i-1].focus()}if(e.key==='ArrowRight'&&i<5){e.preventDefault();slots[i+1].focus()}});s.addEventListener('paste',function(e){e.preventDefault();fill((e.clipboardData||window.clipboardData).getData('text'))})});clear.addEventListener('click',function(){slots.forEach(function(s){s.value=''});slots[0].focus();render()});document.addEventListener('learnui:languagechange',render);render()})();
</script>
