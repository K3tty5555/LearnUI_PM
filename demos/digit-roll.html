<div class="demo demo-digit-roll">
  <div class="dr-stage">
    <div class="dr-card">
      <div class="dr-row">
        <span class="dr-thumb" aria-hidden="true"></span>
        <span class="dr-meta"><b class="dr-name">Ember desk lamp</b><span class="dr-unit">$149 each</span></span>
        <span class="dr-qty">
          <button class="dr-btn dr-minus" type="button" aria-label="Decrease quantity">−</button>
          <span class="dr-num dr-q" role="status" aria-live="polite"></span>
          <button class="dr-btn dr-plus" type="button" aria-label="Increase quantity">+</button>
        </span>
      </div>
      <div class="dr-total"><span class="dr-total-label">Total</span><span class="dr-big"><span class="dr-cur">$</span><span class="dr-num dr-t"></span></span></div>
    </div>
    <svg class="dr-ghost" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 1.5v12l3.4-3.1 2.2 4.8 2-.9-2.2-4.7H12z"/></svg>
  </div>
  <p class="dr-read"><code>each digit is a column of 0–9 that scrolls to its new value</code></p>
</div>
<style>
.demo-digit-roll{width:min(560px,calc(100vw - 80px));color:#1c1d21;font:13px/1.45 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.demo-digit-roll *{box-sizing:border-box}
.dr-stage{position:relative;height:236px;border-radius:14px;overflow:hidden;background:#f6f5f1;border:1px solid #e4e2da;display:grid;place-items:center}
.dr-card{width:min(400px,88%);padding:16px 18px;border-radius:14px;background:#fff;border:1px solid #e4e2da;display:flex;flex-direction:column;gap:14px}
.dr-row{display:flex;align-items:center;gap:12px}
.dr-thumb{width:40px;height:40px;border-radius:10px;flex:none;background:linear-gradient(140deg,#2a2622,#ffb36b)}
.dr-meta{flex:1;min-width:0;display:flex;flex-direction:column}.dr-name{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dr-unit{color:#6b6f7a;font-size:11px}
.dr-qty{display:flex;align-items:center;gap:6px;padding:3px;border:1px solid #e4e2da;border-radius:999px}
.dr-btn{width:28px;height:28px;border:0;border-radius:50%;background:#f3f2ee;color:#1c1d21;font:600 16px/1 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer}
.dr-btn:disabled{opacity:.35;cursor:not-allowed}
.dr-btn:focus-visible{outline:2px solid #4338ca;outline-offset:2px}
.dr-btn.is-down{background:#e4e2da}
.dr-total{display:flex;align-items:baseline;justify-content:space-between;padding-top:12px;border-top:1px dashed #e4e2da}
.dr-total-label{color:#6b6f7a;font-size:12px}
.dr-big{display:flex;align-items:baseline;font:700 34px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em}
.dr-cur{font-size:.6em;margin-right:2px;color:#6b6f7a}
/* One window per digit, one em tall; the column of digits inside it slides. */
.dr-num{display:inline-flex;font-variant-numeric:tabular-nums}
.dr-q{font:700 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;min-width:12px;justify-content:center}
.dr-win{display:inline-block;height:1em;overflow:hidden;line-height:1}
.dr-col{display:flex;flex-direction:column;transition:transform .62s cubic-bezier(.2,.8,.2,1)}
.dr-col span{height:1em;line-height:1;text-align:center}
.dr-ghost{position:absolute;left:0;top:0;z-index:2;width:16px;height:16px;fill:#fff;stroke:#111;stroke-width:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));pointer-events:none;opacity:0;transition:opacity .3s}
.demo-digit-roll[data-auto="on"] .dr-ghost{opacity:1}
.dr-read{margin:7px 0 0;color:#6b6f7a;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-reduced-motion:reduce){.dr-col{transition:none}}
@media (max-height:260px){
  .demo-digit-roll{width:calc(100vw - 40px)}
  .dr-stage{height:calc(100vh - 40px)}
  .dr-card{width:calc(100% - 28px);padding:10px 12px;gap:8px;border-radius:11px}
  .dr-row{gap:8px}.dr-thumb{width:30px;height:30px;border-radius:8px}.dr-name{font-size:11.5px}.dr-unit{font-size:9.5px}
  .dr-btn{width:22px;height:22px;font-size:13px}.dr-q{font-size:12px}
  .dr-total{padding-top:7px}.dr-total-label{font-size:10px}.dr-big{font-size:26px}
  .dr-read{display:none}
}
</style>
<script>
(function(){
  var root=document.currentScript.parentElement.querySelector('.demo-digit-roll');
  var stage=root.querySelector('.dr-stage'),ghost=root.querySelector('.dr-ghost'),read=root.querySelector('.dr-read code');
  var qEl=root.querySelector('.dr-q'),tEl=root.querySelector('.dr-t'),minus=root.querySelector('.dr-minus'),plus=root.querySelector('.dr-plus');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var PRICE=149,MAX=6,qty=1,auto=!reduce,visible=true,raf=0,start=performance.now(),idle,lastT=0;
  function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en';}
  function text(){root.querySelector('.dr-name').textContent=zh()?'余烬台灯':'Ember desk lamp';root.querySelector('.dr-unit').textContent=zh()?'单价 $149':'$149 each';root.querySelector('.dr-total-label').textContent=zh()?'合计':'Total';minus.setAttribute('aria-label',zh()?'减少数量':'Decrease quantity');plus.setAttribute('aria-label',zh()?'增加数量':'Increase quantity');}
  function setAuto(v){auto=v;root.dataset.auto=v?'on':'off';}
  // A counter is a row of windows; each window holds a column 0-9 twice over, so a roll can always keep going
  // the same way (9 -> 0 when counting up scrolls on to the second 0, then snaps back without a transition).
  function counter(el){
    var cols=[];
    function make(n){
      while(cols.length<n){var w=document.createElement('span');w.className='dr-win';w.setAttribute('aria-hidden','true');var c=document.createElement('span');c.className='dr-col';c.setAttribute('data-clip-ok','');for(var i=0;i<20;i++){var d=document.createElement('span');d.textContent=i%10;c.appendChild(d);}w.appendChild(c);el.insertBefore(w,el.firstChild);cols.unshift({col:c,pos:0});}
      while(cols.length>n){el.removeChild(el.firstChild);cols.shift();}
    }
    function place(c,pos,animate,delay){c.col.style.transition=animate?'':'none';c.col.style.transitionDelay=animate?delay+'ms':'0ms';c.col.style.transform='translateY('+(-pos*5)+'%)';c.pos=pos;}
    return {set:function(value,dir){
      var s=String(value);make(s.length);var rolled=0;
      for(var i=0;i<s.length;i++){
        var c=cols[i],d=+s[i],from=c.pos%10;
        if(c.pos>=10){place(c,from,false,0);void c.col.offsetHeight;}
        if(d===from)continue;
        var target=d;if(dir>0&&d<from)target=d+10;if(dir<0&&d>from){place(c,from+10,false,0);void c.col.offsetHeight;}
        rolled++;place(c,target,!reduce,(s.length-1-i)*55);
        (function(c,d,tok){setTimeout(function(){if(c.tok===tok&&c.pos!==d){place(c,d,false,0);}},reduce?0:900);})(c,d,c.tok=(c.tok||0)+1);
      }
      el.setAttribute('aria-label',s);return rolled;
    }};
  }
  var q=counter(qEl),t=counter(tEl);
  function update(dir){
    var r=t.set(qty*PRICE,dir);q.set(qty,dir);minus.disabled=qty<=1;plus.disabled=qty>=MAX;
    read.textContent=(zh()?'数量 '+qty+' · 合计 '+qty*PRICE+' · '+r+' 位数字'+(dir>0?'向上':'向下')+'滚动':'qty '+qty+' · total '+qty*PRICE+' · '+r+' digit'+(r===1?'':'s')+' rolled '+(dir>0?'up':'down'));
  }
  function step(dir){var n=Math.max(1,Math.min(MAX,qty+dir));if(n===qty)return;qty=n;update(dir);}
  minus.addEventListener('click',function(){if(!auto)step(-1);});
  plus.addEventListener('click',function(){if(!auto)step(1);});
  function pt(el,fx,fy){var r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return [r.left-s.left+r.width*fx,r.top-s.top+r.height*fy];}
  function ease(p){return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;}
  function seg(tt,t0,t1,a,b){var k=ease(Math.min(1,Math.max(0,(tt-t0)/(t1-t0))));return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];}
  function press(b){b.classList.add('is-down');setTimeout(function(){b.classList.remove('is-down');},140);}
  stage.addEventListener('pointermove',function(){if(root.dataset.auto==='on')setAuto(false);clearTimeout(idle);});
  stage.addEventListener('pointerleave',function(){clearTimeout(idle);idle=setTimeout(function(){if(!reduce){setAuto(true);start=performance.now();lastT=0;resume();}},1800);});
  // Auto: three presses up (1 -> 4), then three down, 9 s a loop.
  var CLICKS=[[1.2,1],[2.4,1],[3.6,1],[5.4,-1],[6.6,-1],[7.8,-1]];
  function tick(now){
    raf=0;if(!visible||!auto)return;
    var tt=(Math.max(0,now-start)/1000)%9,w=stage.clientWidth,h=stage.clientHeight,rest=[w*.5,h-20],P=pt(plus,.55,.6),M=pt(minus,.55,.6),p;
    if(tt<1)p=seg(tt,0,1,rest,P);else if(tt<4.4)p=P;else if(tt<5.2)p=seg(tt,4.4,5.2,P,M);else if(tt<8.2)p=M;else p=seg(tt,8.2,8.9,M,rest);
    CLICKS.forEach(function(c){if(lastT<c[0]&&tt>=c[0]){press(c[1]>0?plus:minus);step(c[1]);}});
    if(tt<lastT&&qty!==1){qty=1;update(-1);}
    var down=CLICKS.some(function(c){return tt>=c[0]&&tt<c[0]+.13;});
    ghost.style.transform='translate('+p[0].toFixed(1)+'px,'+p[1].toFixed(1)+'px)'+(down?' scale(.85)':'');
    lastT=tt;raf=requestAnimationFrame(tick);
  }
  function resume(){if(!raf&&visible&&auto)raf=requestAnimationFrame(tick);}
  if('IntersectionObserver' in window)new IntersectionObserver(function(es){visible=es[0].isIntersecting;resume();}).observe(stage);
  document.addEventListener('learnui:languagechange',function(){text();update(1);});
  text();setAuto(auto);update(1);
  if(reduce){
    root.dataset.auto='on';qty=3;update(1);var p=pt(plus,.55,.6);ghost.style.transform='translate('+p[0].toFixed(1)+'px,'+p[1].toFixed(1)+'px)';
    read.textContent=zh()?'减弱动态效果：数字直接换成新值，不滚动':'reduced motion: digits switch to the new value without rolling';
  }
  resume();
})();
</script>
