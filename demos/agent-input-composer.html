<div class="demo demo-agent-composer">
  <form class="composer-card"><div class="composer-label"><label for="agent-prompt">Ask the agent</label><span>⌘↵ to run</span></div><textarea id="agent-prompt" rows="2" placeholder="Describe the change you need…">Audit the onboarding flow and list the safest fixes.</textarea><div class="composer-context"><button type="button" class="context-pill" aria-pressed="true">Model · Claude 3.5</button><button type="button" class="context-pill" aria-pressed="false">Skill · UX audit</button><button type="button" class="context-pill" aria-pressed="false">Attach file</button><button type="button" class="enhance">Enhance</button><button type="submit" class="composer-send">Run agent</button></div><span class="composer-status" role="status" aria-live="polite">Ready</span></form>
</div>
<style>
.demo-agent-composer{--c-ink:#20242c;--c-muted:#717984;--c-line:#dfe3e9;--c-blue:#315fc8;font:12px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--c-ink);width:100%;max-width:510px}.demo-agent-composer *{box-sizing:border-box}.composer-card{padding:13px;border:1px solid var(--c-line);border-radius:12px;background:#fff;box-shadow:0 8px 22px rgba(31,42,61,.07)}.composer-label{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px}.composer-label label{font-weight:600;font-size:11px}.composer-label span{color:var(--c-muted);font:9px ui-monospace,monospace}.composer-card textarea{display:block;width:100%;resize:vertical;border:1px solid var(--c-line);border-radius:8px;padding:9px;color:var(--c-ink);background:#fafbfc;font:11px/1.6 inherit}.composer-card textarea:focus{outline:2px solid #c5d2f2;outline-offset:1px;border-color:#9db3eb}.composer-context{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px}.context-pill,.enhance,.composer-send{border:1px solid var(--c-line);border-radius:6px;background:#fff;color:var(--c-muted);padding:6px 8px;font:600 9px inherit;cursor:pointer}.context-pill[aria-pressed=true]{border-color:#aebfe9;background:#f3f6ff;color:var(--c-blue)}.context-pill:hover,.enhance:hover{border-color:#aebfe9;background:#f3f6ff}.context-pill:focus-visible,.enhance:focus-visible,.composer-send:focus-visible{outline:2px solid var(--c-blue);outline-offset:2px}.enhance{margin-left:auto}.composer-send{border-color:var(--c-ink);background:var(--c-ink);color:#fff}.composer-status{display:block;min-height:15px;margin-top:8px;color:var(--c-muted);font-size:10px}
</style>
<script>(function(){var root=document.currentScript.parentElement.querySelector('.demo-agent-composer'),form=root.querySelector('form'),area=root.querySelector('textarea'),status=root.querySelector('.composer-status'),enhance=root.querySelector('.enhance');function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en'}enhance.addEventListener('click',function(){area.value='Audit the onboarding flow, identify the three safest fixes, and explain their impact.';status.textContent=zh()?'草稿已增强，请确认后提交':'Draft enhanced. Review before sending'});form.addEventListener('submit',function(e){e.preventDefault();status.textContent=zh()?'Agent 已启动':'Agent started';form.querySelector('.composer-send').disabled=true;setTimeout(function(){form.querySelector('.composer-send').disabled=false},900)});root.querySelectorAll('.context-pill').forEach(function(b){b.addEventListener('click',function(){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')})});})();</script>
