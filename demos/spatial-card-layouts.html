<script>
(function () {
  var root = document.querySelector('.demo-style-spatial-card-layouts');
  if (!root) return;
  var viewport = root.querySelector('.sc-viewport');
  var status = root.querySelector('.sc-status');
  var descriptions = {
    depth: 'Depth stack: pull the cards apart along the z-axis.',
    fan: 'Fan spread: open the cards from one shared pivot.',
    cylinder: 'Cylinder: wrap the collection into a rotating ring.',
    sphere: 'Sphere: distribute cards across a rounded orbit.',
    helix: 'Helix: keep order while the cards climb in space.',
    wave: 'Wave grid: keep the grid and send depth through it.'
  };
  root.querySelectorAll('[data-mode]').forEach(function (button) {
    button.addEventListener('click', function () {
      var mode = button.getAttribute('data-mode');
      viewport.className = 'sc-viewport mode-' + mode;
      root.querySelectorAll('.sc-modes button').forEach(function (item) {
        var active = item === button;
        item.classList.toggle('is-active', active);
        item.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      status.textContent = descriptions[mode];
    });
  });
}());
</script>
