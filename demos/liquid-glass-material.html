      else if(qx>qy){dist=r-qx;nx=1;ny=0;}else{dist=r-qy;nx=0;ny=1;}
      var t=Math.max(0,Math.min(1,1-dist/edge)),s=t*t,i=((py+margin)*mw+px+margin)*4;
      d[i]=Math.round(128+127*s*nx*(ox<0?-1:1));d[i+1]=Math.round(128+127*s*ny*(oy<0?-1:1));d[i+2]=128;d[i+3]=255;
    }}
    ctx.putImageData(img,0,0);
    var url=c.toDataURL();
    feImage.setAttribute('href',url);feImage.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href',url);
    feImage.setAttribute('x',0);feImage.setAttribute('y',0);feImage.setAttribute('width',mw);feImage.setAttribute('height',mh);
    // Rim offset is 1.1 x the rim width; red bends 15% more than green, blue 15% less.
    var scale=2*1.1*edge;[1.15,1,.85].forEach(function(f,i){maps[i].setAttribute('scale',(scale*f).toFixed(1))});
  }
  function layout(){
    var rect=wall.getBoundingClientRect();if(!rect.width||!rect.height)return;
    W=Math.round(rect.width);H=Math.round(rect.height);
    var compact=H<170;root.classList.toggle('is-compact',compact);
    cw=Math.round(compact?Math.min(204,W*.64):Math.min(316,W*.8));ch=compact?82:(H<215?136:146);
    var r=compact?20:28;edge=Math.min(44,Math.round(ch*.3));margin=Math.ceil(edge*1.1*1.15)+8;
    card.style.setProperty('--lg-w',cw+'px');card.style.setProperty('--lg-h',ch+'px');card.style.setProperty('--lg-r',r+'px');card.style.setProperty('--lg-m',margin+'px');
    paintAll();buildMap();
    if(!drag&&auto){x=(W-cw)/2;y=(H-ch)/2;}
    x=Math.max(0,Math.min(W-cw,x));y=Math.max(0,Math.min(H-ch,y));place();sample();applyLayers();
  }
  function place(){
    card.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0)';
    copy.style.transform='translate3d('+(-x).toFixed(1)+'px,'+(-y).toFixed(1)+'px,0)';
  }
  // Average luminance and its spread under the card decide ink colour and tint strength.
  function sample(){
    if(!pixels)return;
    var d=pixels.data,pw=pixels.width,s=pixelScale,sum=0,sq=0,n=0;
    var x0=Math.round(x*s),y0=Math.round(y*s),x1=Math.round((x+cw)*s),y1=Math.round((y+ch)*s),step=Math.max(2,Math.round(4*s));
    for(var py=y0;py<y1;py+=step){for(var px=x0;px<x1;px+=step){var i=(py*pw+px)*4,l=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255;sum+=l;sq+=l*l;n++;}}
    if(!n)return;
    lum=sum/n;var spread=Math.sqrt(Math.max(0,sq/n-lum*lum)),busy=Math.min(1,spread/.25);
    tint=scene==='light'?.06+.16*busy:.16+.22*busy;
    card.style.setProperty('--lg-tint',tint.toFixed(3));
    if(on.ink){if(lum<.48)ink='light';else if(lum>.52)ink='dark';}
    root.dataset.ink=on.ink?ink:'plain';
    renderReadout();
  }
  function applyLayers(){
    LAYERS.forEach(function(k){if(k!=='ink')root.dataset[k]=on[k]?'on':'off'});
    chips.forEach(function(chip){chip.setAttribute('aria-pressed',on[chip.dataset.layer]?'true':'false')});
    var light=scene==='light'?' blur(2px) saturate(1.8) brightness(1.06)':' blur(2px) saturate(1.6) brightness(.8)';
    var f=(on.lens?'url(#'+uid+')':'')+(on.blur?light:'');
    lens.style.filter=f.trim()||'none';
    root.dataset.scene=scene;root.dataset.ink=on.ink?ink:'plain';
    renderText();
  }
  function renderReadout(){
    var zh=chinese(),t=Math.round(tint*100)+'%',l=lum.toFixed(2);
    var inkName=!on.ink?(zh?'固定':'fixed'):(ink==='light'?(zh?'浅色':'light'):(zh?'深色':'dark'));
    readout.textContent=zh?'亮度 '+l+' · 文字 '+inkName+' · 着色 '+(on.tint?t:'关'):'luminance '+l+' · ink '+inkName+' · tint '+(on.tint?t:'off');
  }
  function renderText(){
    var zh=chinese(),count=LAYERS.filter(function(k){return on[k]}).length;
    strip.setAttribute('aria-label',zh?'玻璃图层':'Glass layers');
    sceneBtn.setAttribute('aria-label',zh?'切换浅色和深色':'Switch light and dark');
    chips.forEach(function(chip){chip.textContent=pick(NAME[chip.dataset.layer])});
    autoBtn.textContent=zh?'自动演示':'Auto';autoBtn.setAttribute('aria-pressed',auto?'true':'false');
    if(!auto)badge.textContent=(zh?'手动 · ':'Manual · ')+count+'/6';
    else if(scene==='dark')badge.textContent=zh?'深色玻璃':'Dark glass';
    else if(count===0)badge.textContent=zh?'00 无材质':'00 Plain card';
    else if(count===6&&focusLayer==='ink')badge.textContent=zh?'06 文字着色 · 完成':'06 Ink · complete';
    else badge.textContent='0'+count+' + '+pick(NAME[LAYERS[count-1]]);
    note.textContent=pick(NOTE[scene==='dark'&&auto?'dark':focusLayer]);
    renderReadout();
  }
  function setStep(i){
    var s=SEQ[i];stepIndex=i;
    LAYERS.forEach(function(k,j){on[k]=j<s.n});
    var nextScene=s.scene||'light';
    focusLayer=s.n?LAYERS[s.n-1]:'none';
    if(nextScene!==scene){scene=nextScene;paintAll();}
    applyLayers();sample();
    clearTimeout(stepTimer);if(auto&&!held)stepTimer=setTimeout(function(){setStep((stepIndex+1)%SEQ.length)},s.ms);
  }
  function stopAuto(){auto=false;clearTimeout(stepTimer);renderText();}
  chips.forEach(function(chip){chip.addEventListener('click',function(){
    if(auto){stopAuto();}
    var k=chip.dataset.layer;on[k]=!on[k];focusLayer=on[k]?k:'none';applyLayers();sample();
  })});
  autoBtn.addEventListener('click',function(){
    if(auto){stopAuto();return;}
    auto=true;held=false;start=performance.now();setStep(0);
  });
  sceneBtn.addEventListener('click',function(){
    if(auto)stopAuto();
    scene=scene==='light'?'dark':'light';if(scene==='dark'&&focusLayer==='none')focusLayer='ink';
    paintAll();applyLayers();sample();
    if(scene==='dark')note.textContent=pick(NOTE.dark);
  });
  // Drag the card across the wallpaper to watch ink and tint adapt.
  card.addEventListener('pointerdown',function(e){
    if(auto)stopAuto();
    drag={dx:e.clientX-x,dy:e.clientY-y,id:e.pointerId};card.classList.add('is-dragging');
    try{card.setPointerCapture(e.pointerId)}catch(_){}
  });
  card.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.id)return;
    x=Math.max(0,Math.min(W-cw,e.clientX-drag.dx));y=Math.max(0,Math.min(H-ch,e.clientY-drag.dy));place();sample();
  });
  function endDrag(){drag=null;card.classList.remove('is-dragging');}
  card.addEventListener('pointerup',endDrag);card.addEventListener('pointercancel',endDrag);
  // Pause the build-up while someone is reading the detail page; drifting continues so the lens stays alive.
  ['pointerenter','focusin'].forEach(function(e){root.addEventListener(e,function(){if(!auto)return;held=true;clearTimeout(stepTimer)})});
  ['pointerleave','focusout'].forEach(function(e){root.addEventListener(e,function(){if(!auto||!held)return;held=false;setStep(stepIndex)})});
  function tick(now){
    raf=0;if(!visible)return;
    if(auto&&!reduce&&!drag){
      var t=(now-start)/1000,ax=Math.max(0,(W-cw)/2-6),ay=Math.max(0,Math.min(12,(H-ch)/2-4));
      var cy=(H-ch)/2;if(root.classList.contains('is-compact')){cy=Math.min(H-ch-4,cy+9);ay=Math.min(ay,4);}
      x=(W-cw)/2+ax*Math.sin(t*Math.PI*2/9);y=cy+ay*Math.sin(t*Math.PI*2/6.5);
      place();if(++frame%4===0)sample();
    }
    raf=requestAnimationFrame(tick);
  }
  function resume(){if(!raf&&visible)raf=requestAnimationFrame(tick);}
  if('IntersectionObserver' in window){new IntersectionObserver(function(es){visible=es[0].isIntersecting;resume();}).observe(wall);}
  if('ResizeObserver' in window){var last='';new ResizeObserver(function(){var r=wall.getBoundingClientRect(),k=Math.round(r.width)+'x'+Math.round(r.height);if(k!==last){last=k;layout();}}).observe(wall);}
  document.addEventListener('learnui:languagechange',renderText);
  // Reduced motion opens on the finished material instead of building it layer by layer.
  start=performance.now();layout();setStep(reduce?6:0);resume();
})();
</script>
