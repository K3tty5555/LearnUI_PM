<div class="demo demo-pagination">
  <ul class="pg-results" aria-live="polite"></ul>
  <nav class="pg-nav" aria-label="Pagination"></nav>
</div>
<style>
.demo-pagination{width:min(440px,calc(100vw - 80px));color:#1f2430;font:12px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.demo-pagination *{box-sizing:border-box}
.pg-results{display:grid;gap:5px;margin:0 0 10px;padding:0;list-style:none}
.pg-results li{display:flex;justify-content:space-between;padding:7px 10px;border:1px solid #e3e6ee;border-radius:8px;background:#fff;font-size:11.5px}
.pg-results li span{color:#6b7180;font:500 10px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
.pg-nav{display:flex;align-items:center;justify-content:center;gap:4px}
.pg-nav button,.pg-gap{min-width:30px;height:30px;padding:0 8px;border:1px solid #e3e6ee;border-radius:8px;background:#fff;color:#1f2430;font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer;transition:background .15s,color .15s}
.pg-nav button:hover:not(:disabled):not([aria-current]){background:#f4f6fa}
.pg-nav button[aria-current="page"]{background:#1f2430;border-color:#1f2430;color:#fff;cursor:default}
.pg-nav button:disabled{color:#c3c8d2;cursor:not-allowed}
.pg-nav button:focus-visible{outline:2px solid #4c6ef5;outline-offset:2px}
.pg-gap{display:grid;place-items:center;border-color:transparent;background:none;color:#6b7180;cursor:default}
.pg-arrow{font-family:system-ui!important}
@media (max-height:260px){.demo-pagination{width:calc(100vw - 40px)}.pg-results li:nth-child(n+3){display:none}.pg-results{margin-bottom:7px}.pg-nav button,.pg-gap{min-width:24px;height:26px;padding:0 5px;font-size:10.5px}}
</style>
<script>
(function(){
  var root=document.currentScript.parentElement.querySelector('.demo-pagination');
  var nav=root.querySelector('.pg-nav'),results=root.querySelector('.pg-results'),TOTAL=20,page=1,auto=true,timer;
  function zh(){return document.documentElement.getAttribute('data-lang-mode')!=='en';}
  // Always show first, last, current and its neighbours; collapse the rest into an ellipsis.
  function pages(){var set=[1,TOTAL,page-1,page,page+1].filter(function(p){return p>=1&&p<=TOTAL}).sort(function(a,b){return a-b});var out=[],prev=0;
    set.forEach(function(p){if(p===prev)return;if(p-prev===2)out.push(prev+1);else if(p-prev>2)out.push('…');out.push(p);prev=p;});return out;}
  function render(){var lbl=zh();nav.setAttribute('aria-label',lbl?'分页':'Pagination');
    nav.innerHTML='<button type="button" class="pg-arrow" data-go="'+(page-1)+'"'+(page===1?' disabled':'')+' aria-label="'+(lbl?'上一页':'Previous page')+'">‹</button>'+
      pages().map(function(p){return p==='…'?'<span class="pg-gap" aria-hidden="true">…</span>':'<button type="button" data-go="'+p+'"'+(p===page?' aria-current="page"':'')+' aria-label="'+(lbl?'第 '+p+' 页':'Page '+p)+'">'+p+'</button>'}).join('')+
      '<button type="button" class="pg-arrow" data-go="'+(page+1)+'"'+(page===TOTAL?' disabled':'')+' aria-label="'+(lbl?'下一页':'Next page')+'">›</button>';
    var first=(page-1)*3+1;results.innerHTML=[0,1,2].map(function(k){return '<li>'+(lbl?'订单 #':'Order #')+(1000+first+k)+'<span>'+(lbl?'第 ':'p.')+page+(lbl?' 页':'')+'</span></li>'}).join('');}
  nav.addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(!b||b.disabled)return;auto=false;clearTimeout(timer);page=+b.dataset.go;render();});
  var SEQ=[2,3,4,5,6,19,20,1];var k=0;
  function run(){if(!auto)return;page=SEQ[k%SEQ.length];k++;render();timer=setTimeout(run,1100);}
  document.addEventListener('learnui:languagechange',render);render();timer=setTimeout(run,1100);
})();
</script>
