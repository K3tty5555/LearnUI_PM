<div class="demo demo-agent-task-list">
  <div class="task-card"><div class="task-head"><div><b>Migration plan</b><span>3 of 4 steps complete</span></div><button type="button" class="task-cancel">Cancel run</button></div><ol class="tasks"><li data-state="done"><button type="button" class="task-toggle" aria-label="Mark step complete">✓</button><span><b>Inspect session schema</b><small>Completed 2 min ago</small></span></li><li data-state="done"><button type="button" class="task-toggle" aria-label="Mark step complete">✓</button><span><b>Write migration</b><small>Completed 1 min ago</small></span></li><li data-state="active" aria-current="step"><button type="button" class="task-toggle" aria-label="Mark step complete">3</button><span><b>Run verification</b><small>Checking middleware tests…</small></span></li><li data-state="blocked"><button type="button" class="task-toggle" aria-label="Retry blocked step">!</button><span><b>Deploy to staging</b><small>Blocked · staging permission required</small></span><button type="button" class="task-retry">Retry</button></li></ol><span class="task-status" role="status" aria-live="polite">Verification is in progress</span></div>
</div>
<style>
.demo-agent-task-list{--t-ink:#20242c;--t-muted:#717984;--t-line:#dfe3e9;--t-blue:#315fc8;--t-danger:#a23b45;font:12px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--t-ink);width:100%;max-width:500px}.demo-agent-task-list *{box-sizing:border-box}.task-card{padding:15px;border:1px solid var(--t-line);border-radius:12px;background:#fff;box-shadow:0 8px 22px rgba(31,42,61,.07)}.task-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.task-head b,.task-head span{display:block}.task-head b{font-size:13px}.task-head span{margin-top:3px;color:var(--t-muted);font-size:9px}.task-cancel,.task-retry{border:1px solid var(--t-line);border-radius:6px;background:#fff;color:var(--t-muted);padding:6px 8px;font:600 9px inherit;cursor:pointer}.task-cancel:hover,.task-retry:hover{border-color:#aebfe9;background:#f3f6ff}.task-cancel:focus-visible,.task-retry:focus-visible,.task-toggle:focus-visible{outline:2px solid var(--t-blue);outline-offset:2px}.tasks{display:grid;gap:7px;margin:16px 0 11px;padding:0;list-style:none}.tasks li{display:grid;grid-template-columns:23px 1fr auto;align-items:center;gap:8px;min-height:33px;color:var(--t-muted)}.tasks li[data-state=active]{color:var(--t-ink)}.tasks li[data-state=blocked]{color:var(--t-danger)}.task-toggle{display:grid;place-items:center;width:23px;height:23px;border:1px solid var(--t-line);border-radius:50%;background:#fff;color:var(--t-muted);font:600 10px ui-monospace,monospace;cursor:pointer}.tasks li[data-state=done] .task-toggle{border-color:#a7d6b8;background:#effaf2;color:#247047}.tasks li[data-state=active] .task-toggle{border-color:#aebfe9;background:#f3f6ff;color:var(--t-blue);box-shadow:0 0 0 3px #f3f6ff}.tasks li[data-state=blocked] .task-toggle{border-color:#e3b4bb;background:#fff3f4;color:var(--t-danger)}.tasks b,.tasks small{display:block}.tasks b{font-size:10px}.tasks small{margin-top:2px;font-size:9px}.task-status{display:block;border-top:1px solid #eef0f3;padding-top:10px;color:var(--t-muted);font-size:10px}
</style>
<script>(function(){var root=document.currentScript.parentElement.querySelector('.demo-agent-task-list'),retry=root.querySelector('.task-retry'),status=root.querySelector('.task-status'),blocked=root.querySelector('[data-state=blocked]');retry.addEventListener('click',function(){blocked.dataset.state='active';blocked.removeAttribute('aria-current');status.textContent=document.documentElement.getAttribute('data-lang-mode')==='en'?'Retrying staging deploy…':'正在重试部署到测试环境…';retry.disabled=true;setTimeout(function(){status.textContent=document.documentElement.getAttribute('data-lang-mode')==='en'?'Still blocked: permission required':'仍被阻塞：需要测试环境权限';retry.disabled=false;blocked.dataset.state='blocked'},700)});root.querySelector('.task-cancel').addEventListener('click',function(){status.textContent=document.documentElement.getAttribute('data-lang-mode')==='en'?'Run cancelled':'运行已取消'});})();</script>
